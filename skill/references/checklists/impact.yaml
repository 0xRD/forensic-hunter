  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_delete/file_delete_win_delete_prefetch.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/23: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; MW-Sysmon/Operational/26: Microsoft docs,
    rule project.  Open: event ids, channel and fields are confirmed (see above) but the detection logic
    goes beyond what any opened rule/source states: Event meanings confirmed by the Sysmon docs; the burst
    threshold is a heuristic with no source. || Original notes: Event meanings confirmed by the Sysmon
