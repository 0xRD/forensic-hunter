  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/4798: MITRE CTI data-component
    log source, real sample log.  Open: event ids, channel and fields are confirmed (see above) but the
    detection logic goes beyond what any opened rule/source states: No opened source documents the field
    list; the filter is a baseline suggestion. || Original notes: Use as corroboration only. No opened
    source documents the field list; the filter is a baseline suggestion.'
- id: FH-DISC-010
  title: PowerView / AD PowerShell enumeration in script blocks
  tactic: discovery
  attack:
  - T1087.002
  - T1069.002
  - T1482
  - T1018
  - T1016
  channel: Microsoft-Windows-PowerShell/Operational
  provider: Microsoft-Windows-PowerShell
  event_ids:
  - 4104
  prerequisites:
  - PowerShell Script Block Logging enabled
  logic:
    selection:
      EventID: 4104
      ScriptBlockText|contains:
      - Get-DomainUser
      - Get-DomainComputer
      - Get-DomainGroupMember
      - Get-DomainTrust
      - Get-NetDomain
      - Find-LocalAdminAccess
      - Invoke-ShareFinder
      - Invoke-UserHunter
      - Get-ADComputer
      - Get-ADUser
      - Get-ADForest
      - DirectorySearcher
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~Get-DomainUser --format llm
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~DirectorySearcher --format llm
  pivots:
  - 'Get-AD* only exists where the RSAT/AD module is present: from a non-admin workstation it is unusual
    (EVTX-to-MITRE catalog flags AD module use from non-admin hosts)'
  - 'Long scripts are split across several 4104 events (MessageNumber/MessageTotal): reassemble by ScriptBlockId'
  false_positives:
  - Admin scripts, Exchange/AD management tooling, inventory scripts
  severity: medium
  sources:
  - https://raw.githubusercontent.com/mdecrevoisier/EVTX-to-MITRE-Attack/master/README.md
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/powershell/powershell_script/posh_ps_software_discovery.yml
