# cargo-deny policy: licences, advisories, bans and sources.
# Run: cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `encoding` (legacy code pages for ANSI strings in EVTX) is unmaintained but
    # has no known vulnerability; it is a dependency of the `evtx` crate. Revisit
    # when evtx moves to encoding_rs (see docs/DECISIONS.md D-016).
    { id = "RUSTSEC-2021-0153", reason = "transitive via evtx; unmaintained, no vulnerability" },
    # Unbounded allocation in evtx's `.wevtcache` reader. That reader is behind
    # the `wevt_templates` feature (`#[cfg(feature = "wevt_templates")]` in
    # evtx/src/lib.rs), which forhunt does not enable: `default-features =
    # false`, no feature named (check: `cargo tree -e features -i evtx`). The
    # code is not in the binary. The fix is in evtx 0.15.1, which also changes
    # how GUIDs are written; moving to it is in docs/ROADMAP.md (D-057).
    { id = "RUSTSEC-2026-0431", reason = "in evtx's wevt_templates feature, which is not compiled in" },
]

[licenses]
version = 2
# Permissive licences only. Copyleft (GPL/LGPL/AGPL, MPL) is not allowed in the
# binary: Hayabusa (GPLv3) is deliberately kept as an external download.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
# Workspace members are dual MIT OR Apache-2.0 (see LICENSE-*).
crate = "evtx-gen"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
