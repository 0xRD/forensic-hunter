# Forensic Hunter field map, format version 1.
#
# [channels]  short channel aliases, used in compact output and accepted by --channel.
# [fields]    short names for payload fields in the `llm` format.
# [[event]]   per (channel, id): a title and the ordered list of fields kept in
#             the `llm` format. Events without an entry keep all non-blank fields.
#
# A custom map (same format) can be passed with --map; its entries extend and
# override these.

version = 1

[channels]
"Security" = "Sec"
"System" = "Sys"
"Application" = "App"
"Microsoft-Windows-Sysmon/Operational" = "Sysmon"
"Microsoft-Windows-PowerShell/Operational" = "PS"
"Windows PowerShell" = "PSClassic"
"Microsoft-Windows-WMI-Activity/Operational" = "WMI"
"Microsoft-Windows-TaskScheduler/Operational" = "Task"
"Microsoft-Windows-TerminalServices-LocalSessionManager/Operational" = "TS-LSM"
"Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational" = "TS-RCM"
"Microsoft-Windows-RemoteDesktopServices-RdpCoreTS/Operational" = "RdpCoreTS"
"Microsoft-Windows-WinRM/Operational" = "WinRM"
"Microsoft-Windows-Windows Defender/Operational" = "Defender"
"Microsoft-Windows-Bits-Client/Operational" = "BITS"
"Microsoft-Windows-Windows Firewall With Advanced Security/Firewall" = "Firewall"
"Microsoft-Windows-SMBServer/Security" = "SMBServer"
"Microsoft-Windows-NTLM/Operational" = "NTLM"
"Microsoft-Windows-CodeIntegrity/Operational" = "CodeIntegrity"
"Directory Service" = "DS"
"ForwardedEvents" = "Fwd"

