  logic:
    selection:
      EventID: 30
      Source: Run dialog
      Command|re: (powershell|cmd|mshta|wscript|cscript|rundll32|regsvr32|certutil|bitsadmin|curl|https?:|\\\\)
    condition: selection
  forhunt:
  - forhunt search <paths> -c Registry -e 30 -f 'Source=Run dialog' --regex 'Command=(powershell|cmd|mshta|wscript|cscript|rundll32|regsvr32|certutil|bitsadmin|curl|https?:|\\\\)' --format llm
