- id: FH-IMP-013
  title: Mass file creation or rename burst with ransom-note style names (Sysmon 11)
  tactic: impact
  attack:
  - T1486
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 11
  prerequisites:
  - Sysmon installed with a config that logs event 11 (FileCreate). Many configs exclude Office/doc paths;
    verify coverage
  logic:
    selection:
      EventID: 11
    note_burst:
      TargetFilename|re: (?i)(readme|decrypt|restore|recover|how_to|ransom|_help_|instructions).*\.(txt|html|hta)$
    condition: count(selection) by Image > 500 within 1m or count(distinct TargetFilename directory) by
      TargetFilename basename > 20 within 5m
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 11 --regex TargetFilename='(?i)(readme|decrypt|restore|how_to).*\.(txt|html|hta)$'
    --format llm
  - forhunt stats <paths> --format llm
  pivots:
  - 'Image writing the files: hash it (Sysmon 1 Hashes), find its first execution and parent'
  - Same basename written into many directories = ransom note drop; new extension on many files = encryption
    pass
  - Sysmon 23/26 deletes of originals (IMP-014)
  false_positives:
  - Software installers, backup/sync clients, build systems writing many files; legitimate README files
  severity: critical
  sources:
  - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
  - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1486/T1486.md
  - 'sample: EVTX-to-MITRE-Attack/TA0004-Privilege Escalation/T1068-Exploitation for Privilege Escalation/ID12-13
    Mini_Plasma_PoC_AbortHydration_ArbitraryRegKey_EoP.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/11: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states: Thresholds
    and the filename regex are heuristics, not from a vetted source. || Original notes: Thresholds and
    the filename regex are heuristics, not from a vetted source. Atomic Red Team examples use names like
    YOUR_FILES.txt and akira_readme.txt. Sysmon does not log file renames as a distinct event: a rename
    shows as a new FileCreate (11) or as 23/26 for the old name. EVTX alone cannot prove encryption.'
- id: FH-IMP-014
  title: Mass file deletion burst (Sysmon 23 / 26)
  tactic: impact
  attack:
  - T1485
  - T1486
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 23
  - 26
  prerequisites:
  - Sysmon 13+ with FileDelete (23) or FileDeleteDetected (26) rules. Event 23 archives deleted files
    to ArchiveDirectory and can fill the disk
  logic:
    selection:
      EventID:
      - 23
      - 26
    condition: count(selection) by Image > 500 within 1m
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 23,26 --format llm
  pivots:
  - 'Event 23 means a copy of the deleted file may exist in the Sysmon archive directory: recover it'
  - Combine with IMP-013 file creation bursts by the same Image
  false_positives:
  - Temp-file cleanup, browser cache clearing, build/CI hosts, disk cleanup
  severity: medium
  sources:
  - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-ATTACK-SAMPLES/Privilege Escalation/Sysmon_UACME_64.evtx'
