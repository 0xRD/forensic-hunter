- id: FH-DEF-017
  title: File deletion of logs, tools or Sysmon-tracked paths (Sysmon 26 / 23)
  tactic: defense-evasion
  attack:
  - T1070.004
  - T1685.005
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 26
  - 23
  prerequisites:
  - Sysmon 13.10+ with a config that logs event 26 (FileDeleteDetected, no archive) or 23 (FileDelete,
    archives the file); both are off unless a rule includes the paths
  logic:
    selection_evtx:
      EventID:
      - 26
      - 23
      TargetFilename|endswith:
      - .evtx
      - \Windows\System32\winevt\Logs\*
    selection_temp_tools:
      EventID:
      - 26
      - 23
      TargetFilename|contains:
      - \Windows\Temp\
      - \Users\Public\
      - \AppData\Local\Temp\
    condition: selection_evtx or (selection_temp_tools and Image is a script host or the same Image that
      created the file)
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 26 --format llm --limit
    300
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 26,23 --field TargetFilename~.evtx
    --format llm
  pivots:
  - Image (deleter) -> Sysmon 1; event 23 may hold an archived copy of the deleted tool in the Sysmon
    archive directory
  - Deletion immediately after execution (Sysmon 1 for the same filename) = self-cleanup
  - Mass deletion bursts also indicate ransomware/wiper (Impact)
  false_positives:
  - Temp-file cleanup by installers and browsers is constant; this check only works with a tight Sysmon
    include rule
  severity: medium
  sources:
  - https://raw.githubusercontent.com/trustedsec/SysmonCommunityGuide/master/chapters/file_delete_detected.md
  - https://raw.githubusercontent.com/trustedsec/SysmonCommunityGuide/master/chapters/file-delete.md
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/sysmon/Sysmon_26_Med_FileDeleted_RuleAlert.yml
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-ATTACK-SAMPLES/Privilege Escalation/Sysmon_UACME_64.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/26: Microsoft docs,
