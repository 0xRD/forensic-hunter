tactic: impact
title: Impact
description: 'Impact in EVTX is mostly the pre-encryption "inhibit recovery" phase (shadow copies, backup
  catalogs, boot recovery options, backup/AV/SQL services), followed by the destructive phase itself (bursts
  of file creation, rename and delete, ransom notes, wipes) and side effects (service stops, Defender
  being disabled, log clearing, mass password resets, shutdowns). Most command-line checks use Sysmon
  1 as the primary event; the same logic applies to Security 4688 using NewProcessName and CommandLine
  (needs the "Include command line in process creation events" GPO). File-level evidence needs Sysmon
  11/23/26; native logs alone cannot see mass file encryption.

  '
checks:
- id: FH-IMP-001
  title: Shadow copy deletion via vssadmin, wmic or diskshadow command line
  tactic: impact
  attack:
  - T1490
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 1
  prerequisites:
  - Sysmon installed with a config that logs event 1 (ProcessCreate)
  - 'Alternative: Security 4688 with Audit Process Creation and the command line GPO enabled'
  logic:
    selection_img:
      Image|endswith:
      - \vssadmin.exe
      - \wmic.exe
      - \diskshadow.exe
      - \powershell.exe
      - \pwsh.exe
    selection_cli:
      CommandLine|contains|all:
      - shadow
      - delete
    condition: selection_img and selection_cli
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field CommandLine~shadow
    --format llm
  - forhunt search <paths> --channel Security --event-id 4688 --field CommandLine~shadow --format llm
  pivots:
  - 'ParentImage / ParentCommandLine and User: who launched it, from which session (LogonId -> 4624)'
  - Look 0-30 minutes after for wbadmin, bcdedit, service stops (IMP-003, IMP-004, IMP-010) and mass file
    activity (IMP-013)
  - Same command on other hosts within minutes = scripted domain-wide deployment (GPO, PsExec, 7045)
  false_positives:
  - Backup software or admins pruning shadow copies (usually from a known service account or backup agent
    parent)
  severity: critical
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_susp_shadow_copies_deletion.yml
  - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1490/T1490.md
  - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-ATTACK-SAMPLES/AutomatedTestingTools/PanacheSysmon_vs_AtomicRedTeam01.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_shadow_copies_deletion.yml
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/1: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log. JPCERT sheets mentioning the same event
    ids/tools: vssadmin, wmic (informational). || Original notes: Sigma and Atomic Red Team agree on the
    command forms (vssadmin delete shadows /all /quiet, wmic shadowcopy delete). Sysmon event 1 confirmed
    by Microsoft Sysmon docs. Shell quoting/case varies; use case-insensitive contains.'
- id: FH-IMP-002
  title: Shadow copy deletion via PowerShell Win32_ShadowCopy
  tactic: impact
  attack:
  - T1490
  channel: Microsoft-Windows-PowerShell/Operational
  provider: Microsoft-Windows-PowerShell
  event_ids:
  - 4104
  prerequisites:
  - PowerShell Script Block Logging enabled (4104)
  logic:
    selection:
      EventID: 4104
      ScriptBlockText|contains|all:
      - Win32_ShadowCopy
      - Delete
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~Win32_ShadowCopy --format llm
  pivots:
  - ScriptBlockId / Path and the 4624 logon behind the PowerShell host
  - Sysmon 1 for powershell.exe around the same time to get the parent
  false_positives:
  - Admin cleanup scripts for VSS storage
  severity: critical
  sources:
  - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1490/T1490.md
  - https://raw.githubusercontent.com/mdecrevoisier/EVTX-to-MITRE-Attack/master/README.md
  - 'sample: EVTX-to-MITRE-Attack/TA0007-Discovery/T1016-System Network Configuration Discovery/ID800-4103-4104-Firewall
    configuration enumerated (PowerShell).evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_susp_win32_shadowcopy_deletion.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-PowerShell/Operational/4104: MITRE CTI
    data-component log source, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states: 4104
    field semantics not confirmed from a Microsoft page (Microsoft Learn was unreachable). || Original
    notes: Command form from Atomic Red Team; event 4104 mapping from the EVTX-to-MITRE catalog. 4104
    field semantics not confirmed from a Microsoft page (Microsoft Learn was unreachable).'
- id: FH-IMP-003
