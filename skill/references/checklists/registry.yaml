- id: FH-REG-022
  title: Local accounts created by hand
  tactic: registry
  attack:
  - T1136.001
  channel: Registry
  event_ids:
  - 42
  prerequisites:
  - SAM hive
  logic:
    selection:
      EventID: 42
      Rid|gte: 1000
    condition: selection
  forhunt:
  - forhunt search <paths> -c Registry -e 42 --regex 'Rid=^[1-9][0-9]{3,}$' --format llm
  pivots:
  - AccountCreated and PasswordSet against the intrusion window; 4720 and 4732 when Security survives
  - 'Group membership is not read: check 4732 or the SAM by hand'
  false_positives:
  - Accounts made at install, such as the first user
  severity: medium
  sources:
  - https://attack.mitre.org/techniques/T1136/001/
  - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-identifiers
  verified: false
  notes: 'Sources cited, not re-read in this session. Field names come from forhunt''s own parser (D-050). Machine-local accounts only: domain accounts are never in the SAM.'
- id: FH-REG-023
  title: Built-in Administrator or Guest enabled and used
  tactic: registry
  attack:
  - T1078.001
  channel: Registry
  event_ids:
  - 42
  prerequisites:
  - SAM hive
  logic:
    selection:
      EventID: 42
      Rid:
      - 500
      - 501
      LastLogon|re: .
    disabled:
      Disabled: true
    condition: selection and not disabled
  forhunt:
  - forhunt search <paths> -c Registry -e 42 --regex 'Rid=^50[01]$' --regex 'LastLogon=.' --field 'Disabled!=true' --format llm
