tactic: impact
title: Impact
description: >
  Impact in EVTX is mostly the pre-encryption "inhibit recovery" phase (shadow copies, backup
  catalogs, boot recovery options, backup/AV/SQL services), followed by the destructive phase itself
  (bursts of file creation, rename and delete, ransom notes, wipes) and side effects (service stops,
  Defender being disabled, log clearing, mass password resets, shutdowns). Most command-line checks
  use Sysmon 1 as the primary event; the same logic applies to Security 4688 using NewProcessName
  and CommandLine (needs the "Include command line in process creation events" GPO). File-level
  evidence needs Sysmon 11/23/26; native logs alone cannot see mass file encryption.
checks:
  - id: FH-IMP-001
    title: Shadow copy deletion via vssadmin, wmic or diskshadow command line
    tactic: impact
    attack: [T1490]
    channel: Microsoft-Windows-Sysmon/Operational
    provider: Microsoft-Windows-Sysmon
    event_ids: [1]
    prerequisites:
      - "Sysmon installed with a config that logs event 1 (ProcessCreate)"
      - "Alternative: Security 4688 with Audit Process Creation and the command line GPO enabled"
    logic:
      selection_img:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\diskshadow.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
      selection_cli:
        CommandLine|contains|all:
          - 'shadow'
          - 'delete'
      condition: selection_img and selection_cli
    forhunt:
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field CommandLine~shadow --format llm
      - forhunt search <paths> --channel Security --event-id 4688 --field CommandLine~shadow --format llm
    pivots:
      - "ParentImage / ParentCommandLine and User: who launched it, from which session (LogonId -> 4624)"
      - "Look 0-30 minutes after for wbadmin, bcdedit, service stops (IMP-003, IMP-004, IMP-010) and mass file activity (IMP-013)"
      - "Same command on other hosts within minutes = scripted domain-wide deployment (GPO, PsExec, 7045)"
    false_positives:
      - "Backup software or admins pruning shadow copies (usually from a known service account or backup agent parent)"
    severity: critical
    sources:
      - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_susp_shadow_copies_deletion.yml
      - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1490/T1490.md
      - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
    verified: true
    notes: "Sigma and Atomic Red Team agree on the command forms (vssadmin delete shadows /all /quiet, wmic shadowcopy delete). Sysmon event 1 confirmed by Microsoft Sysmon docs. Shell quoting/case varies; use case-insensitive contains."

  - id: FH-IMP-002
    title: Shadow copy deletion via PowerShell Win32_ShadowCopy
    tactic: impact
    attack: [T1490]
    channel: Microsoft-Windows-PowerShell/Operational
    provider: Microsoft-Windows-PowerShell
    event_ids: [4104]
    prerequisites:
      - "PowerShell Script Block Logging enabled (4104)"
    logic:
      selection:
        EventID: 4104
        ScriptBlockText|contains|all:
          - 'Win32_ShadowCopy'
          - 'Delete'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field ScriptBlockText~Win32_ShadowCopy --format llm
    pivots:
      - "ScriptBlockId / Path and the 4624 logon behind the PowerShell host"
      - "Sysmon 1 for powershell.exe around the same time to get the parent"
    false_positives:
      - "Admin cleanup scripts for VSS storage"
    severity: critical
    sources:
      - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1490/T1490.md
      - https://raw.githubusercontent.com/mdecrevoisier/EVTX-to-MITRE-Attack/master/README.md
    verified: false
    notes: "Command form from Atomic Red Team; event 4104 mapping from the EVTX-to-MITRE catalog. 4104 field semantics not confirmed from a Microsoft page (Microsoft Learn was unreachable)."

  - id: FH-IMP-003
    title: Backup catalog or system state backup deletion with wbadmin
    tactic: impact
    attack: [T1490]
    channel: Microsoft-Windows-Sysmon/Operational
    provider: Microsoft-Windows-Sysmon
    event_ids: [1]
    prerequisites:
      - "Sysmon installed with a config that logs event 1; or Security 4688 with command line auditing"
    logic:
      selection:
        Image|endswith: '\wbadmin.exe'
        CommandLine|contains|all:
          - 'delete'
          - 'catalog'
      selection_systemstate:
        Image|endswith: '\wbadmin.exe'
        CommandLine|contains|all:
          - 'delete'
          - 'systemstatebackup'
      condition: selection or selection_systemstate
    forhunt:
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~wbadmin --field CommandLine~delete --format llm
    pivots:
      - "Surrounding vssadmin / bcdedit commands (IMP-001, IMP-004) from the same ParentProcessGuid"
    false_positives:
      - "Backup administrators resetting a corrupted catalog (rare, ticketed)"
    severity: critical
    sources:
      - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_susp_shadow_copies_deletion.yml
      - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1490/T1490.md
      - https://raw.githubusercontent.com/mdecrevoisier/EVTX-to-MITRE-Attack/master/README.md
    verified: true
    notes: "Three independent catalogs list wbadmin delete catalog (-quiet); Sysmon 1 per Microsoft docs."

  - id: FH-IMP-004
    title: Boot recovery disabled with bcdedit
    tactic: impact
    attack: [T1490]
    channel: Microsoft-Windows-Sysmon/Operational
    provider: Microsoft-Windows-Sysmon
    event_ids: [1]
    prerequisites:
      - "Sysmon installed with a config that logs event 1; or Security 4688 with command line auditing"
    logic:
      selection_img:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains: 'set'
      selection_recovery:
        CommandLine|contains|all:
          - 'recoveryenabled'
          - 'no'
      selection_bootstatus:
        CommandLine|contains|all:
          - 'bootstatuspolicy'
          - 'ignoreallfailures'
      condition: selection_img and (selection_recovery or selection_bootstatus)
    forhunt:
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~bcdedit --field CommandLine~recoveryenabled --format llm
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~bcdedit --field CommandLine~bootstatuspolicy --format llm
    pivots:
      - "Check for other bcdedit changes such as safeboot (see IMP-017) in the same session"
      - "Parent process and user; look for the ransomware binary starting soon after"
    false_positives:
      - "Rare admin troubleshooting; some imaging/deployment scripts"
    severity: high
    sources:
      - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_bcdedit_boot_conf_tamper.yml
      - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1490/T1490.md
    verified: true
    notes: "Sigma and Atomic Red Team agree on both option pairs (bootstatuspolicy ignoreallfailures, recoveryenabled no)."

  - id: FH-IMP-005
    title: Shadow storage shrunk to force deletion of snapshots (vssadmin resize shadowstorage)
    tactic: impact
    attack: [T1490]
    channel: Microsoft-Windows-Sysmon/Operational
    provider: Microsoft-Windows-Sysmon
    event_ids: [1]
    prerequisites:
      - "Sysmon installed with a config that logs event 1; or Security 4688 with command line auditing"
    logic:
      selection:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains|all:
          - 'resize'
          - 'shadowstorage'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~vssadmin --field CommandLine~shadowstorage --format llm
    pivots:
      - "Same pivots as IMP-001"
    false_positives:
      - "Admins legitimately sizing VSS storage (MaxSize=<sane value> rather than UNBOUNDED or very small values)"
    severity: high
    sources:
      - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_susp_shadow_copies_deletion.yml
      - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1490/T1490.md
    verified: true
    notes: "Sigma focuses on 'unbounded' values; Atomic shows a small MaxSize (20%) form. Treat an unusually small MaxSize on the same volume as suspect too."

  - id: FH-IMP-006
    title: Defender real-time protection disabled (5001)
    tactic: impact
    attack: [T1562.001]
    channel: Microsoft-Windows-Windows Defender/Operational
    provider: Microsoft-Windows-Windows Defender
    event_ids: [5001]
    prerequisites:
      - "Microsoft Defender Antivirus is the active AV (not passive mode / third-party AV)"
    logic:
      selection:
        EventID: 5001
      condition: selection
    forhunt:
      - forhunt search <paths> --channel "Microsoft-Windows-Windows Defender/Operational" --event-id 5001,5010,5012,5013,5007 --format llm
    pivots:
      - "The event does not record who did it: look at Sysmon 13 on HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows Defender and 1 for powershell Set-MpPreference around the timestamp"
      - "5007 (configuration changed) with Old/New values nearby; 5013 if Tamper Protection blocked a change"
    false_positives:
      - "Defender updates, onboarding of third-party AV, admin maintenance"
    severity: high
    sources:
      - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/windefend/win_defender_real_time_protection_disabled.yml
    verified: false
    notes: "Only one source actually opened (Sigma, which itself cites Microsoft Learn). Microsoft page not readable in this session. The channel string is 'Microsoft-Windows-Windows Defender/Operational'."

  - id: FH-IMP-007
    title: Tamper Protection blocked a Defender setting change (5013)
    tactic: impact
    attack: [T1562.001]
    channel: Microsoft-Windows-Windows Defender/Operational
    provider: Microsoft-Windows-Windows Defender
    event_ids: [5013]
    prerequisites:
      - "Defender Tamper Protection enabled"
    logic:
      selection:
        EventID: 5013
        Value|endswith:
          - '\DisableAntiSpyware'
          - '\DisableAntiVirus'
          - '\DisableRealtimeMonitoring'
          - '\DisableBehaviorMonitoring'
          - '\DisableIOAVProtection'
          - '\DisableScriptScanning'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel "Microsoft-Windows-Windows Defender/Operational" --event-id 5013 --format llm
    pivots:
      - "A blocked attempt proves an actor with admin rights was on the host: pull Sysmon 1 and 4624 around the timestamp"
    false_positives:
      - "Management tools that legitimately try to modify protected settings"
    severity: high
    sources:
      - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/windefend/win_defender_tamper_protection_trigger.yml
    verified: false
    notes: "Single source opened. The Value field naming is from that rule."

  - id: FH-IMP-008
    title: Defender detection history deleted (1013)
    tactic: impact
    attack: [T1562.001, T1070]
    channel: Microsoft-Windows-Windows Defender/Operational
    provider: Microsoft-Windows-Windows Defender
    event_ids: [1013]
    prerequisites:
      - "Defender Antivirus active"
    logic:
      selection:
        EventID: 1013
      condition: selection
    forhunt:
      - forhunt search <paths> --channel "Microsoft-Windows-Windows Defender/Operational" --event-id 1013,1116,1117,1118,1119 --format llm
    pivots:
      - "Detections (1116/1117) just before the deletion show what the actor wanted hidden"
    false_positives:
      - "Scheduled history cleanup by retention settings"
    severity: medium
