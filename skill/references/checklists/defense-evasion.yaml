  - T1685
  - T1562.001
  - T1562.006
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4688
  - 1
  - 4657
  - 4663
  prerequisites:
  - Audit Process Creation (Success) plus GPO "Include command line in process creation events" (4688
    CommandLine) or Sysmon installed with a config that logs event 1 (process creation)
  - 'Registry branch: Audit Registry (Success) with a SACL on HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WINEVT'
  logic:
    selection_fltmc:
      NewProcessName|endswith: \fltMC.exe
      CommandLine|contains|all:
      - unload
      - sysmon
    selection_channel_disabled:
      EventID: 4657
      ObjectName|contains:
      - WINEVT\Publishers\{5770385f-c22a-43e0-bf4c-06f5698ffbd9}
      - WINEVT\Channels\Microsoft-Windows-Sysmon/Operational
      ObjectValueName: Enabled
      NewValue: 0
    selection_channel_access:
      EventID: 4663
      ObjectName|contains:
      - WINEVT\Publishers\{5770385f-c22a-43e0-bf4c-06f5698ffbd9}
      - WINEVT\Channels\Microsoft-Windows-Sysmon/Operational
      AccessMask: '0x10000'
    condition: 1 of selection_*
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4688 --field CommandLine~fltmc --format llm
  - forhunt search <paths> --channel Security --event-id 4657 --field ObjectName~WINEVT --format llm
  pivots:
  - Last Sysmon event time vs the tamper time; Sysmon 4 (Stopped) and 255 if it logged
  - Process doing the tamper -> parent and user
  - Other agents unloaded similarly (EDR filter drivers)
  false_positives:
  - Admins unloading the Sysmon filter during upgrade; rare otherwise
  severity: critical
