  - PowerShell Script Block Logging enabled (4104 is also written for suspicious blocks even without it
    on PowerShell 5+, but not reliably)
  logic:
    selection_reflection:
      EventID: 4104
      ScriptBlockText|contains|all:
      - '[Ref].Assembly.GetType'
      - SetValue($null,$true)
      - NonPublic,Static
    selection_names:
      EventID: 4104
