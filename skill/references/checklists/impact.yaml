- id: FH-IMP-019
  title: Defacement or ransom wallpaper (web root writes, wallpaper registry change)
  tactic: impact
  attack:
  - T1491
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 11
  - 13
  prerequisites:
  - Sysmon with event 11 and event 13 rules covering web roots and HKCU\Control Panel\Desktop
  logic:
    selection_web:
      EventID: 11
      TargetFilename|contains:
      - \inetpub\wwwroot\
      TargetFilename|endswith:
      - .html
      - .aspx
      - .php
      - .jpg
    filter_expected_writers:
      Image|endswith:
      - \w3wp.exe
      - \msdeploy.exe
    selection_wallpaper:
      EventID: 13
      TargetObject|endswith: \Control Panel\Desktop\Wallpaper
    condition: (selection_web and not filter_expected_writers) or selection_wallpaper
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 13 --field TargetObject~Desktop\Wallpaper
    --format llm
  pivots:
  - Image/User behind the write; IIS logs (not EVTX) for the upload path
  false_positives:
  - Normal web deployments; users changing wallpaper; corporate wallpaper policies
  severity: low
  sources:
  - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-to-MITRE-Attack/TA0004-Privilege Escalation/T1068-Exploitation for Privilege Escalation/ID12-13
    Mini_Plasma_PoC_AbortHydration_ArbitraryRegKey_EoP.evtx'
