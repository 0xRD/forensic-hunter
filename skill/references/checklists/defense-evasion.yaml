- id: FH-DEF-012
  title: Sysmon service stopped, config changed, or erroring (Sysmon 4 / 16 / 255)
  tactic: defense-evasion
  attack:
  - T1685
  - T1562.001
  - T1685.001
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 4
  - 16
  - 255
  prerequisites:
  - Sysmon installed (events 4, 16 and 255 are generated by Sysmon itself and cannot be excluded in config)
  logic:
    selection_state:
      EventID: 4
      State: Stopped
    selection_config:
      EventID: 16
    selection_error:
      EventID: 255
      Description|contains:
      - Failed to open service configuration with error
      - Failed to connect to the driver to update configuration
    filter_expected_hash:
      ConfigurationFileHash|contains: SHA256=<hash of your approved config>
    condition: selection_state or (selection_config and not filter_expected_hash) or selection_error
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 4,16 --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 255 --format llm
  pivots:
  - ConfigurationFileHash / Configuration in 16 vs the approved config; a minimal or exclusion-heavy config
    suggests blinding
  - Hunt for sysmon -c / -u / fltmc unload sysmon in 4688 and Sysmon 1 (Sysmon 1 may not log it if Sysmon
    is already stopped)
  - Sysmon event gap in time while Security continues to log (4688) is the telltale sign
  - A direct registry edit of the config does not generate event 16 (TrustedSec guide)
  false_positives:
  - Planned Sysmon upgrades and config rollouts; reboot sequences (state Stopped/Started)
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/sysmon/sysmon_config_modification.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/sysmon/sysmon_config_modification_status.yml
