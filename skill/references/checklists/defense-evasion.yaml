- id: FH-DEF-018
  title: 'Timestomping: file creation time changed (Sysmon 2) and PowerShell timestamp edits (4104)'
  tactic: defense-evasion
  attack:
  - T1070.006
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 2
  - 4104
  prerequisites:
  - Sysmon installed with a config that logs event 2 (FileCreateTime); only creation time is covered,
    not last-write time
  - '4104 branch: PowerShell Script Block Logging'
  logic:
    selection_sysmon:
      EventID: 2
    filter_expected_updaters:
      Image|endswith:
      - \OneDrive.exe
      - \msiexec.exe
      - \TrustedInstaller.exe
      - \svchost.exe
    selection_ps:
      EventID: 4104
      ScriptBlockText|contains:
      - .CreationTime =
      - .LastWriteTime =
      - .LastAccessTime =
      - '[IO.File]::SetCreationTime'
      - '[IO.File]::SetLastWriteTime'
    condition: (selection_sysmon and not filter_expected_updaters) or selection_ps
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 2 --format llm --limit
    300
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~SetCreationTime --format llm
  pivots:
  - 'CreationUtcTime vs PreviousCreationUtcTime: a change to a date long before the file first appeared
    (Sysmon 11 for the same TargetFilename) is the stomp'
  - Image that changed it -> Sysmon 1
  - File then executed or loaded (Sysmon 1/7) from System32-lookalike locations
  false_positives:
  - Installers, archive extractors and sync clients (OneDrive, Dropbox) set creation times
  - Backup/restore tools preserving original timestamps
  severity: medium
  sources:
  - https://raw.githubusercontent.com/trustedsec/SysmonCommunityGuide/master/chapters/file-create-time-change.md
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/sysmon/Sysmon_2_Low_PossibleTimestomping.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/powershell/powershell_script/posh_ps_timestomp.yml
  - 'sample: EVTX-ATTACK-SAMPLES/AutomatedTestingTools/Malware/DE_timestomp_and_dll_sideloading_and_RunPersist.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/2: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; Security/4104: MITRE CTI data-component
    log source.  Open: event id / channel pair has fewer than two independent confirmations (Security/4104(cti)).
    JPCERT sheets mentioning the same event ids/tools: timestomp (informational). || Original notes: The
    TrustedSec guide and Hayabusa confirm Sysmon event 2 and its CreationUtcTime / PreviousCreationUtcTime
    fields; SigmaHQ supplies the PowerShell script-block strings. Event 2 is typically noisy and rated
    low by Hayabusa. Timestomping of $FILE_NAME or last-write times is not seen by Sysmon 2; use MFT analysis
    for that.'
- id: FH-DEF-019
  title: PowerShell AMSI bypass in script blocks (4104)
  tactic: defense-evasion
  attack:
  - T1685
  - T1562.001
  channel: Microsoft-Windows-PowerShell/Operational
  provider: Microsoft-Windows-PowerShell
  event_ids:
  - 4104
