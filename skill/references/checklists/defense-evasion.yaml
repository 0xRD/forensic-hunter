  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/sigma/builtin/registry/registry_set/registry_set_dot_net_etw_tamper.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/4657: MITRE CTI data-component
    log source, Microsoft docs, rule project; Security/13: Microsoft docs, rule project; Security/4104:
    MITRE CTI data-component log source.  Open: event id / channel pair has fewer than two independent
    confirmations (Security/4104(cti)) | literal value not found in any opened source (EtwEventWrite;
