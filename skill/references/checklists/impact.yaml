- id: FH-IMP-004
  title: Boot recovery disabled with bcdedit
  tactic: impact
  attack:
  - T1490
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 1
  prerequisites:
  - Sysmon installed with a config that logs event 1; or Security 4688 with command line auditing
  logic:
    selection_img:
      Image|endswith: \bcdedit.exe
      CommandLine|contains: set
    selection_recovery:
      CommandLine|contains|all:
      - recoveryenabled
      - 'no'
    selection_bootstatus:
      CommandLine|contains|all:
      - bootstatuspolicy
      - ignoreallfailures
    condition: selection_img and (selection_recovery or selection_bootstatus)
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~bcdedit
    --field CommandLine~recoveryenabled --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~bcdedit
    --field CommandLine~bootstatuspolicy --format llm
  pivots:
  - Check for other bcdedit changes such as safeboot (see IMP-017) in the same session
  - Parent process and user; look for the ransomware binary starting soon after
  false_positives:
  - Rare admin troubleshooting; some imaging/deployment scripts
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_bcdedit_boot_conf_tamper.yml
  - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1490/T1490.md
  - 'sample: EVTX-ATTACK-SAMPLES/AutomatedTestingTools/PanacheSysmon_vs_AtomicRedTeam01.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_bcdedit_boot_conf_tamper.yml
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/1: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log. || Original notes: Sigma and Atomic Red
    Team agree on both option pairs (bootstatuspolicy ignoreallfailures, recoveryenabled no).'
