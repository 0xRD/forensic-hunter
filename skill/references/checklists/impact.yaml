- id: FH-IMP-006
  title: Defender real-time protection disabled (5001)
  tactic: impact
  attack:
  - T1685
  - T1562.001
  channel: Microsoft-Windows-Windows Defender/Operational
  provider: Microsoft-Windows-Windows Defender
  event_ids:
  - 5001
  prerequisites:
  - Microsoft Defender Antivirus is the active AV (not passive mode / third-party AV)
  logic:
    selection:
      EventID: 5001
    condition: selection
  forhunt:
  - forhunt search <paths> --channel "Microsoft-Windows-Windows Defender/Operational" --event-id 5001,5010,5012,5013,5007
    --format llm
  pivots:
  - 'The event does not record who did it: look at Sysmon 13 on HKLM\SOFTWARE\Policies\Microsoft\Windows
    Defender and 1 for powershell Set-MpPreference around the timestamp'
  - 5007 (configuration changed) with Old/New values nearby; 5013 if Tamper Protection blocked a change
  false_positives:
  - Defender updates, onboarding of third-party AV, admin maintenance
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/windefend/win_defender_real_time_protection_disabled.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/windefend/win_defender_real_time_protection_disabled.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Windows Defender/Operational/5001: rule
    project.  Open: event id / channel pair has fewer than two independent confirmations (ndows Defender/5001(rule)).
    ATT&CK: legacy id(s) T1562.001 were revoked in the current mitre/cti enterprise-attack data; the replacement
    id is listed first and the legacy id is kept after it. || Original notes: Only one source actually
    opened (Sigma, which itself cites Microsoft Learn). Microsoft page not readable in this session. The
    channel string is ''Microsoft-Windows-Windows Defender/Operational''.'
