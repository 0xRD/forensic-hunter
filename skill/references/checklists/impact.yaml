- id: FH-IMP-015
  title: Secure deletion / free-space wipe (sdelete, cipher /w, Sysmon 28)
  tactic: impact
  attack:
  - T1485
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 1
  - 28
  prerequisites:
  - Sysmon with event 1; event 28 (FileBlockShredding) needs Sysmon 14+ and a FileBlockShredding rule,
    and it blocks as well as logs
  logic:
    selection_cipher:
      Image|endswith: \cipher.exe
      CommandLine|contains: /w
    selection_sdelete:
      Image|endswith:
      - \sdelete.exe
      - \sdelete64.exe
    selection_blocked:
      EventID: 28
    condition: selection_cipher or selection_sdelete or selection_blocked
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~cipher
    --field CommandLine~/w --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1,28 --field Image~sdelete
    --format llm
  pivots:
  - What was wiped first (file paths in earlier 11/23 events)? Wipe tools often run after exfiltration
    (COLL checks)
  false_positives:
  - Admins sanitising disks before decommissioning
  severity: high
  sources:
  - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1485/T1485.md
  - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-ATTACK-SAMPLES/AutomatedTestingTools/PanacheSysmon_vs_AtomicRedTeam01.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_renamed_sysinternals_sdelete.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/1: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; MW-Sysmon/Operational/28: Microsoft docs,
    rule project.  Open: event ids, channel and fields are confirmed (see above) but the detection logic
    goes beyond what any opened rule/source states. JPCERT sheets mentioning the same event ids/tools:
    sdelete (informational). || Original notes: cipher /w is in Atomic Red Team; Sysmon 28 purpose per
