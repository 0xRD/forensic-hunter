tactic: execution
title: Execution
description: Execution in Windows event logs is mostly visible through process creation (Security 4688
  with command line, Sysmon 1), PowerShell logging (4104 script blocks, 4103 module logging, and classic
  Windows PowerShell 400/600 engine events), and the parent/child relationship of the process tree. Attackers
  favour living-off-the-land binaries (rundll32, regsvr32, mshta, certutil, bitsadmin, wmic, script hosts,
  msbuild, installutil) and Office or WMI as parent processes. Detections depend heavily on audit configuration;
  empty results often mean missing logging, not absence of activity.
checks:
- id: FH-EXE-001
  title: Office application spawning a shell, script host or LOLBin (Sysmon 1)
  tactic: execution
  attack:
  - T1204.002
  - T1059
  - T1218
  channel: Microsoft-Windows-Sysmon/Operational
  event_ids:
  - 1
  prerequisites:
  - Sysmon installed with a config that logs event 1
  logic:
    selection_parent:
      ParentImage|endswith:
      - \WINWORD.EXE
      - \EXCEL.EXE
      - \POWERPNT.EXE
      - \MSPUB.EXE
      - \VISIO.EXE
      - \MSACCESS.EXE
      - \ONENOTE.EXE
      - \OUTLOOK.EXE
    selection_child:
      Image|endswith:
      - \cmd.exe
      - \powershell.exe
      - \pwsh.exe
      - \wscript.exe
      - \cscript.exe
      - \mshta.exe
      - \rundll32.exe
      - \regsvr32.exe
      - \certutil.exe
      - \bitsadmin.exe
      - \wmic.exe
      - \msbuild.exe
      - \installutil.exe
      - \schtasks.exe
    condition: selection_parent and selection_child
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field ParentImage~WINWORD.EXE
    --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --regex ParentImage='(?i)\\(winword|excel|powerpnt|outlook|onenote)\.exe$'
    --format llm
  pivots:
  - 'Child CommandLine: look for -enc, http(s) URLs, UNC paths, script files in user-writable folders'
  - Sysmon 3 (network) and 11 (file create) from the child ProcessGuid
  - 'Sysmon 11: the document that was opened (Zone.Identifier / Downloads / Temp), then 4624 logon of
    the user around that time'
  - Hashes of Image to see whether the child binary is renamed (OriginalFileName vs Image)
  false_positives:
  - Legitimate Office add-ins or macros that launch cmd/powershell for business automation
  - Outlook launching rundll32 or msiexec during normal use
  severity: high
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_office_susp_child_processes.yml
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - https://github.com/mitre-attack/attack-stix-data/blob/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-ATTACK-SAMPLES/AutomatedTestingTools/PanacheSysmon_vs_AtomicRedTeam01.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/1: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log. JPCERT sheets mentioning the same event
    ids/tools: BITS, schtasks, wmic (informational). || Original notes: Sysmon event 1 meaning from the
    Microsoft Sysmon page; Office-parent/child pairs and field names (ParentImage, Image, OriginalFileName)
    from Sigma; list of children is a pragmatic subset. Tune the child list to your environment. Mirrors
    FH-EXE-002 for hosts without Sysmon.'
- id: FH-EXE-002
  title: Office application spawning a shell, script host or LOLBin (Security 4688)
  tactic: execution
  attack:
  - T1204.002
  - T1059
  - T1218
  channel: Security
  event_ids:
  - 4688
  prerequisites:
  - Audit Process Creation (Success) enabled AND 'Include command line in process creation events' GPO
    enabled for CommandLine
  - Without the command-line GPO CommandLine is absent; NewProcessName and ParentProcessName are still
    present when ParentProcessName auditing is available (Windows 10 / Server 2016+ normally populates
    it)
  logic:
    selection_parent:
      ParentProcessName|endswith:
      - \WINWORD.EXE
      - \EXCEL.EXE
      - \POWERPNT.EXE
      - \MSPUB.EXE
      - \VISIO.EXE
      - \MSACCESS.EXE
      - \ONENOTE.EXE
      - \OUTLOOK.EXE
    selection_child:
      NewProcessName|endswith:
      - \cmd.exe
      - \powershell.exe
      - \pwsh.exe
      - \wscript.exe
      - \cscript.exe
      - \mshta.exe
      - \rundll32.exe
      - \regsvr32.exe
      - \certutil.exe
      - \bitsadmin.exe
      - \wmic.exe
      - \msbuild.exe
      - \installutil.exe
      - \schtasks.exe
    condition: selection_parent and selection_child
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4688 --field ParentProcessName~WINWORD.EXE --format
    llm
  - forhunt search <paths> --channel Security --event-id 4688 --regex ParentProcessName='(?i)\\(winword|excel|powerpnt|outlook|onenote)\.exe$'
    --format llm
  pivots:
  - CommandLine of the child (if collected)
  - SubjectLogonId -> 4624 to identify session/logon type
  - 4688 for the next generation of children (NewProcessId becomes ProcessId of the following event)
  false_positives:
  - Business macros / Office automation scripts
  severity: high
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_office_susp_child_processes.yml
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/persistence/T1547.004 - Winlogon
    System Shell Changed.yml
  - https://github.com/stuhli/awesome-event-ids
  - 'sample: EVTX-to-MITRE-Attack/TA0005-Defense Evasion/T1027-Obfuscated Files or Information/ID4688-Obfuscated
    payload transfer via service name - Tchopper.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/4688: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log. JPCERT sheets mentioning the same event ids/tools:
    BITS, schtasks, wmic (informational). || Original notes: Field names NewProcessName, ParentProcessName,
    CommandLine confirmed by a Chainsaw 4688-based rule; parent/child logic adapted from Sigma. The command-line
    GPO requirement is linked from awesome-event-ids (Microsoft page itself not opened - see sources file).'
- id: FH-EXE-003
  title: PowerShell started with an encoded command (Sysmon 1)
  tactic: execution
  attack:
  - T1059.001
  - T1027
  channel: Microsoft-Windows-Sysmon/Operational
  event_ids:
  - 1
  prerequisites:
  - Sysmon installed with a config that logs event 1
  logic:
    selection_img:
      Image|endswith:
      - \powershell.exe
      - \pwsh.exe
    selection_flag:
      CommandLine|contains:
      - ' -e '
      - ' -en '
      - ' -enc '
      - ' -enco '
      - ' -encodedcommand '
    condition: selection_img and selection_flag
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field CommandLine~-enc
    --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --regex CommandLine='(?i)\s-e(nc|nco|ncodedcommand)?\s+[A-Za-z0-9+/=]{20,}'
    --format llm
  pivots:
  - Base64-decode the argument (UTF-16LE) and read it; then search 4104 for the decoded content
  - 'ParentImage: who launched it (Office, wmiprvse, services.exe, a scheduled task host)'
  - 4104 with the same Computer/time for the decoded script block
  false_positives:
  - Management agents and installers (SCCM, Intune, some monitoring tools) legitimately use -EncodedCommand
  severity: medium
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd.yml
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-ATTACK-SAMPLES/AutomatedTestingTools/PanacheSysmon_vs_AtomicRedTeam01.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_cmdline_reversed_strings.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/1: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states: Only
    one rule source read for the matching logic, hence unverified. || Original notes: Abbreviations of
    -EncodedCommand are matched loosely (PowerShell accepts any unambiguous prefix). Sigma additionally
    looks for typical base64 prefixes of IEX/UTF-16 payloads; not reproduced here. Only one rule source
    read for the matching logic, hence unverified.'
