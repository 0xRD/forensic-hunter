- id: FH-DEF-023
  title: rundll32.exe launched without arguments
  tactic: defense-evasion
  attack:
  - T1218.011
  - T1055
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 1
  - 4688
  prerequisites:
  - Sysmon installed with a config that logs event 1 (process creation)
  - Audit Process Creation (Success) plus GPO "Include command line in process creation events" (4688
    CommandLine)
  logic:
    selection:
      CommandLine|endswith:
      - \rundll32.exe
      - \rundll32.exe"
      - \rundll32
    filter_parent:
      ParentImage|contains:
      - \AppData\Local\
      - \Microsoft\Edge\
    condition: selection and not filter_parent
