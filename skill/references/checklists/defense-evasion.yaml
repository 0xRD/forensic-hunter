    CommandLine~advfirewall --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field CommandLine~"opmode
    disable" --format llm
  pivots:
  - Firewall events 2004/2033 and System 7040 for MpsSvc around the same time
  - Process lineage of netsh.exe
  false_positives:
  - Admin troubleshooting; software deployment scripts
  severity: medium
  sources:
