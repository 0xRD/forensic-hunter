name: Release

# Builds static binaries for every platform on a version tag, publishes them
# with SHA-256 checksums to a GitHub release, then updates the Homebrew tap.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: pip install ziglang cargo-zigbuild
      - name: Build (zig, static musl)
        if: matrix.zig
        run: cargo zigbuild --release --locked -p forhunt --target ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.zig }}
        shell: bash
        env:
          # Static CRT on Windows: no VC++ redistributable needed.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --locked -p forhunt --target ${{ matrix.target }}
      - name: Smoke test
        # Cross-compiled targets cannot run on the build machine.
        if: matrix.target != 'aarch64-unknown-linux-musl' && matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/forhunt
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" stats -q fixtures/synthetic/Security.evtx | head -1
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          name="forhunt-${ver}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin=target/${{ matrix.target }}/release/forhunt
          if [ -f "$bin.exe" ]; then cp "$bin.exe" "dist/$name/"; else cp "$bin" "dist/$name/"; fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          cat "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Aggregate checksums
        run: |
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Forensic Hunter ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS

  homebrew:
    name: update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Skip without tap token
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the tap update (see BLOCKERS.md B-002 or run scripts/update-tap.sh)"
      - uses: actions/download-artifact@v4
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Render formula and push to the tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          set -euo pipefail
          scripts/render-formula.sh "$TAG" dist > forhunt.rb
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO:-0xRD/homebrew-tap}.git" tap
          mkdir -p tap/Formula
          cp forhunt.rb tap/Formula/forhunt.rb
          cd tap
          git config user.name "forhunt release bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/forhunt.rb
          git commit -m "forhunt ${TAG#v}" || { echo "formula unchanged"; exit 0; }
          git push
