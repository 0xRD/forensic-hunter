- id: FH-DEF-021
  title: 'Event log gaps: record-id discontinuities and silent intervals'
  tactic: defense-evasion
  attack:
  - T1685.005
  - T1070.001
  - T1685.001
  channel: Security
  event_ids:
  - 1102
  - 104
  - 1100
  - 4616
  prerequisites:
  - EVTX files that include EventRecordID in System metadata (always); comparison logs (other channels,
    forwarded copies) to locate where the gap sits
  logic:
    selection_gap:
      EventRecordID: jumps by more than 1 between consecutive records of the same channel and the same
        file
    condition: record-id discontinuity not explained by log rotation, or a channel that goes quiet while
      other channels continue
  forhunt:
  - forhunt stats <paths> --format llm
  - forhunt timeline <paths> --since 2024-05-01T10:00:00Z --until 2024-05-01T12:00:00Z --format llm
  - forhunt search <paths> --channel Security --event-id 1102,104,1100 --format llm
  pivots:
  - Use forhunt stats gap output per channel and note start/end timestamps of each gap
  - Compare gaps with 1102 / 104 / 1100 and 6005/6006/6008 (boot and shutdown) to separate clearing, reboot
    and tampering
  - Record ids after a clear do not necessarily reset in Security logs; consult the cleared log first
    record id
  - Selective deletion by third-party tools can leave single-record gaps without 1102
  false_positives:
  - Log rotation / overwriting of oldest events (the first record id is not 1)
  - Event filtering at collection, WEF subscriptions that skip events, and audit policies that exclude
    categories
  - Different EVTX files from different times merged into one analysis set
  severity: medium
  sources:
  - https://raw.githubusercontent.com/Yamato-Security/EnableWindowsLogSettings/main/README.md
  - 'sample: EVTX-ATTACK-SAMPLES/Defense Evasion/DE_1102_security_log_cleared.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - 'sample: EVTX-to-MITRE-Attack/TA0005-Defense Evasion/T1070.006-Timestomp/ID4616-system time changed.evtx'
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/1102: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; Security/104: rule project; Security/1100:
    no source; Security/4616: Microsoft docs, rule project, real sample log.  Open: event id / channel
    pair has fewer than two independent confirmations (Security/104(rule),Security/1100()) | corrections:
    forhunt placeholder replaced by an example value so the command parses (edit the value). ATT&CK: legacy
    id(s) T1070.001 were revoked in the current mitre/cti enterprise-attack data; the replacement id is
    listed first and the legacy id is kept after it. || Original notes: This is the researcher method
    suggested for forhunt, not a source-backed detection: no vendor or community source read defines gap
    thresholds. Yamato Security guide read for log-size/retention context only. Whether Windows keeps
    or resets EventRecordID after a clear should be confirmed on a sample before relying on it (open question).'
