name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Fixtures are reproducible
        shell: bash
        run: |
          cargo run --release --locked -p evtx-gen -- fixtures --out target/fixtures-check
          for f in $(cd fixtures/synthetic && find . -name '*.evtx'); do
            cmp "fixtures/synthetic/$f" "target/fixtures-check/$f"
          done
          cargo run --release --locked -p evtx-gen -- ntfs --out target/ntfs-check
          (cd fixtures/ntfs && find . -type f) | while IFS= read -r f; do
            cmp "fixtures/ntfs/$f" "target/ntfs-check/$f" || exit 1
          done
          cargo run --release --locked -p evtx-gen -- prefetch --out target/prefetch-check
          (cd fixtures/prefetch && find . -type f) | while IFS= read -r f; do
            cmp "fixtures/prefetch/$f" "target/prefetch-check/$f" || exit 1
          done
          cargo run --release --locked -p evtx-gen -- registry --out target/registry-check
          (cd fixtures/registry && find . -type f) | while IFS= read -r f; do
            cmp "fixtures/registry/$f" "target/registry-check/$f" || exit 1
          done
          cargo run --release --locked -p evtx-gen -- mail --out target/mail-check
          (cd fixtures/mail && find . -type f) | while IFS= read -r f; do
            cmp "fixtures/mail/$f" "target/mail-check/$f" || exit 1
          done
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run --locked

  checklists:
    name: skill checklists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - name: Schema valid and INDEX.md up to date
        run: python3 scripts/gen-checklist-index.py --check
      - name: Install scripts parse
        run: bash -n skill/scripts/install.sh && bash -n skill/scripts/fetch-samples.sh

  installer:
    name: skill installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The installer is tested with the forhunt of this commit, served like a
      # release (archive + SHA256SUMS) through FORHUNT_BASE_URL: the skill
      # needs features the last published release may not have yet.
      - name: Build this forhunt as a local release mirror
        shell: bash
        run: |
          set -euo pipefail
          cargo build -q -p forhunt
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64) t=x86_64-unknown-linux-musl ;;
            Linux-aarch64) t=aarch64-unknown-linux-musl ;;
            macOS-*) t=aarch64-apple-darwin ;;
            Windows-*) t=x86_64-pc-windows-msvc ;;
          esac
          m="$RUNNER_TEMP/mirror"; d="forhunt-$ver-$t"
          mkdir -p "$m/$d"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/debug/forhunt.exe "$m/$d/"
            (cd "$m" && 7z a -tzip -bso0 "$d.zip" "$d" && sha256sum "$d.zip" > SHA256SUMS)
          else
            cp target/debug/forhunt "$m/$d/"
            (cd "$m" && tar czf "$d.tar.gz" "$d" && { sha256sum "$d.tar.gz" 2>/dev/null || shasum -a 256 "$d.tar.gz"; } > SHA256SUMS)
          fi
          echo "FH_VER=v$ver" >> "$GITHUB_ENV"
          echo "MIRROR=$m" >> "$GITHUB_ENV"
      - name: Install an older release, update it, rules only on a yes (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/fh"
          i() { bash skill/scripts/install.sh --prefix "$p" "$@"; }
          if i --check; then echo "check passed on an empty prefix"; exit 1; fi
          i --forhunt-version v0.5.1 --no-rules
          if i --check; then echo "check passed on a too old forhunt"; exit 1; fi
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$MIRROR" > /dev/null 2>&1 &
          sleep 2
          export FORHUNT_BASE_URL=http://127.0.0.1:8765
          # No terminal and no --rules: the rules are never downloaded.
          i --forhunt-version "$FH_VER" < /dev/null
          [ ! -e "$p/rules/hayabusa-rules" ]
          i --forhunt-version "$FH_VER" --rules
          # Rules pinned by content digest, with a folder for your own.
          grep -q '^commit=' "$p/rules/hayabusa-rules/.forhunt-rules"
          [ -d "$p/rules/hayabusa-rules/sigma" ] && [ -d "$p/rules/custom" ]
          "$p/bin/forhunt" sigma fixtures/synthetic -q -g > /dev/null
          # Captured, not piped into `grep -q`: that closes the pipe early.
          again="$(i --forhunt-version "$FH_VER" < /dev/null)"; grep -q "already installed" <<< "$again"
          state="$(i --check)"; grep -qx ready <<< "$state"
          [ -z "$(find "$p" -maxdepth 1 -name '.staging*')" ]
      - name: Install an older release, update it, rules only on a yes (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Join-Path $env:RUNNER_TEMP 'fh'
          function I { powershell -NoProfile -ExecutionPolicy Bypass -File skill\scripts\install.ps1 -Prefix $p @args }
          I -Check; if ($LASTEXITCODE -eq 0) { throw 'check passed on an empty prefix' }
          I -ForhuntVersion v0.5.1 -NoRules; if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          I -Check; if ($LASTEXITCODE -eq 0) { throw 'check passed on a too old forhunt' }
          Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $env:MIRROR -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $env:FORHUNT_BASE_URL = 'http://127.0.0.1:8765'
          I -ForhuntVersion $env:FH_VER -NoRules; if ($LASTEXITCODE -ne 0) { throw 'update failed' }
          if (Test-Path (Join-Path $p 'rules\hayabusa-rules')) { throw 'rules downloaded without a yes' }
          I -ForhuntVersion $env:FH_VER -Rules; if ($LASTEXITCODE -ne 0) { throw 'rules install failed' }
          if (-not (Test-Path (Join-Path $p 'rules\hayabusa-rules\.forhunt-rules'))) { throw 'rules not installed' }
          if (-not (Test-Path (Join-Path $p 'rules\custom'))) { throw 'no custom rules folder' }
          $again = I -ForhuntVersion $env:FH_VER -NoRules | Out-String; if ($again -notmatch 'already installed') { throw "not idempotent: $again" }
          $out = I -Check | Out-String; if ($LASTEXITCODE -ne 0 -or $out -notmatch 'ready') { throw "not ready: $out" }
          & (Join-Path $p 'bin\forhunt.exe') sigma fixtures\synthetic -q -g | Out-Null; if ($LASTEXITCODE -ne 0) { throw 'forhunt sigma failed' }
          exit 0

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  perf:
    name: performance regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Compare instruction counts with the base revision
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          scripts/bench-gate.sh "$base"
