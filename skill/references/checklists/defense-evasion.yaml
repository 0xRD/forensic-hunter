- id: FH-DEF-010
  title: Security / logging service stopped or disabled (7036 / 7040, net stop, sc)
  tactic: defense-evasion
  attack:
  - T1685
  - T1562.001
  - T1685.001
  channel: System
  provider: Service Control Manager
  event_ids:
  - 7036
  - 7040
  - 4688
  prerequisites:
  - System log (default); 4688/Sysmon 1 for net stop / sc commands
  logic:
    selection_defender_stopped:
      EventID: 7036
      param1: Windows Defender Antivirus Service
      param2: stopped
    selection_disabled:
      EventID: 7040
      param1:
      - Windows Defender Antivirus Service
      - Windows Event Log
      - Windows Firewall
      - Sysmon
      - Sysmon64
      - Windows Security Center
      param3: disabled
    selection_cmd:
      NewProcessName|endswith:
      - \net.exe
      - \net1.exe
      - \sc.exe
      CommandLine|contains:
      - ' stop '
      - ' config '
    selection_cmd_target:
      CommandLine|contains:
      - WinDefend
      - Sense
      - EventLog
      - MpsSvc
      - Sysmon
      - wscsvc
    condition: selection_defender_stopped or selection_disabled or (selection_cmd and selection_cmd_target)
  forhunt:
  - forhunt search <paths> --channel System --event-id 7036 --field param1~Defender --field param2=stopped
    --format llm
  - forhunt search <paths> --channel System --event-id 7036 --field param1~Defender --regex 'Binary=2F0031000000$'
    --format llm
  - forhunt search <paths> --channel System --event-id 7040 --regex 'param3=^(disabled|désactivé|deaktiviert|deshabilitado|disabilitato|desativado|uitgeschakeld)$'
    --format llm
  - forhunt search <paths> --channel Security --event-id 4688 --field CommandLine~"stop windefend" --format
    llm
  pivots:
  - 4688 / Sysmon 1 for the actor (net stop, sc config start= disabled, PowerShell Stop-Service)
  - Events after the stop from the affected product are missing (Defender 1116, Sysmon records)
  - 'Localised service display names: param1 text is translated (SigmaHQ includes a French variant), match
    by language or use the service short name where available'
  - 'param2 / param3 (state, start type) are translated too (French: arrêté, Désactivé): 7036 queries
    also test the binary data, which ends with the service name and its state code (/1 = stopped,
    hex 2F0031000000), the same in every language'
  false_positives:
  - Patch windows, AV product replacement (Defender stops when a third-party AV registers), reboots
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/system/service_control_manager/win_system_defender_disabled.yml
