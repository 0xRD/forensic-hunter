- id: FH-DISC-011
  title: SPN enumeration and Kerberos TGS burst from a single source (setspn, SharpHound)
  tactic: discovery
  attack:
  - T1087.002
  - T1558.003
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4769
  prerequisites:
  - Audit Kerberos Service Ticket Operations (Success) on domain controllers
  logic:
    selection:
      EventID: 4769
    filter_noise:
      ServiceName|endswith: $
    condition: selection and not filter_noise and count(distinct ServiceName) by IpAddress > 30 within
      10m
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4769 --format llm
  pivots:
  - 'Check TicketEncryptionType 0x17 (RC4): same burst may be Kerberoasting (credential-access checklist)'
  - Workstation-side Sysmon 1 for setspn.exe -T / -Q */*
  false_positives:
  - Workstations touching many services after logon, jump hosts
  severity: low
  sources:
  - https://raw.githubusercontent.com/mdecrevoisier/EVTX-to-MITRE-Attack/master/README.md
  - 'sample: EVTX-to-MITRE-Attack/TA0007-Discovery/T1087-Account discovery/ID4769-Kerberos TGS host enumeration
    (Bloodhound).evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_rc4_kerberos.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/4769: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states: Threshold
    and ServiceName filtering are heuristics. || Original notes: The catalog lists single-source host
    enumeration over TGS (4769) for SharpHound. Threshold and ServiceName filtering are heuristics.'
- id: FH-DISC-012
  title: Host-based port scan (Sysmon 3 fan-out)
  tactic: discovery
  attack:
  - T1046
  - T1018
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 3
  prerequisites:
  - Sysmon installed with a config that logs event 3 (disabled by default; often filtered heavily)
  logic:
    selection:
      EventID: 3
      Initiated: 'true'
    condition: count(distinct DestinationIp) by Image > 50 within 1m or count(distinct DestinationPort)
      by Image, DestinationIp > 20 within 1m
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 3 --field Initiated=true
    --format llm
  - forhunt stats <paths> --format llm
  pivots:
  - Image (unsigned / in user-writable paths, or a renamed scanner) and ProcessGuid -> Sysmon 1 for command
    line
  - 'Common targets: 445, 3389, 135, 5985, 22, 1433'
  false_positives:
  - Vulnerability scanners, network monitoring, backup discovery, browsers/P2P
  severity: medium
  sources:
  - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-ATTACK-SAMPLES/Command and Control/DE_sysmon-3-rdp-tun.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/network_connection/net_connection_win_adws_unusual_connection.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/3: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states: Event
    3 semantics confirmed by the Microsoft Sysmon docs; thresholds are heuristics. || Original notes:
    Event 3 semantics confirmed by the Microsoft Sysmon docs; thresholds are heuristics. Sysmon 3 does
    not log blocked or failed attempts reliably, so a scanner hitting closed ports may be under-represented.'
- id: FH-DISC-013
  title: Host-based port scan seen by Windows Filtering Platform (5156 / 5157)
  tactic: discovery
  attack:
  - T1046
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 5156
  - 5157
  prerequisites:
  - Audit Filtering Platform Connection (Success and Failure); extremely high volume, normally off
  logic:
    selection:
      EventID:
      - 5156
      - 5157
      Direction: '%%14593'
    condition: count(distinct DestAddress) by Application > 50 within 1m or count(distinct DestPort) by
      Application, DestAddress > 20 within 1m
  forhunt:
  - forhunt search <paths> --channel Security --event-id 5156,5157 --format llm
  pivots:
  - Application path and ProcessID; 5157 (blocked) bursts reveal scans that hit firewall rules
  - Correlate with Sysmon 3 if available
  false_positives:
  - Scanners, monitoring, backup agents
  severity: low
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_smb_file_creation_admin_shares.yml
  - 'sample: EVTX-ATTACK-SAMPLES/Command and Control/DE_RDP_Tunnel_5156.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/sigma/builtin/placeholder/network_connection/net_connection_win_certsvc_outbound_smb_ldap.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/5156: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; Security/5157: MITRE CTI data-component
