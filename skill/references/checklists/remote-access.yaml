tactic: remote-access
title: Remote Access Services (RDP, WinRM, SMB)
description: 'Remote access services leave their evidence in three layers. For RDP the layers are the
  service-specific operational logs (TerminalServices-RemoteConnectionManager 1149, LocalSessionManager
  21/22/23/24/25, RdpCoreTS), the Security log (4624 type 10, 4778/4779, 4634/4647) and, on the machine
  the user came from, the RDP client log (1024/1102). For WinRM the WinRM/Operational channel records
  session creation on both ends, with Security 4624 type 3 and wsmprovhost.exe on the target. For SMB
  the Security 5140/5142/5143/5144/5145 family records share and file activity, with SMBServer/SMBClient
  channels adding authentication failures and signing posture. These logs answer who connected from where
  and when; they do not by themselves prove malice, so each check lists benign sources to rule out. Most
  of the RDP-specific events are written by default, whereas 5140/5145 and 5156 need audit policy, and
  RdpCoreTS and some SMB channels need verification on the actual build. Execution after the connection
  (service, task, WMI, DCOM) is in lateral-movement.yaml; external exposure and brute force are in initial-access.yaml.
  Source URLs are files read from shallow git clones; see references/sources/lateral-remote-initial.md.

  '
checks:
- id: FH-RMT-001
  title: RDP network authentication succeeded (RemoteConnectionManager 1149) with source address
  tactic: remote-access
  attack:
  - T1021.001
  - T1078
  channel: Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational
  provider: Microsoft-Windows-TerminalServices-RemoteConnectionManager
  event_ids:
  - 1149
  prerequisites:
  - Log enabled (default on Windows 7/2008 R2 and later); no audit policy needed
  logic:
    selection:
      EventID: 1149
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational
    --event-id 1149 --format llm
  pivots:
  - UserData Param1 = user, Param2 = domain, Param3 = source IP address (or empty user/domain with Restricted
    Admin)
  - Security 4624 LogonType 10 (or 7 on reconnect) for the same user and IpAddress within seconds, and
    LocalSessionManager 21/22 for the session id
  - A 1149 with no later 21/4624 means authentication passed at the network (NLA) level but the session
    never started
  false_positives:
  - Normal admin and user RDP; jump hosts and RD Gateway servers show the gateway IP as the source
  severity: informational
  sources:
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/TerminalServices-RemoteConnectionManager_Op/RemoteConnManger_1149_Info_RDP-LogonAttempt.yml
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/rdp_attacks/event_id_1149.yaml
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/mstsc.htm
  - 'sample: EVTX-ATTACK-SAMPLES/Command and Control/DE_RDP_Tunneling_TerminalServices-RemoteConnectionManagerOperational_1149.evtx'
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: MW-TerminalServices-RemoteConnectionManager/Operational/1149:
    rule project, real sample log. || Original notes: Hayabusa documents Param1/Param2/Param3 and says
    that on Windows 7+/2012+ it is logged only for successful authentication; JPCERT''s mstsc sheet lists
    1149 as the destination-side record with user, domain and source address. 1149 is NOT a failure log.
    Third-party descriptions that it implies a completed logon are wrong.'
- id: FH-RMT-002
  title: RDP session logon, shell start and reconnect (LocalSessionManager 21, 22, 25)
  tactic: remote-access
  attack:
  - T1021.001
  channel: Microsoft-Windows-TerminalServices-LocalSessionManager/Operational
  provider: Microsoft-Windows-TerminalServices-LocalSessionManager
  event_ids:
  - 21
  - 22
  - 25
  prerequisites:
  - Log enabled (default)
  logic:
    selection:
      EventID:
      - 21
      - 22
      - 25
    filter_local:
      Address: LOCAL
    condition: selection and not filter_local
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-TerminalServices-LocalSessionManager/Operational
    --event-id 21,22,25 --format llm
  pivots:
  - UserData User (DOMAIN\user), SessionID and Address; use SessionID to join 21 -> 22 -> 24/23 for the
    whole session timeline
  - 21 = session logon succeeded, 22 = shell start (explorer appeared), 25 = reconnect to an existing
    disconnected session
  - Address that is public or unusual for the user -> see FH-INIT-007
  - Security 4624 type 10 on the same host with the same TargetLogonId family; 4778 for reconnects
  false_positives:
  - Any legitimate RDP user; reconnects after network blips
  severity: informational
  sources:
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/TerminalServices-LocalSessionManager_Op/LocalSessManager_21_Info_RDP-Logon.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/TerminalServices-LocalSessionManager_Op/LocalSessManager_22_Info_RDP-SessStart_Noisy.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/TerminalServices-LocalSessionManager_Op/LocalSessManager_25_Info_RDP-Reconnect.yml
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/rdp_attacks/eid_21_rdp_session_logon_succeeded.yml
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/rdp_attacks/event_id_25.yaml
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/mstsc.htm
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/terminalservices/win_terminalservices_rdp_ngrok.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-TerminalServices-LocalSessionManager/Operational/21:
    rule project; MW-TerminalServices-LocalSessionManager/Operational/22: rule project; MW-TerminalServices-LocalSessionManager/Operational/25:
    rule project.  Open: event id / channel pair has fewer than two independent confirmations (SessionManager/21(rule),SessionManager/22(rule),SessionManager/25(rule))
    | field name confirmed by a single rule project only (not seen in a real log) (Address). || Original
    notes: Address is the string LOCAL for console sessions and the client IP for remote ones (Hayabusa).
    The message text of 21 says ''Session logon succeeded'', 22 ''Shell start notification received''.
    JPCERT lists 24 and 25 for mstsc.'
- id: FH-RMT-003
  title: RDP disconnect and logoff (LocalSessionManager 23, 24, 39, 40)
  tactic: remote-access
  attack:
  - T1021.001
  - T1563.002
  channel: Microsoft-Windows-TerminalServices-LocalSessionManager/Operational
  provider: Microsoft-Windows-TerminalServices-LocalSessionManager
  event_ids:
  - 23
  - 24
  - 39
  - 40
  prerequisites:
  - Log enabled (default)
  logic:
    selection:
      EventID:
      - 23
      - 24
      - 39
      - 40
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-TerminalServices-LocalSessionManager/Operational
    --event-id 23,24,39,40 --format llm
  pivots:
  - 23 = logoff, 24 = disconnected (user and Address). Time between 21 and 23 = session duration
  - '39: session X disconnected by session Y (the message names both ids) - a hijack or shadowing candidate
    when Y is a session the user did not start'
  - '40: disconnect with a reason code; map the code before interpreting it'
  - Disconnect without logoff leaves a session alive for later reconnect (25) - a persistence signal on
    servers
  false_positives:
  - Closing the RDP window disconnects instead of logging off; users on flaky links
  severity: informational
  sources:
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/TerminalServices-LocalSessionManager_Op/LocalSessManager_24_Info_RDP-Disconnect.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/TerminalServices-LocalSessionManager_Op/LocalSessManager_23_Info_RDP-Logoff.yml
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/rdp_attacks/eid_39_rdp_session_disconnected.yml
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/rdp_attacks/eid_23_rdp_session_logoff.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-TerminalServices-LocalSessionManager/Operational/23:
    rule project; MW-TerminalServices-LocalSessionManager/Operational/24: rule project; MW-TerminalServices-LocalSessionManager/Operational/39:
    rule project; MW-TerminalServices-LocalSessionManager/Operational/40: no source.  Open: event id /
    channel pair has fewer than two independent confirmations (SessionManager/23(rule),SessionManager/24(rule),SessionManager/39(rule),SessionManager/40()).
    || Original notes: 23, 24, 39 are present in Hayabusa and/or Chainsaw rules; event 40 and its reason
    codes are not covered by any source I could open and are listed from memory. Keep verified false until
    a lab sample or Microsoft documentation confirms event 40.'
- id: FH-RMT-004
  title: RDP logon in the Security log (4624 LogonType 10, and 7 / 12 on reconnect)
  tactic: remote-access
  attack:
  - T1021.001
  - T1078
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4624
  prerequisites:
  - Audit Logon (Success)
  logic:
    selection:
      EventID: 4624
      LogonType: 10
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4624 --field LogonType=10 --format llm
  - forhunt search <paths> --channel Security --event-id 4624 --field LogonType=7 --format llm
  pivots:
  - IpAddress = RDP client; WorkstationName is the client machine name as sent by the client (spoofable)
  - LogonProcessName User32 and AuthenticationPackageName Negotiate/Kerberos/NTLM; ProcessName winlogon.exe
  - 'Type 10 leaves the credentials in LSASS on the target (credential theft risk if the target is compromised):
    check Sysmon 10 against lsass afterwards'
  - Reconnect to a disconnected session is logged as an unlock-style logon (type 7) together with 4778;
    confirm in your own lab because JPCERT's reconnect sample did not state the type
  - Compare IpAddress 127.0.0.1 / ::1 -> RDP tunnelling (FH-RMT-006)
  false_positives:
  - Administrators, helpdesk, jump servers (IpAddress is the jump host)
  severity: informational
  sources:
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/mstsc.htm
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/Security/LogonLogoff/Logon/Sec_4624_Info_Logon-Type-10-RemoteInteractive.yml
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/rdp_attacks/event_id_4624_logontype_10.yaml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/account_management/win_security_admin_rdp_login.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0007-Discovery/T1069-Permission Groups Discovery/ID4799-4624-Local
    admin group enumerated by SharpHound.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_alert_ruler.yml
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/4624: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log. || Original notes: Type 10 with LogonProcessName
    User32 is confirmed by the JPCERT mstsc sheet and three rule sets. The type 7 reconnect claim is unconfirmed
    (see pivot) and the type 12 CachedRemoteInteractive case is rare. With NLA, failed RDP passwords show
    up as 4625 LogonType 3 (not 10) on most builds - see FH-INIT-006.'
- id: FH-RMT-005
  title: RDP session reconnect and disconnect in the Security log (4778, 4779)
  tactic: remote-access
  attack:
  - T1021.001
  - T1563.002
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4778
  - 4779
  prerequisites:
  - Audit Other Logon/Logoff Events (Success)
  logic:
    selection:
      EventID:
      - 4778
      - 4779
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4778,4779 --format llm
  pivots:
  - AccountName, AccountDomain, LogonID, SessionName (RDP-Tcp#N), ClientName and ClientAddress
  - ClientName/ClientAddress at reconnect differing from the original connection means the session was
    picked up from a different machine
  - ClientAddress of 127.0.0.1 or the server itself can be a tscon-style reconnection (FH-LAT-019)
  false_positives:
  - Roaming users reconnecting from different devices
  severity: low
  sources:
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/mstsc.htm
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/Security/LogonLogoff/OtherLogonLogoffEvents/Sec_4778_Info_RDP-SessReconn.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/Security/LogonLogoff/OtherLogonLogoffEvents/Sec_4779_Info_RDP-SessDisconn.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0008-Lateral Movement/T1021.001-Remote Desktop Protocol/ID4688-4778
    RDP hijack command execution.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - 'sample: EVTX-to-MITRE-Attack/TA0008-Lateral Movement/T1021.001-Remote Desktop Protocol/ID4688,4778,4779
    RDP hijack direct.evtx'
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/4778: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log; Security/4779: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log. || Original notes: Field names confirmed from
    a Hayabusa sample (SessionName, ClientName, ClientAddress); JPCERT lists both events on the destination
    host. Console reconnects (fast user switching) also produce these events with SessionName Console.'
- id: FH-RMT-006
  title: RDP through a tunnel - logon or flow from loopback
  tactic: remote-access
  attack:
  - T1021.001
  - T1090
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4624
  - 5156
  prerequisites:
  - Audit Logon (Success); Audit Filtering Platform Connection for the 5156 variant
  logic:
    selection_logon:
      EventID: 4624
      LogonType: 10
      IpAddress:
      - 127.0.0.1
      - ::1
    selection_wfp:
      EventID: 5156
      SourcePort: 3389
      DestAddress:
      - 127.0.0.1
      - ::1
    condition: selection_logon or selection_wfp
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4624 --field LogonType=10 --field IpAddress=127.0.0.1
    --format llm
  - forhunt search <paths> --channel Security --event-id 4624 --field LogonType=10 --field IpAddress=::1
    --format llm
  - forhunt search <paths> --channel Security --event-id 5156 --field SourcePort=3389 --format llm
  pivots:
  - 'Process that owns the other end of the tunnel (ssh.exe, plink.exe, ngrok, chisel): Sysmon 3 and 4688'
  - RemoteConnectionManager 1149 / LocalSessionManager 21 Address will also show the loopback or tunnel
    endpoint
  - The actual external endpoint is in the tunnelling tool's outbound connections, not in the RDP logs
  false_positives:
  - Local testing; some remote support tools proxy RDP over loopback
  severity: high
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/account_management/win_security_rdp_localhost_login.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_rdp_reverse_tunnel.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0007-Discovery/T1069-Permission Groups Discovery/ID4799-4624-Local
    admin group enumerated by SharpHound.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - 'sample: EVTX-ATTACK-SAMPLES/Command and Control/DE_RDP_Tunnel_5156.evtx'
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/4624: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; Security/5156: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states: Both
    patterns are from Sigma (citing FireEye and a public EVTX sample) and not confirmed by a second source
    I could open. || Original notes: Both patterns are from Sigma (citing FireEye and a public EVTX sample)
    and not confirmed by a second source I could open.'
- id: FH-RMT-007
  title: RDP enabled via registry (fDenyTSConnections set to 0)
  tactic: remote-access
  attack:
  - T1021.001
  - T1112
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 13
  - 4688
  - 1
  prerequisites:
  - Sysmon installed with a config that logs event 13 (registry value set) for HKLM\SYSTEM\CurrentControlSet\Control\Terminal
    Server
  - Alternatively process creation auditing with command line to catch reg.exe / PowerShell / netsh changes
  logic:
    selection:
      EventID: 13
      TargetObject|endswith: \Control\Terminal Server\fDenyTSConnections
      Details: DWORD (0x00000000)
    selection_cli:
      CommandLine|contains|all:
      - fDenyTSConnections
      - ' add '
    condition: selection or selection_cli
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 13 --field TargetObject~fDenyTSConnections
    --format llm
  - forhunt search <paths> --channel Security --event-id 4688 --field CommandLine~fDenyTSConnections --format
    llm
  pivots:
  - 'Image / ProcessGuid writing the value: reg.exe, powershell.exe, wmic, or an unknown binary'
  - 'Next in sequence: firewall rule for 3389 (FH-RMT-009), NLA change (FH-RMT-008), new local admin /
    RDP group membership (4732 for Remote Desktop Users)'
  - 'Timeline: first RDP logon (1149, 4624 type 10) after the change'
  false_positives:
  - Admins enabling RDP via System Properties, GPO or provisioning scripts (writes appear as the GPO client
    or svchost)
  severity: medium
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_terminal_server_suspicious.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_reg_rdp_keys_tamper.yml
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/mstsc.htm
  - 'sample: EVTX-to-MITRE-Attack/TA0004-Privilege Escalation/T1068-Exploitation for Privilege Escalation/ID12-13
    Mini_Plasma_PoC_AbortHydration_ArbitraryRegKey_EoP.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-to-MITRE-Attack/TA0005-Defense Evasion/T1027-Obfuscated Files or Information/ID4688-Obfuscated
    payload transfer via service name - Tchopper.evtx'
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/13: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; Security/4688: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; MW-Sysmon/Operational/1: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states. || Original
    notes: fDenyTSConnections = 0 means RDP allowed. Sigma is the only source that documents the exact
    value semantics; JPCERT confirms Sysmon 13 as a registry-set event but for other keys. A GPO enabling
    RDP may write the value through the Policies key (Policies\Microsoft\Windows NT\Terminal Services)
    instead.'
- id: FH-RMT-008
  title: RDP security weakened - NLA disabled or security layer changed
  tactic: remote-access
  attack:
  - T1021.001
  - T1112
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 13
  prerequisites:
  - Sysmon installed with a config that logs event 13 for the RDP-Tcp WinStation key
  logic:
    selection_nla:
      EventID: 13
      TargetObject|endswith: \WinStations\RDP-Tcp\UserAuthentication
      Details: DWORD (0x00000000)
    selection_layer:
      EventID: 13
      TargetObject|endswith: \WinStations\RDP-Tcp\SecurityLayer
    selection_other:
      EventID: 13
      TargetObject|contains: \Terminal Server
      TargetObject|endswith:
      - \fSingleSessionPerUser
      - \InitialProgram
      - \Shadow
    condition: selection_nla or selection_layer or selection_other
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 13 --field TargetObject~UserAuthentication
    --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 13 --field TargetObject~SecurityLayer
    --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 13 --field 'TargetObject~Terminal
    Server' --format llm
  pivots:
  - Same process and time as FH-RMT-007; after NLA is off, credential-less sessions and the sticky-keys
    style attack on the logon screen become possible
  - Shadow values 1-4 enable session shadowing (mstsc /shadow ... /noConsentPrompt)
  - InitialProgram runs a program at RDP logon - persistence
  false_positives:
  - Legacy client compatibility changes made by admins; SecurityLayer to 2 (TLS) is the hardened value
    and is excluded by common rules
  severity: medium
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_terminal_server_suspicious.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_terminal_server_tampering.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_mstsc_rdp_hijack_shadowing.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0004-Privilege Escalation/T1068-Exploitation for Privilege Escalation/ID12-13
    Mini_Plasma_PoC_AbortHydration_ArbitraryRegKey_EoP.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/13: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states. JPCERT
    sheets mentioning the same event ids/tools: net-user (informational). || Original notes: Single-source
    (Sigma). UserAuthentication 0 = NLA not required (Sigma comment). The --field with a space in the
    value may need quoting in your shell: use --field ''TargetObject~Terminal Server''.'
- id: FH-RMT-009
  title: Firewall opened for RDP (netsh / Windows Firewall rule add for 3389)
  tactic: remote-access
  attack:
  - T1021.001
  - T1686.003
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4688
  - 1
  - 2004
  prerequisites:
  - Process creation auditing with command line, or Sysmon event 1
  - Microsoft-Windows-Windows Firewall With Advanced Security/Firewall log for rule-added events (2004
    and Windows 11 equivalents)
  logic:
    selection:
      EventID: 4688
      NewProcessName|endswith: \netsh.exe
      CommandLine|contains|all:
      - firewall
      - add
      - '3389'
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4688 --field NewProcessName~netsh.exe --field
    CommandLine~3389 --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field CommandLine~3389
    --field CommandLine~firewall --format llm
  - forhunt search <paths> --channel 'Microsoft-Windows-Windows Firewall With Advanced Security/Firewall'
    --event-id 2004 --format llm
  pivots:
  - Window around fDenyTSConnections change (FH-RMT-007) and first RDP logon
