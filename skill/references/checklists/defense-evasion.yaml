  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_sysmon_channel_reference_deletion.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/4688: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; MW-Sysmon/Operational/1: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; Security/4657: MITRE CTI data-component
    log source, Microsoft docs, rule project; Security/4663: MITRE CTI data-component log source, Microsoft
    docs, rule project, real sample log.  Open: field name confirmed by a single rule project only (not
