tactic: lateral-movement
title: Lateral Movement
description: 'Lateral movement in Windows event logs is mostly a pairing problem: an authentication event
  on the target (Security 4624 network, remote-interactive or new-credentials logon), followed by a remote-execution
  artefact (service install 7045/4697, scheduled task 4698 and TaskScheduler 106/200, WMI/WinRM/DCOM child
  processes, 5145 named-pipe writes over IPC$ or writes to ADMIN$/C$). Check both ends: the destination
  host records most artefacts, the source host records 4648 explicit-credential use, outbound Sysmon 3
  and RDP client events. Several heuristics widely quoted in the community (for example "NTLM logon with
  KeyLength 0 means pass-the-hash") do not hold in every lab, so they are marked verified false with the
  contradicting evidence in notes. RDP-specific session telemetry lives in remote-access.yaml, brute force
  and external logons in initial-access.yaml. Source URLs under github.com are files read from shallow
  clones of the named projects; see references/sources/lateral-remote-initial.md for what was and was
  not reachable.

  '
checks:
- id: FH-LAT-001
  title: PsExec service installed on target (PSEXESVC)
  tactic: lateral-movement
  attack:
  - T1569.002
  - T1021.002
  channel: System
  provider: Service Control Manager
  event_ids:
  - 7045
  prerequisites:
  - System log retained (7045 is logged by default)
  logic:
    selection:
      EventID: 7045
      Provider: Service Control Manager
    selection_name:
      ServiceName: PSEXESVC
    selection_image:
      ImagePath|endswith: \PSEXESVC.exe
    condition: selection and (selection_name or selection_image)
  forhunt:
  - forhunt search <paths> --channel System --event-id 7045 --field ServiceName=PSEXESVC --format llm
  - forhunt search <paths> --channel System --event-id 7045 --field ImagePath~PSEXESVC --format llm
  pivots:
  - 'Security 4624 LogonType 3 on the same host a few seconds earlier: IpAddress is the PsExec source'
  - Security 5145 ShareName ADMIN$ with RelativeTargetName PSEXESVC.exe (the binary copy) and IPC$ pipes
    ending -stdin/-stdout/-stderr
  - Sysmon 1 / Security 4688 with ParentImage C:\Windows\PSEXESVC.exe to see what was run
  - 'Source host: Sysmon 13 HKU\<SID>\Software\Sysinternals\PsExec\EulaAccepted, Prefetch PSEXEC.EXE'
  false_positives:
  - Authorised administrators or deployment tooling that still use PsExec
  severity: high
  sources:
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/PsExec.htm
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/service_control_manager/win_system_service_install_sysinternals_psexec.yml
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/service_installation/sysinternals_psexec.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/System/Sys_7045_Med_LateralMovement-PSEXEC.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0002-Execution/T1569.002-Service execution/ID7000,7009,7045-Payload
    deployed via service - Tchopper.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: System/7045: MITRE CTI data-component log source,
    rule project, real sample log. JPCERT sheets mentioning the same event ids/tools: PsExec (informational).
    || Original notes: The service name can be changed with PsExec -r, and clones use other names; see
    FH-LAT-002. 4697 (Security) is the same action when Audit Security System Extension is on.'
- id: FH-LAT-002
  title: PsExec clones and Impacket-style remote service install (random names, known clone names)
  tactic: lateral-movement
  attack:
  - T1569.002
  - T1543.003
  channel:
  - System
  - Security
  - Microsoft-Windows-Sysmon/Operational
  provider: Service Control Manager
  event_ids:
  - 7045
  - 4697
  - 4688
  - 1
  prerequisites:
  - System log retained (7045)
  - Audit Security System Extension (Success) for the Security 4697 variant
  - '4688 / Sysmon 1 variant: process creation auditing or Sysmon event 1 (the service binary starting)'
  logic:
    selection_7045:
      EventID: 7045
      Provider: Service Control Manager
    clone_names:
      ServiceName|startswith: PAExec-
    clone_names2:
      ServiceName:
      - RemComSvc
      - csexecsvc
    random_impacket_like:
      ImagePath|re: ^%systemroot%\\[a-zA-Z]{8}\.exe$
      ServiceName|re: ^([a-zA-Z]{4}|[a-zA-Z]{8}|[a-zA-Z]{16})$
    condition: selection_7045 and (clone_names or clone_names2 or random_impacket_like)
  forhunt:
  - forhunt search <paths> --channel System --event-id 7045 --regex ImagePath='^%systemroot%\\[a-zA-Z]{8}\.exe$'
    --format llm
  - forhunt search <paths> --channel System --event-id 7045 --field ServiceName~PAExec --format llm
  - forhunt search <paths> --channel Security --event-id 4697 --regex ServiceFileName='^%systemroot%\\[a-zA-Z]{8}\.exe$'
    --format llm
  - forhunt search <paths> --channel Security --event-id 4688 --regex 'NewProcessName=^C:\\Windows\\[a-zA-Z]{8}\.exe$'
    --field 'ParentProcessName~\services.exe' --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --regex 'Image=^C:\\Windows\\[a-zA-Z]{8}\.exe$'
    --field 'ParentImage~\services.exe' --format llm
  pivots:
  - 'Same time window: 5145 on IPC$ with RelativeTargetName RemCom_stdin/RemCom_stdout/RemCom_stderr (Impacket
    psexec.py)'
  - 4624 LogonType 3 with LogonProcessName NtLmSsp from the same IpAddress
  - Dropped executable in %SystemRoot% (Sysmon 11 TargetFilename, MFT)
  - 'The service binary starting: 4688 / Sysmon 1 of C:\Windows\<8 letters>.exe with services.exe as
    parent (lab: 1 match each, the Metasploit psexec service, out of 1080 / 711 process creations)'
  false_positives:
  - Software installers that create 8-letter random service binaries are uncommon but possible; check
    the file hash and signer
  severity: high
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_metasploit_or_impacket_smb_psexec_service_install.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/service_control_manager/win_system_service_install_paexec.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/service_control_manager/win_system_service_install_remcom.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/service_control_manager/win_system_service_install_csexecsvc.yml
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/service_installation/csexec.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0002-Execution/T1569.002-Service execution/ID7000,7009,7045-Payload
    deployed via service - Tchopper.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-to-MITRE-Attack/TA0008-Lateral Movement/T1021.002-SMB Windows Admin Shares/ID4688,4697,5140-5145
    PSexec remote execution + admin share.evtx'
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: System/7045: MITRE CTI data-component log
    source, rule project, real sample log; Security/4697: MITRE CTI data-component log source, Microsoft
    docs, rule project, real sample log.  Open: literal value not found in any opened source (^([a-zA-Z]{4}|[a-zA-Z]{8}|[a-zA-Z]{16})$).
    JPCERT sheets mentioning the same event ids/tools: PsExec (informational). || Original notes: Random-name
    pattern is from a single Sigma rule written from one lab; Impacket versions differ and the name length/format
    is tunable by the operator. Treat a hit as a lead, not proof. In System 7045 the field is ImagePath;
    in Security 4697 it is ServiceFileName.'
- id: FH-LAT-003
  title: Named-pipe traffic of PsExec and clones over IPC$ (stdin/stdout/stderr pipes)
  tactic: lateral-movement
  attack:
  - T1569.002
  - T1021.002
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 5145
  prerequisites:
  - 'Advanced Audit Policy: Object Access > Audit Detailed File Share (Success), on the target'
  logic:
    selection:
      EventID: 5145
      ShareName|endswith: IPC$
    pipe_names:
      RelativeTargetName|endswith:
      - -stdin
      - -stdout
      - -stderr
    impacket_pipes:
      RelativeTargetName|contains:
      - RemCom_stdin
      - RemCom_stdout
      - RemCom_stderr
    condition: selection and (pipe_names or impacket_pipes)
  forhunt:
  - forhunt search <paths> --channel Security --event-id 5145 --field RelativeTargetName~-stdin --format
    llm
  - forhunt search <paths> --channel Security --event-id 5145 --field RelativeTargetName~RemCom_std --format
    llm
  pivots:
  - IpAddress of the 5145 = the host the commands came from; look at that host as the next hop in the
    chain
  - For genuine PsExec the pipe is named PSEXESVC-<SourceHost>-<SourcePID>-stdin etc., which leaks the
    source hostname and PID
  - Matching 7045 on the same target (FH-LAT-001 / FH-LAT-002)
  false_positives:
  - Legitimate PsExec by administrators; RemCom-based management tools
  severity: high
  sources:
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/PsExec.htm
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_psexec.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_impacket_psexec.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0002-Execution/T1047-Windows Management Instrumentation/ID4688-5145-WMIexec
    execution via SMB.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/5145: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log. JPCERT sheets mentioning the same event ids/tools:
    PsExec (informational). || Original notes: JPCERT lab output shows 5145 with the PSEXESVC-<host>-<pid>-stdin
    style relative names; Sigma uses the same field names (ShareName, RelativeTargetName). ShareName is
    rendered as \\*\IPC$ in the event.'
- id: FH-LAT-004
  title: Remote service control over the svcctl pipe (sc.exe \\host, smbexec, PsExec)
  tactic: lateral-movement
  attack:
  - T1021.002
  - T1569.002
  - T1543.003
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 5145
  prerequisites:
  - Audit Detailed File Share (Success) on the target
  logic:
    selection:
      EventID: 5145
      ShareName|endswith: IPC$
      RelativeTargetName: svcctl
      AccessList|contains: '%%4417'
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Security --event-id 5145 --field RelativeTargetName=svcctl --format
    llm
  pivots:
  - 'System 7045 / Security 4697 within seconds on the same host: which service was created and which
    binary it points at'
  - IpAddress and SubjectUserName of the 5145 give the origin and account
  - 'Administrative hosts (patch, monitoring) will dominate: build an allow-list of source IPs first'
  false_positives:
  - Management servers, vulnerability scanners and SCCM that talk svcctl remotely
  severity: medium
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_svcctl_remote_service.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_lm_namedpipe.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0002-Execution/T1047-Windows Management Instrumentation/ID4688-5145-WMIexec
    execution via SMB.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/5145: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log.  Note: flipped to true: 5145 with RelativeTargetName
    svcctl on \\*\IPC$ and write access matches the Sigma rule; real logs show svcctl 5145 events with
    AccessList tokens %%4417 (the original value WriteData never appears in raw EVTX and was corrected)
    | corrections: AccessList in 5145 holds message tokens (%%4417 = WriteData or AddFile), not the word
    WriteData; value fixed (sample: 60 events with %%4417, 0 with WriteData). JPCERT sheets mentioning
    the same event ids/tools: PsExec (informational). || Original notes: Only Sigma documents this pattern
    (originating from a Menasec blog I could not open). Semantics are plausible but unconfirmed by a second
    source.'
- id: FH-LAT-005
  title: Remote scheduled task creation over the atsvc pipe (atexec, schtasks /s)
  tactic: lateral-movement
  attack:
  - T1053.005
  - T1021.002
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 5145
  prerequisites:
  - Audit Detailed File Share (Success) on the target
  logic:
    selection:
      EventID: 5145
      ShareName|endswith: IPC$
      RelativeTargetName: atsvc
      AccessList|contains: '%%4417'
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Security --event-id 5145 --field RelativeTargetName=atsvc --format
    llm
  pivots:
  - Security 4698 (TaskName, TaskContent) within the same minute (FH-LAT-006)
  - Microsoft-Windows-TaskScheduler/Operational 106 then 200/201 for the same task
  - Impacket atexec leaves a cmd.exe /C ... > %windir%\Temp\<random>.tmp 2>&1 child of the Task Scheduler
    service
  false_positives:
  - Remote schtasks used by legitimate admins and some management suites
  severity: medium
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_atsvc_task.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0002-Execution/T1047-Windows Management Instrumentation/ID4688-5145-WMIexec
    execution via SMB.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_lm_namedpipe.yml
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/5145: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log.  Note: flipped to true: 5145 with RelativeTargetName
    atsvc on \\*\IPC$ and write access matches the Sigma rule; real logs contain an atsvc 5145 event and
    AccessList is tokenised (%%4417), so WriteData was corrected | corrections: AccessList in 5145 holds
    message tokens (%%4417 = WriteData or AddFile), not the word WriteData; value fixed (sample: 60 events
    with %%4417, 0 with WriteData). || Original notes: Single-source (Sigma). JPCERT''s schtasks sheet
    shows 445/tcp usage but its destination-host events were 4624/4648 and TaskScheduler 106/200/201,
    not a named-pipe 5145 record.'
- id: FH-LAT-006
  title: Remote scheduled task - 4698 plus network logon from the same source
  tactic: lateral-movement
  attack:
  - T1053.005
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4698
  - 4624
  prerequisites:
  - Audit Other Object Access Events (Success) for 4698
  - Audit Logon (Success) for 4624
  - Microsoft-Windows-TaskScheduler/Operational enabled (disabled by default on many builds) for 106/200/201
  logic:
    task_created:
      EventID: 4698
    network_logon:
      EventID: 4624
      LogonType: 3
    condition: network_logon followed by task_created on same Computer within 60s where task_created.SubjectLogonId
      = network_logon.TargetLogonId
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4698 --format llm
  - forhunt search <paths> --channel Microsoft-Windows-TaskScheduler/Operational --event-id 106,200,201
    --format llm
  pivots:
  - 'TaskContent: Command / Arguments / Principals UserId (S-1-5-18 means it will run as SYSTEM); tasks
    launching cmd, powershell or from Temp/ProgramData are high value'
  - 4624 IpAddress for the creating logon (SubjectLogonId of the 4698 equals TargetLogonId of the 4624)
    identifies the source host
  - 'Short-lived tasks: 4698 then 4699 (deleted) within seconds is typical of atexec/schtasks one-shot
    execution'
  false_positives:
  - Software deployment, backup agents and monitoring tools that register tasks remotely
  severity: medium
  sources:
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/schtasks.htm
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_scheduled_task_creation.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/Security/ObjectAccess/OtherObjectAccessEvents/Sec_4698_Info_TaskCreated.yml
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/persistence/T1053.005%20-%20Scheduled%20Task%20was%20Created.yml
  - 'sample: EVTX-ATTACK-SAMPLES/Execution/temp_scheduled_task_4698_4699.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - 'sample: EVTX-to-MITRE-Attack/TA0007-Discovery/T1069-Permission Groups Discovery/ID4799-4624-Local
    admin group enumerated by SharpHound.evtx'
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_alert_ruler.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/4698: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; Security/4624: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: the 4698 + 4624 join (same SubjectLogonId/TargetLogonId
    within 60 s) is an analyst-designed correlation; JPCERT did not capture 4698 and no rule defines the
    join. Only the individual event/field facts are confirmed. || Original notes: JPCERT confirms TaskScheduler
    106/200/201 and a type 3 NTLM 4624 (KeyLength 128) on the target for remote schtasks; 4698 field names
    TaskName/TaskContent confirmed by Sigma and a Hayabusa sample. JPCERT''s lab did not include 4698
    (audit not enabled), so the 4698 + 4624 join itself is an analyst heuristic.'
- id: FH-LAT-007
  title: WMI remote execution - WmiPrvSE.exe spawning command interpreters
  tactic: lateral-movement
  attack:
  - T1047
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4688
  prerequisites:
  - Audit Process Creation (Success) and Include command line in process creation events (4688), or Sysmon
    installed with a config that logs event 1
  logic:
    selection:
      EventID: 4688
      ParentProcessName|endswith: \WmiPrvSE.exe
    filter_image:
      NewProcessName|endswith:
      - \WmiPrvSE.exe
      - \WerFault.exe
    filter_system:
      SubjectUserSid: S-1-5-18
    condition: selection and not filter_image and not filter_system
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4688 --field ParentProcessName~WmiPrvSE --format
    llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field ParentImage~WmiPrvSE
    --format llm
  pivots:
  - 4624 LogonType 3 (Kerberos or NTLM) from the same IpAddress seconds earlier; JPCERT also saw a LogonType
    5 (Advapi, service) logon for the WMI host process itself
  - WMI-Activity/Operational 5857 (provider started, HostProcess wmiprvse.exe) and 5860/5861 for persistent
    subscriptions
  - Command line containing cmd.exe /Q /c ... \\127.0.0.1\ADMIN$\__<epoch> means Impacket wmiexec (FH-LAT-008)
  false_positives:
  - Monitoring, inventory and management agents that run commands through WMI
  severity: high
  sources:
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/wmic.htm
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/wmiexec-vbs.htm
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_wmiprvse_spawning_process.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/account_management/win_security_susp_wmi_login.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0005-Defense Evasion/T1027-Obfuscated Files or Information/ID4688-Obfuscated
    payload transfer via service name - Tchopper.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_hktl_impacket_lateral_movement.yml
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/4688: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log. JPCERT sheets mentioning the same event ids/tools:
    net-user (informational). || Original notes: In 4688 the parent is only present as ParentProcessName
    on Windows 10 / Server 2016+ with the corresponding audit; on older systems use Sysmon 1 (ParentImage).
    JPCERT sheets for wmic and wmiexec.vbs confirm WmiPrvSE.exe as the parent on the destination host.'
- id: FH-LAT-008
  title: Impacket exec family - cmd /Q /c with output redirected to \\127.0.0.1\ADMIN$ or C$
  tactic: lateral-movement
  attack:
  - T1047
  - T1021.003
  - T1021.002
  - T1569.002
  - T1053.005
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 1
  - 4688
  - 11
  prerequisites:
  - Sysmon installed with a config that logs event 1 (and event 11 for the output file), or 4688 with
    command line auditing
  logic:
    selection:
      CommandLine|contains|all:
      - cmd.exe
      - /Q
      - /c
      - \\127.0.0.1\
      - '&1'
    selection_parent:
      ParentImage|endswith:
      - \WmiPrvSE.exe
      - \mmc.exe
      - \explorer.exe
      - \services.exe
    selection_file:
      TargetFilename|re: (\\Windows\\|^[A-Z]:\\)__1\d{9}\.\d{1,7}$
    condition: (selection and selection_parent) or selection_file
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field CommandLine~127.0.0.1
    --field 'CommandLine~ADMIN$' --format llm
  - forhunt search <paths> --channel Security --event-id 4688 --field CommandLine~127.0.0.1 --field 'CommandLine~ADMIN$'
    --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 11 --regex TargetFilename='__1\d{9}\.\d+$'
    --format llm
  pivots:
  - 'Parent identifies the variant: WmiPrvSE.exe = wmiexec, mmc.exe = dcomexec MMC20, explorer.exe = dcomexec
    ShellWindows/ShellBrowserWindow, services.exe = smbexec'
  - 'atexec variant: parent svchost.exe -k netsvcs (Win10) running cmd.exe /C ... > C:\Windows\Temp\<random>.tmp
    2>&1'
  - The numeric part of the __<epoch>.<fraction> file name is the operator session start time
  - 'Network side: 4624 LogonType 3 and 5140/5145 for ADMIN$ from the source IpAddress'
  false_positives:
  - Rare; only unusual admin scripts that redirect to a loopback admin share
  severity: critical
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_hktl_impacket_lateral_movement.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_wmiexec_default_filename.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_writing_local_admin_share.yml
