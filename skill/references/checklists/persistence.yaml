- id: FH-PER-020
  title: Account enabled or modified for persistence - Security 4722 / 4738
  tactic: persistence
  attack:
  - T1098
  - T1136.001
  channel: Security
  event_ids:
  - 4722
  - 4738
  prerequisites:
  - Audit User Account Management (Success) enabled
  logic:
    selection_enable:
      EventID: 4722
    selection_change:
      EventID: 4738
    condition: selection_enable or selection_change
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4722 --format llm
  - forhunt search <paths> --channel Security --event-id 4738 --format llm --limit 200
  pivots:
  - 4738 shows changed attributes (e.g. password-not-required, delegation target, UAC flags, SID history)
  - Pair with 4720 (new accounts) and 4728/4732 (group adds)
