  - 'sample: EVTX-ATTACK-SAMPLES/Defense Evasion/DE_WinEventLogSvc_Crash_System_7036.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-to-MITRE-Attack/TA0006-Credential Access/T1649- Steal or Forge Authentication Certificates/ID
    39 KDC - ADCS ESC 1 auth request.evtx'
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_service_tamper.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: System/7036: MITRE CTI data-component log
    source, rule project, real sample log; System/7040: MITRE CTI data-component log source, rule project,
    real sample log; Security/4688: MITRE CTI data-component log source, Microsoft docs, rule project,
    real sample log.  Open: event ids, channel and fields are confirmed (see above) but the detection
    logic goes beyond what any opened rule/source states: The list of services in selection_disabled beyond
    Defender and Event Log is analyst knowledge. ATT&CK: legacy id(s) T1562.001 were revoked in the current
    mitre/cti enterprise-attack data; the replacement id is listed first and the legacy id is kept after
    it. || Original notes: 7036 param1/param2 are service display name and new state (localised) per SigmaHQ;
