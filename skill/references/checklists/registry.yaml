  - https://www.mandiant.com/resources/blog/caching-out-the-val-of-appcompatcache
  verified: false
  notes: 'Sources cited, not re-read in this session. Field names come from forhunt''s own parser (D-050). Written at shutdown [K]: a live collection misses what appeared since boot.'
- id: FH-REG-017
  title: Known attack and remote tool names in any execution source
  tactic: registry
  attack:
  - T1588.002
  - T1219
  channel: Registry
  event_ids:
  - 20
  - 21
  - 22
  - 23
  prerequisites:
  - At least one of SYSTEM, Amcache.hve, NTUSER.DAT
  logic:
    selection:
      EventID:
      - 20
      - 21
      - 22
      - 23
      ExePath|re: \\(mimikatz|mimi\d*|psexec(64)?|psexesvc|paexec|procdump(64)?|rclone|winscp|filezilla|megasync|anydesk|teamviewer|screenconnect|ngrok|plink|chisel|nmap|masscan|advanced_ip_scanner|lazagne|rubeus|sharphound|bloodhound|adfind|wmiexec|cobaltstrike|beacon|nanodump|winpeas)[^\\]*\.exe$
    condition: selection
  forhunt:
  - forhunt search <paths> -c Registry -e 20-23 --regex 'ExePath=\\(mimikatz|mimi\d*|psexec(64)?|psexesvc|paexec|procdump(64)?|rclone|winscp|filezilla|megasync|anydesk|teamviewer|screenconnect|ngrok|plink|chisel|nmap|masscan|advanced_ip_scanner|lazagne|rubeus|sharphound|bloodhound|adfind|wmiexec|cobaltstrike|beacon|nanodump|winpeas)[^\\]*\.exe$' --format llm
  pivots:
  - 'One program across sources: forhunt search <paths> -f ExePath~<name>'
  - 'What it reached: logons, shares and transfers around its run time'
  false_positives:
  - Authorised admin or red team tools; WinSCP and FileZilla in plain IT use
  severity: high
  sources:
  - https://attack.mitre.org/techniques/T1588/002/
  - https://attack.mitre.org/techniques/T1219/
  verified: false
  notes: Sources cited, not re-read in this session. Field names come from forhunt's own parser (D-050). Name-based, so a renamed tool is missed. Amcache's Sha1 survives a rename.
- id: FH-REG-018
  title: 'UserAssist: console and admin tools started from the desktop'
  tactic: registry
  attack:
  - T1059.003
  - T1059.001
  channel: Registry
  event_ids:
  - 22
  prerequisites:
  - NTUSER.DAT of each profile
  logic:
    selection:
      EventID: 22
      ExePath|re: \\(cmd|powershell|powershell_ise|regedit|mmc|taskmgr|wmic|mstsc|eventvwr|gpedit)\.(exe|msc)$
    condition: selection
  forhunt:
  - forhunt search <paths> -c Registry -e 22 --regex 'ExePath=\\(cmd|powershell|powershell_ise|regedit|mmc|taskmgr|wmic|mstsc|eventvwr|gpedit)\.(exe|msc)$' --format llm
  pivots:
  - 'User and RunCount: is this account expected to use these?'
  - Time of the last run against logons (type 2, 10)
  false_positives:
  - Administrators and helpdesk accounts
  severity: low
  sources:
  - https://attack.mitre.org/techniques/T1059/
  - https://www.nirsoft.net/utils/userassist_view.html
  verified: false
  notes: 'Sources cited, not re-read in this session. Field names come from forhunt''s own parser (D-050). Only GUI starts count: command-line runs never appear. Paths may hold a known-folder GUID instead of a drive.'
- id: FH-REG-019
