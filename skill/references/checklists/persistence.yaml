- id: FH-PER-022
  title: Service DLL / ImagePath registry tampering and sc.exe service creation
  tactic: persistence
  attack:
  - T1543.003
  - T1574.011
  channel: Microsoft-Windows-Sysmon/Operational
  event_ids:
  - 1
  - 13
  prerequisites:
  - Sysmon installed with a config that logs event 1 and 13
  logic:
    selection_sc:
      EventID: 1
      Image|endswith: \sc.exe
      CommandLine|contains|all:
      - create
      - binPath
    selection_reg:
      EventID: 13
      TargetObject|contains: \CurrentControlSet\Services\
      TargetObject|endswith:
      - \ServiceDll
      - \ImagePath
    condition: selection_sc or selection_reg
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~sc.exe
    --field CommandLine~binPath --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 13 --field TargetObject~ServiceDll
    --format llm
  pivots:
  - System 7045 / Security 4697 for the resulting service
  - Writer process Image for the registry change (services.exe is normal; reg.exe/powershell is not)
  - Sysmon 11/7 for ServiceDll payload
  false_positives:
  - Installers; parent software installation
  severity: medium
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_sc_create_service.yml
  - https://github.com/mitre-attack/attack-stix-data/blob/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-ATTACK-SAMPLES/AutomatedTestingTools/PanacheSysmon_vs_AtomicRedTeam01.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-to-MITRE-Attack/TA0004-Privilege Escalation/T1068-Exploitation for Privilege Escalation/ID12-13
    Mini_Plasma_PoC_AbortHydration_ArbitraryRegKey_EoP.evtx'
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_sc_change_sevice_image_path_by_non_admin.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/1: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; MW-Sysmon/Operational/13: MITRE CTI data-component
