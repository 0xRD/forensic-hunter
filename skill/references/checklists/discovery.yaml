- id: FH-DISC-014
  title: Network share discovery - one source touching many shares (5140)
  tactic: discovery
  attack:
  - T1135
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 5140
  prerequisites:
  - Audit File Share (Success) on file servers and DCs
  logic:
    selection:
