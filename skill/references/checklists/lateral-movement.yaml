- id: FH-LAT-022
  title: Privileged network logon on a non-server host (4624 type 3 followed by 4672 with the same logon
    id)
  tactic: lateral-movement
  attack:
  - T1021.002
  - T1078
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4624
  - 4672
  prerequisites:
  - Audit Logon and Audit Special Logon (Success)
  - Baseline of which admin accounts legitimately log on to which hosts
  logic:
    network:
      EventID: 4624
      LogonType: 3
    filter_local:
      IpAddress:
      - '-'
      - 127.0.0.1
      - ::1
    filter_machine:
      TargetUserName|endswith: $
    privileged:
      EventID: 4672
    condition: network and privileged with privileged.SubjectLogonId = network.TargetLogonId, excluding
      filter_local and filter_machine
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4624 --field LogonType=3 --format llm
  - forhunt search <paths> --channel Security --event-id 4672 --format llm
  pivots:
  - 'IpAddress and WorkstationName of the 4624: the pivot host'
  - Count distinct Computer values per (TargetUserName, IpAddress) across the log set - one account hitting
    many hosts in minutes is spreading
  - 'Next artefacts on that host: 7045/4697, 4698, 5145 writes, WmiPrvSE or wsmprovhost children'
  false_positives:
  - Domain admins and service accounts used by management servers
  severity: informational
  sources:
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/PsExec.htm
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/wmic.htm
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/lateral_movement/network_logon.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/Security/LogonLogoff/SpecialLogon/Sec_4672_Info_AdminLogon.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0007-Discovery/T1069-Permission Groups Discovery/ID4799-4624-Local
    admin group enumerated by SharpHound.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - 'sample: EVTX-to-MITRE-Attack/TA0002-Execution/T1047-Windows Management Instrumentation/ID4688-5145-WMIexec
    execution via SMB.evtx'
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_alert_ruler.yml
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/4624: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log; Security/4672: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log. JPCERT sheets mentioning the same event ids/tools:
    net-user (informational). || Original notes: JPCERT shows 4624 type 3 and 4672 on the destination
    for PsExec, WMI and others; Chainsaw uses type 3 with non-local IpAddress. The join on logon id is
    standard (Microsoft documents SubjectLogonId in 4672 as the same session) but I could not open that
    page. This is a triage filter, not a detection.'
