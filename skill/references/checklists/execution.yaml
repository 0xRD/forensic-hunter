- id: FH-EXE-005
  title: PowerShell engine started as version 2 while the host is newer (downgrade) - classic 400
  tactic: execution
  attack:
  - T1059.001
  channel: Windows PowerShell
  event_ids:
  - 400
  prerequisites:
  - Windows PowerShell 2.0 engine feature present on the host (an attacker can only downgrade if it is
    installed)
  - Classic 'Windows PowerShell' log is enabled by default; EventID 400 is an engine-lifecycle info event
  logic:
    selection:
      EventID: 400
      Data[3]|contains: EngineVersion=2.
    filter_legit_v2_host:
      Data[3]|contains: HostVersion=2.
    condition: selection and not filter_legit_v2_host
  forhunt:
  - forhunt search <paths> --channel "Windows PowerShell" --event-id 400 --field Data[3]~EngineVersion=2.
    --format llm
  pivots:
  - HostApplication line in the same event shows the exact command line used
  - Sysmon 1 / 4688 for powershell.exe with -Version 2
  - 'No 4104 will exist for v2 sessions (v2 has no script block logging): gap in 4104 around the same
    time is itself a signal'
  false_positives:
  - Very old scripts or legacy products that explicitly require PowerShell 2.0
  severity: medium
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_classic/posh_pc_downgrade_attack.yml
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/powershell/eid_400_powershell_engine_state_available.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0007-Discovery/T1087-Account discovery/ID800 - SPN discovery (PowerShell).evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Windows PowerShell/400: MITRE CTI data-component
    log source, rule project, real sample log.  Note: corrections: Classic PowerShell 400/600 payload
    (HostVersion, EngineVersion, HostApplication) is in positional field Data[3]; Data[1]/Data[2] hold
    provider/engine state. || Original notes: Event 400 carries a multi-line ''Data'' blob (HostName,
    HostVersion, EngineVersion, HostApplication ...). Chainsaw parses Data[2] as key=value lines; Sigma
    matches on the blob text. Event 600 (provider lifecycle) is covered separately in FH-EXE-006.'
- id: FH-EXE-006
  title: Classic PowerShell provider start (600) revealing host application and engine version
  tactic: execution
  attack:
  - T1059.001
  channel: Windows PowerShell
  event_ids:
  - 600
  prerequisites:
  - Classic 'Windows PowerShell' log (default on)
  logic:
    selection:
      EventID: 600
      Data[3]|contains:
      - HostApplication=
      - EngineVersion=2.
    condition: selection
  forhunt:
  - forhunt search <paths> --channel "Windows PowerShell" --event-id 600 --format llm
  - forhunt search <paths> --channel "Windows PowerShell" --event-id 600 --field Data[3]~HostApplication=
    --format llm
  pivots:
  - HostApplication=... shows the command line when PowerShell was launched without 4688/Sysmon coverage
  - Providers started (WSMan, Registry, Alias...) that hint at remoting
  false_positives:
  - 'High volume on busy hosts: each PowerShell start emits several 600 events'
  severity: low
  sources:
  - https://github.com/mitre-attack/attack-stix-data/blob/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-to-MITRE-Attack/TA0007-Discovery/T1087-Account discovery/ID800 - SPN discovery (PowerShell).evtx'
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Windows PowerShell/600: rule project, real
    sample log.  Open: event ids, channel and fields are confirmed (see above) but the detection logic
    goes beyond what any opened rule/source states | corrections: Classic PowerShell 400/600 payload (HostVersion,
    EngineVersion, HostApplication) is in positional field Data[3]; Data[1]/Data[2] hold provider/engine
    state. || Original notes: NO EVENT-LEVEL SOURCE OPENED for 600 (ATT&CK used only for the technique
    id). Sigma reuses its classic-start category for 400 and a provider-start category for 600; I did
    not confirm the exact 600 field layout from a primary source. Use as supplementary host-application
    evidence only.'
- id: FH-EXE-007
  title: PowerShell script block containing a download cradle (4104)
  tactic: execution
  attack:
  - T1059.001
  - T1105
  channel: Microsoft-Windows-PowerShell/Operational
  event_ids:
  - 4104
  prerequisites:
  - 'Script Block Logging enabled (GPO: Administrative Templates > Windows PowerShell > Turn on PowerShell
    Script Block Logging, or the ScriptBlockLogging registry policy)'
  - Windows PowerShell 5.1 logs to Microsoft-Windows-PowerShell/Operational; PowerShell 7 logs to PowerShellCore/Operational
  logic:
    selection_client:
      ScriptBlockText|contains:
      - System.Net.WebClient
      - Invoke-WebRequest
      - Net.WebRequest
      - Start-BitsTransfer
    selection_method:
      ScriptBlockText|contains:
      - .DownloadString(
      - .DownloadFile(
      - .DownloadData(
      - 'iwr '
      - 'irm '
      - Invoke-RestMethod
    condition: selection_client or selection_method
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~DownloadString --format llm
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~Net.WebClient --format llm
  pivots:
  - 'MessageNumber/MessageTotal: long scripts are split across several 4104 events - reassemble by ScriptBlockId'
  - URL in the script block -> proxy/DNS logs, Sysmon 3/22
  - Sysmon 1 / 4688 for the process that hosted it; Sysmon 11 for dropped files
  false_positives:
  - Admin and deployment scripts that fetch installers
  - Module installers (PowerShellGet) downloading packages
  severity: medium
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_susp_download.yml
  - https://github.com/MicrosoftDocs/PowerShell-Docs/blob/main/reference/7.5/Microsoft.PowerShell.Core/About/about_Logging_Windows.md
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/powershell/eid_4104_powershell_script_executed.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0007-Discovery/T1016-System Network Configuration Discovery/ID800-4103-4104-Firewall
    configuration enumerated (PowerShell).evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_web_request_cmd_and_cmdlets.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-PowerShell/Operational/4104: MITRE CTI
    data-component log source, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states: The
    ScriptBlockText field name is seen only in Sigma, so unverified. JPCERT sheets mentioning the same
    event ids/tools: PowerSploit_Invoke-Mimikatz (informational). || Original notes: 4104 and its Operational
    channel confirmed by Microsoft PowerShell docs (PowerShell 7 page; the 5.1 channel name confirmed
    by Chainsaw) and Chainsaw. The ScriptBlockText field name is seen only in Sigma, so unverified. Cradle
    keyword list is my own summary.'
- id: FH-EXE-008
  title: AMSI bypass strings in script blocks (4104)
  tactic: execution
  attack:
  - T1685
  - T1562.001
  - T1059.001
  channel: Microsoft-Windows-PowerShell/Operational
  event_ids:
  - 4104
  prerequisites:
  - Script Block Logging enabled
  logic:
    selection:
      ScriptBlockText|contains:
      - AmsiUtils
      - amsiInitFailed
      - AmsiScanBuffer
      - amsiContext
      - System.Management.Automation.AmsiUtils
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~amsiInitFailed --format llm
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~AmsiUtils --format llm
  pivots:
  - Script that follows the bypass (usually the actual payload) in later 4104 events with the same Computer
    and nearby time
  - Defender operational log (5001/1116) around the same time
  - 'Obfuscated variants split the strings: search for char-concatenation patterns and ''#<NULL>'' style
    padding'
  false_positives:
  - Security researchers / red-team tooling and detection-engineering test scripts
  - Security products that legitimately reference AMSI APIs
  severity: high
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_amsi_null_bits_bypass.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0007-Discovery/T1016-System Network Configuration Discovery/ID800-4103-4104-Firewall
    configuration enumerated (PowerShell).evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-PowerShell/Operational/4104: MITRE CTI
    data-component log source, rule project, real sample log.  Open: literal value not found in any opened
    source (AmsiScanBuffer; amsiContext). ATT&CK: legacy id(s) T1562.001 were revoked in the current mitre/cti
    enterprise-attack data; the replacement id is listed first and the legacy id is kept after it. ||
    Original notes: Tactic really belongs to defense evasion; kept here because it identifies the PowerShell
    execution that follows. String list is a conservative core; real-world bypasses are heavily obfuscated,
    so absence proves little. Only Sigma read for field/pattern.'
- id: FH-EXE-009
  title: PowerShell module logging (4103) showing suspicious cmdlet invocations
  tactic: execution
  attack:
  - T1059.001
  channel: Microsoft-Windows-PowerShell/Operational
  event_ids:
  - 4103
  prerequisites:
  - 'Module Logging enabled with module names ''*'' (GPO: Turn on Module Logging)'
  logic:
    selection:
      EventID: 4103
      ContextInfo|contains:
      - Invoke-Expression
      - FromBase64String
      - DownloadString
      - Invoke-Mimikatz
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4103 --field
    ContextInfo~FromBase64String --format llm
  pivots:
  - Payload field of the same event holds parameter bindings and output - may expose decoded commands
  - Compare with 4104 of the same session (same HostApplication in ContextInfo)
  false_positives:
  - Common admin cmdlets; 4103 is very high volume when module logging is '*'
  severity: low
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_module/posh_pm_susp_download.yml
  - https://github.com/MicrosoftDocs/PowerShell-Docs/blob/main/reference/7.5/Microsoft.PowerShell.Core/About/about_Logging_Windows.md
  - 'sample: EVTX-to-MITRE-Attack/TA0007-Discovery/T1016-System Network Configuration Discovery/ID800-4103-4104-Firewall
    configuration enumerated (PowerShell).evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_module/posh_pm_susp_invocation_specific.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-PowerShell/Operational/4103: MITRE CTI
    data-component log source, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states: Field
    names (ContextInfo, Payload, UserData) not confirmed by a second source. || Original notes: Sigma
    module rules key on ContextInfo; the Microsoft doc I read documents module logging in general but
    not per-field names. Field names (ContextInfo, Payload, UserData) not confirmed by a second source.'
- id: FH-EXE-010
  title: Mshta executing remote content, inline script or non-HTA file types
  tactic: execution
  attack:
  - T1218.005
  - T1059.005
  - T1059.007
  channel: Microsoft-Windows-Sysmon/Operational
  event_ids:
  - 1
  prerequisites:
  - Sysmon installed with a config that logs event 1
  logic:
    selection_img:
      Image|endswith: \mshta.exe
    selection_cli:
      CommandLine|contains:
      - http://
      - https://
      - 'vbscript:'
      - 'javascript:'
      - .png
      - .jpg
      - .txt
      - .zip
      - .pdf
    condition: selection_img and selection_cli
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~mshta.exe
    --format llm
  pivots:
  - Children of mshta (cmd, powershell, rundll32) via ParentProcessGuid
  - Sysmon 3 network from mshta.exe
  - ParentImage (Office, browser, script host)
  false_positives:
  - Rare legacy HTA-based internal tools
  severity: high
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_mshta_susp_execution.yml
  - https://github.com/mitre-attack/attack-stix-data/blob/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-ATTACK-SAMPLES/AutomatedTestingTools/PanacheSysmon_vs_AtomicRedTeam01.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  verified: false
