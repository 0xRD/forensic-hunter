- id: FH-DEF-016
  title: 'Process image tampering: hollowing / herpaderping (Sysmon 25)'
  tactic: defense-evasion
  attack:
  - T1055.012
  - T1027
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 25
  prerequisites:
  - Sysmon 13.0+ installed with a config that logs event 25 (ProcessTampering); not on by default in many
    configs
  logic:
    selection:
      EventID: 25
      Type: Image is replaced
    filter_program_files:
      Image|contains:
      - :\Program Files (x86)
      - :\Program Files\
    condition: selection and not filter_program_files
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 25 --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 25 --field Type="Image
    is replaced" --format llm
  pivots:
  - Image (the victim process) + ProcessGuid -> Sysmon 1 for the creator, Sysmon 8/10 for injection into
    it
  - Network connections from that process (Sysmon 3) and child processes
  - '"Image is locked for access" is the lower-confidence herpaderping indicator'
  false_positives:
  - Some browsers (Opera, Edge) and developer tools legitimately tamper; SigmaHQ filters Program Files
    and a few named paths
  - Sysmon guide notes 10-50 events per day on typical systems from known software
  severity: high
  sources:
  - https://raw.githubusercontent.com/trustedsec/SysmonCommunityGuide/master/chapters/process-tampering.md
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_tampering/proc_tampering_susp_process_hollowing.yml
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/sysmon/Sysmon_25_Med_ProcessTampering.yml
