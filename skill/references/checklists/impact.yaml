      - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/windefend/win_defender_history_delete.yml
    verified: false
    notes: "Single source opened."

  - id: FH-IMP-009
    title: Event log cleared as precursor (Security 1102, System 104)
    tactic: impact
    attack: [T1070.001]
    channel: Security
    provider: Microsoft-Windows-Eventlog
    event_ids: [1102, 104]
    prerequisites:
      - "None for 1102 (always logged). 104 is written to the System log when a non-Security log is cleared"
    logic:
      selection_security:
        EventID: 1102
        Channel: Security
      selection_system:
        EventID: 104
        Channel: System
      condition: selection_security or selection_system
    forhunt:
      - forhunt search <paths> --channel Security --event-id 1102 --format llm
      - forhunt search <paths> --channel System --event-id 104 --format llm
    pivots:
      - "UserData fields (SubjectUserName, SubjectLogonId for 1102) -> 4624 with the same TargetLogonId"
      - "Sysmon 1 for wevtutil cl or Clear-EventLog around the same time"
      - "Gap analysis: use forhunt stats to see how far back the surviving log goes"
    false_positives:
      - "Admin maintenance or lab/imaging resets"
    severity: high
    sources:
      - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_audit_log_cleared.yml
    verified: false
    notes: "Sigma confirms 1102 from provider Microsoft-Windows-Eventlog (plus legacy 517). 104 not confirmed from a source opened here; included from analyst knowledge. Field names of the UserData block should be checked against real samples."

  - id: FH-IMP-010
    title: Backup, AV or database service stopped (System 7036 / command line)
    tactic: impact
    attack: [T1489]
    channel: System
    provider: Service Control Manager
    event_ids: [7036]
    prerequisites:
      - "None (Service Control Manager logs state changes by default)"
    logic:
      selection:
        EventID: 7036
        Provider: Service Control Manager
        param2: 'stopped'
        param1|re: '(?i)(veeam|backup|sql|mssql|vss|sophos|defend|msexchange|acronis|bedrock|memtas|mepocs|svc\$)'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel System --event-id 7036 --field param2=stopped --format llm
    pivots:
      - "Burst: many distinct services stopping within a minute is typical pre-encryption behaviour (count(distinct param1) > 8 within 2m)"
      - "Sysmon 1 for net stop, sc stop/config, taskkill, Stop-Service to identify the initiator (7036 has no user)"
    false_positives:
      - "Patch windows, reboots (shutdown stops everything), backup jobs that stop SQL writers"
    severity: medium
    sources:
      - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1489/T1489.md
    verified: false
    notes: "7036 parameter layout (param1 service name, param2 state) from analyst knowledge, not confirmed from Microsoft docs in this session. Service name list is illustrative, tune to the estate. Exclude the reboot window using 1074/6006."

  - id: FH-IMP-011
    title: Service start type changed to disabled (System 7040) or sc config disabled
    tactic: impact
    attack: [T1489, T1562.001]
    channel: System
    provider: Service Control Manager
    event_ids: [7040]
    prerequisites:
      - "None for 7040"
      - "For the command-line variant: Sysmon event 1 or 4688 with command line"
    logic:
      selection:
        EventID: 7040
        param3|contains: 'disabled'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel System --event-id 7040 --format llm
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field CommandLine~"start= disabled" --format llm
    pivots:
      - "Service name (param1) against backup/AV/SQL/EDR product lists"
      - "Sysmon 13 on HKLM\\SYSTEM\\CurrentControlSet\\Services\\<name>\\Start for the initiating image"
    false_positives:
      - "Hardening scripts, software uninstalls"
    severity: medium
    sources:
      - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1489/T1489.md
    verified: false
    notes: "7040 field names (param1 name, param2 old type, param3 new type) from analyst knowledge, unconfirmed here."

  - id: FH-IMP-012
    title: Service or process kill of security/backup tooling via taskkill, net stop or Stop-Service
    tactic: impact
    attack: [T1489, T1562.001]
    channel: Microsoft-Windows-Sysmon/Operational
    provider: Microsoft-Windows-Sysmon
    event_ids: [1]
    prerequisites:
      - "Sysmon installed with a config that logs event 1; or Security 4688 with command line auditing"
    logic:
      selection_img:
        Image|endswith:
          - '\net.exe'
          - '\net1.exe'
          - '\sc.exe'
          - '\taskkill.exe'
          - '\powershell.exe'
      selection_cli:
        CommandLine|contains:
          - ' stop '
          - 'taskkill'
          - 'Stop-Service'
          - 'Stop-Process'
      selection_target:
        CommandLine|re: '(?i)(veeam|backup|sql|vss|sophos|defender|windefend|msexchange|acronis|mcafee|symantec|crowdstrike|sense)'
      condition: selection_img and selection_cli and selection_target
    forhunt:
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field CommandLine~"net stop" --format llm
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field CommandLine~taskkill --format llm
    pivots:
      - "Count of distinct stop commands by the same ParentProcessGuid (batch file hallmark)"
      - "Correlate with System 7036 stopped bursts (IMP-010)"
    false_positives:
      - "Maintenance scripts, uninstallers"
    severity: high
    sources:
      - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1489/T1489.md
      - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
    verified: false
    notes: "Atomic shows taskkill /f /im form. The target product regex is analyst-chosen and unsourced; the 'net stop' pattern in ransomware batch files is well known but no opened source quantifies it."

  - id: FH-IMP-013
    title: Mass file creation or rename burst with ransom-note style names (Sysmon 11)
    tactic: impact
    attack: [T1486]
    channel: Microsoft-Windows-Sysmon/Operational
    provider: Microsoft-Windows-Sysmon
    event_ids: [11]
    prerequisites:
      - "Sysmon installed with a config that logs event 11 (FileCreate). Many configs exclude Office/doc paths; verify coverage"
    logic:
      selection:
        EventID: 11
      note_burst:
        TargetFilename|re: '(?i)(readme|decrypt|restore|recover|how_to|ransom|_help_|instructions).*\.(txt|html|hta)$'
      condition: count(selection) by Image > 500 within 1m or count(distinct TargetFilename directory) by TargetFilename basename > 20 within 5m
    forhunt:
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 11 --regex TargetFilename='(?i)(readme|decrypt|restore|how_to).*\.(txt|html|hta)$' --format llm
      - forhunt stats <paths> --format llm
    pivots:
      - "Image writing the files: hash it (Sysmon 1 Hashes), find its first execution and parent"
      - "Same basename written into many directories = ransom note drop; new extension on many files = encryption pass"
      - "Sysmon 23/26 deletes of originals (IMP-014)"
    false_positives:
      - "Software installers, backup/sync clients, build systems writing many files; legitimate README files"
    severity: critical
    sources:
      - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
      - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1486/T1486.md
    verified: false
    notes: "Thresholds and the filename regex are heuristics, not from a vetted source. Atomic Red Team examples use names like YOUR_FILES.txt and akira_readme.txt. Sysmon does not log file renames as a distinct event: a rename shows as a new FileCreate (11) or as 23/26 for the old name. EVTX alone cannot prove encryption."

  - id: FH-IMP-014
    title: Mass file deletion burst (Sysmon 23 / 26)
    tactic: impact
    attack: [T1485, T1486]
    channel: Microsoft-Windows-Sysmon/Operational
    provider: Microsoft-Windows-Sysmon
    event_ids: [23, 26]
    prerequisites:
      - "Sysmon 13+ with FileDelete (23) or FileDeleteDetected (26) rules. Event 23 archives deleted files to ArchiveDirectory and can fill the disk"
    logic:
      selection:
        EventID:
          - 23
          - 26
      condition: count(selection) by Image > 500 within 1m
    forhunt:
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 23,26 --format llm
    pivots:
      - "Event 23 means a copy of the deleted file may exist in the Sysmon archive directory: recover it"
      - "Combine with IMP-013 file creation bursts by the same Image"
    false_positives:
      - "Temp-file cleanup, browser cache clearing, build/CI hosts, disk cleanup"
    severity: medium
    sources:
      - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
    verified: false
    notes: "Event meanings confirmed by the Sysmon docs; the burst threshold is a heuristic with no source."

  - id: FH-IMP-015
    title: Secure deletion / free-space wipe (sdelete, cipher /w, Sysmon 28)
    tactic: impact
    attack: [T1485]
    channel: Microsoft-Windows-Sysmon/Operational
    provider: Microsoft-Windows-Sysmon
    event_ids: [1, 28]
    prerequisites:
      - "Sysmon with event 1; event 28 (FileBlockShredding) needs Sysmon 14+ and a FileBlockShredding rule, and it blocks as well as logs"
    logic:
      selection_cipher:
        Image|endswith: '\cipher.exe'
        CommandLine|contains: '/w'
      selection_sdelete:
        Image|endswith:
          - '\sdelete.exe'
          - '\sdelete64.exe'
      selection_blocked:
        EventID: 28
      condition: selection_cipher or selection_sdelete or selection_blocked
    forhunt:
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~cipher --field CommandLine~/w --format llm
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1,28 --field Image~sdelete --format llm
    pivots:
      - "What was wiped first (file paths in earlier 11/23 events)? Wipe tools often run after exfiltration (COLL checks)"
    false_positives:
      - "Admins sanitising disks before decommissioning"
    severity: high
    sources:
      - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1485/T1485.md
      - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
    verified: false
    notes: "cipher /w is in Atomic Red Team; Sysmon 28 purpose per Microsoft docs. sdelete execution has no source opened; renamed binaries evade the Image test, so also check OriginalFileName/Description."

  - id: FH-IMP-016
    title: Mass password changes or resets (4723 / 4724 burst) and many account lockouts (4740)
    tactic: impact
    attack: [T1531]
    channel: Security
    provider: Microsoft-Windows-Security-Auditing
    event_ids: [4723, 4724, 4740]
    prerequisites:
      - "Audit User Account Management (Success) for 4723/4724; Audit Account Lockout / User Account Management for 4740 (logged on the DC and on the machine that locked a local account)"
    logic:
      selection_pw:
        EventID:
          - 4723
          - 4724
      selection_lock:
        EventID: 4740
      condition: count(distinct TargetUserName) by SubjectUserName > 15 within 10m for selection_pw, or count(distinct TargetUserName) > 20 within 10m for selection_lock
    forhunt:
      - forhunt search <paths> --channel Security --event-id 4723,4724 --format llm
      - forhunt search <paths> --channel Security --event-id 4740 --format llm
    pivots:
      - "SubjectUserName / SubjectLogonId -> 4624 to see where the resetting admin session came from"
      - "4740 CallerComputerName shows the source of bad passwords (spray vs. service with a stale password)"
      - "Also check 4725 (disable) and 4726 (delete) bursts and 4738"
    false_positives:
      - "Helpdesk bulk resets, forced rotations, password-policy rollouts, service accounts with stale credentials"
    severity: medium
    sources:
      - https://raw.githubusercontent.com/mdecrevoisier/EVTX-to-MITRE-Attack/master/README.md
    verified: false
    notes: "Event ids appear in the catalog only for Mimikatz-style password change detection. The burst thresholds are heuristics. Impact-style account lockout/denial of access is ATT&CK T1531 (Account Access Removal)."

  - id: FH-IMP-017
    title: Safe-mode boot forced or system rebooted by script (bcdedit safeboot, shutdown)
    tactic: impact
    attack: [T1529, T1490]
    channel: Microsoft-Windows-Sysmon/Operational
    provider: Microsoft-Windows-Sysmon
    event_ids: [1]
    prerequisites:
      - "Sysmon with event 1; or Security 4688 with command line auditing"
    logic:
      selection_safeboot:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains: 'safeboot'
      selection_shutdown:
        Image|endswith: '\shutdown.exe'
        CommandLine|contains:
          - '/r'
          - '/s'
          - '/f'
      condition: selection_safeboot or selection_shutdown
    forhunt:
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~shutdown --format llm
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field CommandLine~safeboot --format llm
    pivots:
      - "System 1074 on the same host gives the initiating process and user (see IMP-018)"
    false_positives:
      - "Patching reboots; admin shutdowns"
    severity: medium
    sources:
      - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1529/T1529.md
    verified: false
    notes: "Atomic confirms shutdown /s and /r forms. bcdedit safeboot as a ransomware tactic is from analyst knowledge; no source opened here."

  - id: FH-IMP-018
    title: System shutdown or restart initiated (1074), unexpected shutdown (6008), log stop/start (6006/6005)
    tactic: impact
    attack: [T1529]
    channel: System
    provider: User32
    event_ids: [1074, 6006, 6008, 6005]
    prerequisites:
      - "None (default System log events)"
    logic:
      selection_1074:
        EventID: 1074
      selection_6008:
        EventID: 6008
      selection_6006:
        EventID: 6006
      condition: selection_1074 or selection_6008 or selection_6006
    forhunt:
      - forhunt search <paths> --channel System --event-id 1074,6005,6006,6008 --format llm
    pivots:
      - "1074 names the initiating process, user and reason: a non-standard process (not svchost/TrustedInstaller/explorer) is notable"
      - "6008 (unclean shutdown) near encryption or wiper activity may indicate forced power-off/crash"
      - "Timeline: forhunt timeline around the reboot to see what ran just before"
    false_positives:
      - "Patching, maintenance windows, power failures"
    severity: low
    sources:
      - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1529/T1529.md
    verified: false
    notes: "Event ids and field meanings are from analyst knowledge; Microsoft pages were unreachable. 1074 provider is User32; 6005/6006/6008 come from the EventLog provider."

  - id: FH-IMP-019
    title: Defacement or ransom wallpaper (web root writes, wallpaper registry change)
    tactic: impact
    attack: [T1491]
    channel: Microsoft-Windows-Sysmon/Operational
    provider: Microsoft-Windows-Sysmon
    event_ids: [11, 13]
    prerequisites:
      - "Sysmon with event 11 and event 13 rules covering web roots and HKCU\\Control Panel\\Desktop"
    logic:
      selection_web:
        EventID: 11
        TargetFilename|contains:
          - '\inetpub\wwwroot\'
        TargetFilename|endswith:
          - '.html'
          - '.aspx'
          - '.php'
          - '.jpg'
      filter_expected_writers:
        Image|endswith:
          - '\w3wp.exe'
          - '\msdeploy.exe'
      selection_wallpaper:
        EventID: 13
        TargetObject|endswith: '\Control Panel\Desktop\Wallpaper'
      condition: (selection_web and not filter_expected_writers) or selection_wallpaper
    forhunt:
      - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 13 --field TargetObject~Desktop\Wallpaper --format llm
    pivots:
      - "Image/User behind the write; IIS logs (not EVTX) for the upload path"
    false_positives:
      - "Normal web deployments; users changing wallpaper; corporate wallpaper policies"
    severity: low
    sources:
      - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
    verified: false
    notes: "Low-confidence, analyst-designed check. Defacement evidence is mostly in web server logs, which are outside EVTX."
