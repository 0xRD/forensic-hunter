    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_susp_startup_folder_persistence.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_startup_folder_file_write.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_tsclient_filewrite_startup.yml
    verified: false
    notes: "Both the per-user (AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup) and the all-users (ProgramData\\...\\StartUp) folders match. desktop.ini is excluded by the extension list. Script and binary extensions are strong; .lnk alone is weak."

  - id: FH-FS-019
    title: New scheduled task definition files in the Tasks folder
    tactic: filesystem
    attack: [T1053.005]
    channel: UsnJrnl
    event_ids: [1]
    prerequisites:
      - "$UsnJrnl:$J and/or $MFT collected"
    logic:
      selection:
        EventID: 1
        Path|re: '^\.\\windows\\system32\\tasks\\[^\\]+$'
      legacy_job:
        Path|re: '^\.\\windows\\tasks\\.*\.job$'
      condition: selection or legacy_job
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'Path=^\.\\windows\\system32\\tasks\\[^\\]+$' --format llm
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'Path=^\.\\windows\\system32\\tasks\\[^\\]+$' --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'Path=^\.\\windows\\tasks\\.*\.job$' --format llm
    pivots:
      - "Security 4698 / TaskScheduler 106 for the task name, author and action; the XML in the live image or a resident $MFT copy holds the command"
      - "Task names that mimic Microsoft ones or use random strings; creation by SYSTEM at the time of a remote logon (schtasks /s, atexec-style execution)"
      - "Deleted task files (event 2) shortly after: one-shot execution tasks are created and removed within seconds"
    false_positives:
      - "Third-party updaters (Google, Adobe, OneDrive, vendor agents) register tasks in the folder root; Microsoft's own tasks live in subfolders and are excluded by the pattern"
    severity: medium
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_susp_task_write.yml
      - https://github.com/mitre/cti
    verified: false
    notes: "Task files have no extension and are named after the task. Tasks created inside a subfolder (name with a backslash) are not matched: widen to '^\\.\\\\windows\\\\system32\\\\tasks\\\\' and filter out \\Microsoft\\ by eye. The folder name was read in the cited rule (2026-10-22); the legacy .job location is from the author's knowledge."

  - id: FH-FS-020
    title: WMI repository writes and MOF files (WMI persistence)
    tactic: filesystem
    attack: [T1546.003, T1047]
    channel: UsnJrnl
    event_ids: [4, 1]
    prerequisites:
      - "$UsnJrnl:$J collected"
    logic:
      repository:
        Path|re: '^\.\\windows\\system32\\wbem\\repository\\'
        FileName|re: '^(objects\.data|index\.btr|mapping[123]\.map)$'
      mof:
        EventID: 1
        FileName|re: '\.mof$'
      condition: repository or mof
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --regex 'Path=^\.\\windows\\system32\\wbem\\repository\\' --regex 'FileName=^(objects\.data|index\.btr|mapping[123]\.map)$' --limit 50 --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'FileName=\.mof$' --format llm
    pivots:
      - "WMI-Activity 5861 and Sysmon 19/20/21 for the subscription itself; the repository only says that something changed"
      - "A repository write minutes after a remote logon or a script execution; compare with ordinary background writes in the days before"
      - "A .mof created in a user or Temp folder and a mofcomp.exe execution"
    false_positives:
      - "The WMI repository is written routinely by system components and inventory software: a single write means nothing"
    severity: low
    sources:
