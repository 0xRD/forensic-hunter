    ScriptBlockText~AmsiUtils --format llm
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~amsiInitFailed --format llm
  pivots:
  - Same ScriptBlockId / process (Execution ProcessID) -> what ran after AMSI was disabled in that process
  - Defender 1116 absent while the following payload is known-bad
  - Parent process of powershell.exe (Sysmon 1 / 4688); the bypass often precedes download-and-execute
  false_positives:
  - Security research scripts, red-team tooling, AMSI test samples; the strings also appear in blog snippets
