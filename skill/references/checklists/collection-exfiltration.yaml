- id: FH-COLL-015
  title: File copy to removable media (Security 4663 with Removable Storage auditing)
  tactic: collection-exfiltration
  attack:
  - T1052.001
  - T1005
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4663
  prerequisites:
  - Audit Removable Storage (Success and Failure) in Object Access
  logic:
    selection:
      EventID: 4663
      ObjectType: File
      AccessMask|contains:
      - '0x2'
      - '0x6'
    condition: selection and count(selection) by SubjectUserName > 100 within 10m
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4663 --format llm
  pivots:
  - ObjectName path (drive letter of the removable disk); ProcessName (explorer, robocopy, xcopy, 7z)
  - Connect to 6416 (COLL-013) for the device
  false_positives:
  - Legitimate transfers to approved removable media
  severity: medium
  sources:
  - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-ATTACK-SAMPLES/Defense Evasion/DE_1102_security_log_cleared.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_iso_mount.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/4663: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states: Written
    from analyst knowledge: the Removable Storage audit subcategory generates 4663 for removable drives.
    JPCERT sheets mentioning the same event ids/tools: net-user (informational). || Original notes: Written
    from analyst knowledge: the Removable Storage audit subcategory generates 4663 for removable drives.
    No opened source documents it, and the AccessMask test is illustrative. Verify on a test system.'
- id: FH-COLL-016
  title: Printing as exfil (PrintService/Operational 307)
  tactic: collection-exfiltration
  attack:
  - T1052
  channel: Microsoft-Windows-PrintService/Operational
  provider: Microsoft-Windows-PrintService
  event_ids:
  - 307
  prerequisites:
  - PrintService/Operational log is disabled by default and must be enabled before the print job
  logic:
    selection:
      EventID: 307
    condition: selection and (count(selection) by param3 > 50 within 1h or param2|contains 'password')
  forhunt:
  - forhunt search <paths> --channel "Microsoft-Windows-PrintService/Operational" --event-id 307 --format
    llm
  pivots:
  - Document name, user and printer (print to PDF/virtual or remote printer ports are interesting); pages/size
    fields
  false_positives:
  - Normal office printing; print-to-PDF
  severity: informational
  sources:
  - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-PrintService/Operational/307: no source.  Open:
    event id / channel pair has fewer than two independent confirmations (s-PrintService/307()). || Original
    notes: No opened source covers 307. The positional param1..param8 layout is from analyst knowledge
    and should be checked against a real sample. UserData uses DocumentPrinted with fields like Param2
    (document), Param3 (user), Param5 (printer).'
- id: FH-COLL-017
  title: Bulk copy of files by robocopy / xcopy to staging or network location
  tactic: collection-exfiltration
  attack:
  - T1005
  - T1039
  - T1074
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
