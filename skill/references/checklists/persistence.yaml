- id: FH-PER-023
  title: WMI event consumer created through wbemcons.dll load or wmic/PowerShell command
  tactic: persistence
  attack:
  - T1546.003
  channel: Microsoft-Windows-Sysmon/Operational
  event_ids:
  - 7
  - 1
  prerequisites:
  - Sysmon installed with a config that logs event 7 (ImageLoad, off by default) and 1
  logic:
    selection_load:
      EventID: 7
      Image: C:\Windows\System32\wbem\WmiPrvSE.exe
      ImageLoaded|endswith: \wbemcons.dll
    selection_wmic:
      EventID: 1
      Image|endswith: \wmic.exe
      CommandLine|contains|all:
      - ActiveScriptEventConsumer
      - ' CREATE '
    condition: selection_load or selection_wmic
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 7 --field ImageLoaded~wbemcons.dll
    --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~wmic.exe
    --field CommandLine~EventConsumer --format llm
  pivots:
  - wbemcons.dll in WmiPrvSE means a CommandLineEventConsumer fired - execution, not just registration
  - Correlate with FH-PER-016/017 and the spawned child process
  false_positives:
  - Legitimate CommandLineEventConsumer use is rare
  severity: high
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/image_load/image_load_wmi_persistence_commandline_event_consumer.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_wmic_eventconsumer_creation.yml
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-ATTACK-SAMPLES/Privilege Escalation/Sysmon_UACME_64.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-ATTACK-SAMPLES/AutomatedTestingTools/PanacheSysmon_vs_AtomicRedTeam01.evtx'
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/7: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; MW-Sysmon/Operational/1: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states. JPCERT
    sheets mentioning the same event ids/tools: wmic (informational). || Original notes: Event 7 is off
    by default per Microsoft Sysmon page. Single Sigma source for the wbemcons.dll pattern.'
