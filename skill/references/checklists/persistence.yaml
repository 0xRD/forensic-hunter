tactic: persistence
title: Persistence
description: 'Persistence in Windows event logs appears as new or modified autostart mechanisms: services
  (System 7045, Security 4697), scheduled tasks (Security 4698-4702, TaskScheduler/Operational), registry
  autoruns and hijacks (Sysmon 12/13: Run keys, Winlogon, IFEO, AppInit, COM, netsh helpers), Startup-folder
  file drops (Sysmon 11), WMI permanent event subscriptions (WMI-Activity 5859-5861, Sysmon 19-21), BITS
  jobs, and new or modified accounts (4720, 4722, 4738). Many of these channels are off by default or
  need Sysmon; always state which source was missing when a check returns nothing.'
checks:
- id: FH-PER-001
  title: New service installed with a suspicious ImagePath (System 7045)
  tactic: persistence
  attack:
  - T1543.003
  - T1569.002
  channel: System
  event_ids:
  - 7045
  prerequisites:
  - Service Control Manager writes 7045 by default to the System log; no audit policy needed
  logic:
    selection:
      Provider: Service Control Manager
      EventID: 7045
      ImagePath|contains:
      - \AppData\
      - \Temp\
      - \Perflogs\
      - \ADMIN$\
      - powershell
      - cmd.exe /c
      - '%COMSPEC%'
      - ' -enc '
      - ' -nop '
    condition: selection
  forhunt:
  - forhunt search <paths> --channel System --event-id 7045 --field ImagePath~powershell --format llm
  - forhunt search <paths> --channel System --event-id 7045 --field ImagePath~Temp --format llm
  - forhunt search <paths> --channel System --event-id 7045 --format llm --limit 200
  pivots:
  - 'ServiceName / AccountName / StartType: auto-start LocalSystem service with random name is typical
    for PsExec-like or Cobalt Strike tooling'
  - 4624 LogonType 3 (+ source IpAddress) shortly before, and 5140/5145 ADMIN$ share access for remote
    service creation
  - Sysmon 11 / 1 for the binary named in ImagePath; Sysmon 13 under HKLM\System\CurrentControlSet\Services\<name>
  - 7036 (service entered running state) after the install for execution time
  - 'System 7045 is also execution evidence (T1569.002): compare with 4697 on the same host'
  false_positives:
  - Software installers, AV/EDR agents, driver installs
  - Remote management agents (PDQ, SCCM, RMM tools) install services legitimately - baseline per environment
  severity: high
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/service_control_manager/win_system_service_install_susp.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/service_control_manager/win_system_susp_service_installation_folder.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/System/Sys_7045_Info_SvcInstalled.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0002-Execution/T1569.002-Service execution/ID7000,7009,7045-Payload
    deployed via service - Tchopper.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/service_control_manager/win_system_meterpreter_or_cobaltstrike_getsystem_service_installation.yml
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: System/7045: MITRE CTI data-component log source,
    rule project, real sample log.  Note: corrections: logic field Provider_Name -> Provider (System field
    name used by forhunt/EVTX). || Original notes: Event ID, System channel and ImagePath/ServiceName/AccountName/StartType
    semantics agree between Sigma and Hayabusa (independent rule sets, Hayabusa one is native). Microsoft
    Learn page for 7045 was not reachable; that gap is why this is only ''verified'' by two community
    sources.'
- id: FH-PER-002
  title: Service installed - Security 4697 (service file name check)
  tactic: persistence
  attack:
  - T1543.003
  channel: Security
  event_ids:
  - 4697
  prerequisites:
  - Audit Security System Extension (Success) enabled (Advanced Audit Policy > System > Audit Security
    System Extension)
  logic:
    selection:
      EventID: 4697
      ServiceFileName|contains:
      - powershell
      - cmd.exe
      - \Temp\
      - \AppData\
      - \ADMIN$\
      - \\127.0.0.1
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4697 --format llm --limit 200
  - forhunt search <paths> --channel Security --event-id 4697 --field ServiceFileName~powershell --format
    llm
  pivots:
  - SubjectUserName/SubjectLogonId -> 4624 to see how the actor logged on (type 3 = remote service creation)
  - Same time 7045 in System (ImagePath equals ServiceFileName)
  - ServiceType 0x10/0x20 and ServiceStartType (2 = auto start)
  false_positives:
  - Legitimate software installation by administrators
  severity: high
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_powershell_script_installed_as_service.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/Security/System/SecuritySystemExtension/Sec_4697_Info_SvcInstalled.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0008-Lateral Movement/T1021.002-SMB Windows Admin Shares/ID4688,4697,5140-5145
    PSexec remote execution + admin share.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_meterpreter_or_cobaltstrike_getsystem_service_install.yml
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/4697: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log. || Original notes: Field names ServiceName,
    ServiceFileName, ServiceType, ServiceStartType seen in the Hayabusa sample message and Sigma rule;
    the Microsoft Learn 4697 page was not reachable. Logging requires the System Extension subcategory,
    which is off by default.'
