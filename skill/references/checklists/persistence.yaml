- id: FH-PER-017
  title: WMI filter, consumer and binding created (Sysmon 19/20/21)
  tactic: persistence
  attack:
  - T1546.003
  channel: Microsoft-Windows-Sysmon/Operational
  event_ids:
  - 19
  - 20
  - 21
  prerequisites:
  - Sysmon installed with a config that logs event 19, 20 and 21 (WmiEvent rules; e.g. <WmiEvent onmatch="exclude"/>
    logs all)
  logic:
    selection:
      EventID:
      - 19
      - 20
      - 21
    selection_susp_dest:
      Destination|contains:
      - powershell
      - cmd.exe
      - -enc
      - DownloadString
      - WScript.Shell
      - iex(
    condition: selection and (selection_susp_dest or EventID in (21))
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 19,20,21 --format
    llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 20 --field Destination~powershell
    --format llm
  pivots:
  - 'Operation field (Created / Deleted): a Deleted event soon after is cleanup'
  - Filter Query (event 19) tells what triggers it - e.g. logon, uptime, process start
  - Consumer Name/Type/Destination (event 20) is the payload; event 21 ties filter to consumer
  - 'Process/User fields: who registered it (Image, e.g. powershell.exe or wmic.exe or mofcomp.exe)'
  false_positives:
  - Vendor management agents that register their own subscriptions
  severity: high
  sources:
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/sysmon/Sysmon_19_Info_WmiEventFilterActivity.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/wmi_event/sysmon_wmi_event_subscription.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/wmi_event/sysmon_wmi_susp_scripting.yml
  - 'sample: EVTX-ATTACK-SAMPLES/AutomatedTestingTools/PanacheSysmon_vs_AtomicRedTeam01.evtx'
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/19: Microsoft docs, rule
    project, real sample log; MW-Sysmon/Operational/20: Microsoft docs, rule project, real sample log;
    MW-Sysmon/Operational/21: Microsoft docs, rule project, real sample log. || Original notes: Microsoft
    Sysmon page defines events 19/20/21 (filter name+expression, consumer name+log+destination, binding
    consumer+filter path); Hayabusa and Sigma confirm the channel and Destination field. ''Operation''
    value semantics from Sysmon schema knowledge, not an opened source. Condition syntax ''EventID in
    (21)'' is my shorthand for ''always alert on bindings''.'
- id: FH-PER-018
  title: BITS job created or started (Bits-Client/Operational 3, 59, 60) and notify-command persistence
  tactic: persistence
  attack:
  - T1197
  channel: Microsoft-Windows-Bits-Client/Operational
  event_ids:
  - 3
  - 59
  - 60
  prerequisites:
  - Microsoft-Windows-Bits-Client/Operational is typically enabled by default; Hayabusa and Sigma use
    it directly
  logic:
    selection_job:
      EventID: 3
      processPath|endswith:
      - \bitsadmin.exe
      - \powershell.exe
    selection_transfer:
      EventID: 59
      url|contains:
      - http://
      - https://
    condition: selection_job or selection_transfer
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Bits-Client/Operational --event-id 3,59,60 --format
    llm --limit 200
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~bitsadmin.exe
    --field CommandLine~SetNotifyCmdLine --format llm
  pivots:
