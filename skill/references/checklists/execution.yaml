  attack:
  - T1047
  channel: Microsoft-Windows-Sysmon/Operational
  event_ids:
  - 1
  prerequisites:
  - Sysmon installed with a config that logs event 1
  logic:
    selection_parent:
      ParentImage|endswith: \WmiPrvSE.exe
    selection_child:
      Image|endswith:
      - \cmd.exe
      - \powershell.exe
      - \pwsh.exe
      - \wscript.exe
      - \cscript.exe
      - \mshta.exe
      - \rundll32.exe
      - \regsvr32.exe
    condition: selection_parent and selection_child
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field ParentImage~WmiPrvSE.exe
    --format llm
  pivots:
  - 4624 LogonType 3 on the same host just before (source IpAddress)
  - Microsoft-Windows-WMI-Activity/Operational 5857-5861 on the same host
  - CommandLine often redirects output to ADMIN$ file (e.g. __ timestamp) for Impacket-style tools
