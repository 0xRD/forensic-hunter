id = 16
title = "File timestamps ($SI)"
keep = ["MACB", "Path", "FileSize", "Deleted", "IsDirectory", "SiLtFn", "uSecZeros", "Copied", "AdsNames", "ZoneIdContents", "EntryNumber"]

