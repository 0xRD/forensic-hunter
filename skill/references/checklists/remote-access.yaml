    no source; MW-TerminalServices-RDPClient/Operational/1026: no source; MW-TerminalServices-RDPClient/Operational/1029:
    no source.  Open: event id / channel pair has fewer than two independent confirmations (ices-RDPClient/1024(rule),ices-RDPClient/1102(rule),ices-RDPClient/1025(),ices-RDPClient/1026(),ices-RDPClient/1029()).
