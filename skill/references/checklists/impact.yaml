- id: FH-IMP-010
  title: Backup, AV or database service stopped (System 7036 / command line)
  tactic: impact
  attack:
  - T1489
  channel: System
  provider: Service Control Manager
  event_ids:
  - 7036
  prerequisites:
  - None (Service Control Manager logs state changes by default)
  logic:
    selection:
      EventID: 7036
      Provider: Service Control Manager
      param2: stopped
      param1|re: (?i)(veeam|backup|sql|mssql|vss|sophos|defend|msexchange|acronis|bedrock|memtas|mepocs|svc\$)
    condition: selection
  forhunt:
  - forhunt search <paths> --channel System --event-id 7036 --field param2=stopped --format llm
  - forhunt search <paths> --channel System --event-id 7036 --regex 'Binary=2F0031000000$' --format llm
  pivots:
  - 'Burst: many distinct services stopping within a minute is typical pre-encryption behaviour (count(distinct
    param1) > 8 within 2m)'
  - Sysmon 1 for net stop, sc stop/config, taskkill, Stop-Service to identify the initiator (7036 has
    no user)
  - 'param2 (the state) is translated (French: arrêté): the second query tests the binary data, which ends
    with the service short name and its state code (/1 = stopped, hex 2F0031000000) in every language'
  false_positives:
  - Patch windows, reboots (shutdown stops everything), backup jobs that stop SQL writers
  severity: medium
  sources:
  - https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1489/T1489.md
  - 'sample: EVTX-ATTACK-SAMPLES/Defense Evasion/DE_WinEventLogSvc_Crash_System_7036.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/service_control_manager/win_system_defender_disabled.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: System/7036: MITRE CTI data-component log
    source, rule project, real sample log.  Open: event ids, channel and fields are confirmed (see above)
    but the detection logic goes beyond what any opened rule/source states: 7036 parameter layout (param1
    service name, param2 state) from analyst knowledge, not confirmed from Microsoft docs in this session.
    || Original notes: 7036 parameter layout (param1 service name, param2 state) from analyst knowledge,
    not confirmed from Microsoft docs in this session. Service name list is illustrative, tune to the
    estate. Exclude the reboot window using 1074/6006.'
