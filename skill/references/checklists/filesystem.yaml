  - id: FH-FS-021
    title: Driver files dropped in user-writable folders and spool\drivers\color
    tactic: filesystem
    attack: [T1068, T1036.005]
    channel: UsnJrnl
    event_ids: [1]
    prerequisites:
      - "$UsnJrnl:$J and/or $MFT collected"
    logic:
      drivers:
        EventID: 1
        Path|re: '^\.\\(users|programdata|windows\\temp|perflogs|temp)\\.*\.sys$'
      spool_color:
        Path|re: '^\.\\windows\\system32\\spool\\drivers\\color\\[^\\]+\.(dll|exe|sys)$'
      condition: drivers or spool_color
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'Path=^\.\\(users|programdata|windows\\temp|perflogs|temp)\\.*\.sys$' --format llm
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'Path=^\.\\(users|programdata|windows\\temp|perflogs|temp)\\.*\.sys$' --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'Path=^\.\\windows\\system32\\spool\\drivers\\color\\[^\\]+\.(dll|exe|sys)$' --format llm
    pivots:
      - "System 7045 / 7036 or Sysmon 6 (driver loaded) for the same file name; sc.exe or driver-loader execution (4688 / Sysmon 1)"
      - "Known vulnerable or renamed signed drivers: hash the file from the image and look it up; process-explorer-style names (PROCEXP*.sys) written by a non-Sysinternals binary"
      - "Security-tool tampering (Defender, EDR service stop) right after the driver load"
    false_positives:
      - "Driver installers and diagnostic tools that unpack a .sys to Temp before loading it (Sysinternals, vendor firmware updaters)"
    severity: high
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_susp_spool_drivers_color_drop.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_sysinternals_procexp_driver_susp_creation.yml
    verified: false
    notes: "Bring-your-own-vulnerable-driver activity is the main reason to look: the driver is signed but dropped where drivers never live. The spool\\drivers\\color folder is a known place to hide binaries because it is writable and rarely monitored (cited rule, read 2026-10-22). ATT&CK mapping is approximate (T1068 for kernel exploitation)."

  - id: FH-FS-022
    title: DLL side-loading staging (trailing-space folders, DLLs in AppData and ProgramData)
    tactic: filesystem
    attack: [T1574.001, T1036.005]
    channel: UsnJrnl
    event_ids: [1]
    prerequisites:
      - "$UsnJrnl:$J and/or $MFT collected"
    logic:
      space_folder:
        EventID: 1
        Path|re: '^\.\\(windows|program files|program files \(x86\)) \\'
      user_dll:
        EventID: 1
        Path|re: '^\.\\(users\\[^\\]+\\appdata\\roaming|programdata)\\.*\.dll$'
      condition: space_folder or user_dll
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'Path=^\.\\(windows|program files|program files \(x86\)) \\' --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'Path=^\.\\(users\\[^\\]+\\appdata\\roaming|programdata)\\.*\.dll$' --limit 100 --format llm
    pivots:
      - "Group by parent folder (ParentEntryNumber): a signed executable and one new DLL created together in a user-writable folder is the classic side-loading kit"
      - "Execution of the executable from that folder (4688 / Sysmon 1) and the image-load of the DLL (Sysmon 7); hash both"
      - "Folders named like a Windows directory with a trailing space ('C:\\Windows \\System32') exist to trick auto-elevating binaries (UAC bypass)"
    false_positives:
      - "The first query is almost noise-free. The second matches normal application updaters (Teams, Slack, Zoom, Chrome) writing DLLs under AppData\\Roaming and ProgramData: look for an unfamiliar folder name or an exe + dll pair"
    severity: medium
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_dll_sideloading_space_path.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_susp_legitimate_app_dropping_archive.yml
    verified: false
    notes: "Only the trailing-space folder pattern comes from a rule read in this session (2026-10-22). The AppData/ProgramData DLL query is a hunting heuristic of the author. Whether a file is a legitimate signed binary needs the file itself; the $MFT only gives names and times."

  - id: FH-FS-023
    title: Credential store copies (SAM, SYSTEM, SECURITY hives, ntds.dit, IFM, browser databases)
    tactic: filesystem
    attack: [T1003.002, T1003.003, T1555.003]
    channel: MFT
    event_ids: [48, 1]
    prerequisites:
      - "$MFT and/or $UsnJrnl:$J collected"
    logic:
      hive_copies:
        EventID: 48
        FileName|re: '^(ntds\.dit|(sam|system|security)(\.(save|sav|bak|hive|export|bck|backup|old))?)$'
        Path|re: '^\.\\(users|programdata|windows\\temp|perflogs|temp|inetpub)\\'
      ifm:
        Path|re: '\\(active directory\\ntds\.dit|registry\\(system|security))$'
      ntds_anywhere:
        FileName|re: '^ntds\.dit$'
      browser_store:
        FileName|re: '^(login data|logins\.json|key4\.db|cert9\.db|cookies|web data|local state)$'
        Path|re: '^\.\\(users\\public|programdata|windows\\temp|perflogs|temp)\\'
      condition: hive_copies or ifm or ntds_anywhere or browser_store
    forhunt:
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'FileName=^(ntds\.dit|(sam|system|security)(\.(save|sav|bak|hive|export|bck|backup|old))?)$' --regex 'Path=^\.\\(users|programdata|windows\\temp|perflogs|temp|inetpub)\\' --format llm
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'Path=\\(active directory\\ntds\.dit|registry\\(system|security))$' --format llm
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'FileName=^ntds\.dit$' --format llm
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'FileName=^(login data|logins\.json|key4\.db|cert9\.db|cookies|web data|local state)$' --regex 'Path=^\.\\(users\\public|programdata|windows\\temp|perflogs|temp)\\' --format llm
    pivots:
      - "ntdsutil / vssadmin / diskshadow / reg save in process creation; Security 4662 or 4663 on ntds.dit; volume shadow copy creation (System 7036, VSS 8222)"
      - "Archive creation or transfer after the copy (FH-FS-015); deletion of the copy (UsnJrnl event 2)"
      - "Browser files copied out of the profile: the user, and any download of tools such as credential extractors (FH-FS-013)"
    false_positives:
      - "\\Windows\\NTDS\\ntds.dit on domain controllers is the live database (judge by path); backup and imaging tools; sysprep and recovery copies of hives"
    severity: high
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_sam_dump.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_ntds_dit_creation.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_hktl_hivenightmare_file_exports.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_ntds_exfil_tools.yml
    verified: false
    notes: "Hive-copy name patterns and the ntds.dit creation idea come from the cited rules (read 2026-10-22). The IFM layout (Active Directory\\ntds.dit and registry\\SYSTEM / SECURITY) and the browser database names are the author's knowledge, not confirmed from a source read here. Run the second and third queries even on workstations: ntds.dit should not exist there at all. Event 48 is used because the $FN record keeps the name even after the copy is deleted."

  - id: FH-FS-024
    title: Anti-forensic and recovery-inhibiting tools (Prefetch), SDelete rename names
    tactic: filesystem
    attack: [T1070.004, T1070.006, T1490, T1685.005]
    channel: UsnJrnl
    event_ids: [1, 2, 3, 4]
    prerequisites:
      - "$UsnJrnl:$J and/or $MFT collected"
      - "Prefetch enabled (default on client Windows, off on many servers): without it only the SDelete names are useful"
    logic:
      prefetch_of_tools:
        FileName|re: '^(fsutil|wevtutil|vssadmin|wbadmin|bcdedit|cipher|sdelete|sdelete64|diskshadow|ntdsutil|esentutl)\.exe-[0-9a-f]{8}\.pf$'
      sdelete_names:
        EventID: [2, 3]
        FileName|re: '\.(aaa|zzz)$'
      condition: prefetch_of_tools or sdelete_names
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --regex 'FileName=^(fsutil|wevtutil|vssadmin|wbadmin|bcdedit|cipher|sdelete|sdelete64|diskshadow|ntdsutil|esentutl)\.exe-[0-9a-f]{8}\.pf$' --format llm
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'FileName=^(fsutil|wevtutil|vssadmin|wbadmin|bcdedit|cipher|sdelete|sdelete64|diskshadow|ntdsutil|esentutl)\.exe-[0-9a-f]{8}\.pf$' --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 2,3 --regex 'FileName=\.(aaa|zzz)$' --format llm
    pivots:
      - "Prefetch creation = first run of the tool; later updates of the same .pf (events 4 and 5) are further runs. The command line is in 4688 / Sysmon 1 if those exist"
      - "fsutil: 'usn deletejournal' resets the journal (FH-FS-031); wevtutil: log clearing (Security 1102, System 104); vssadmin / wbadmin / bcdedit / diskshadow: shadow copy and recovery tampering before ransomware"
      - "SDelete renames a file to repeated letters with a matching extension (AAAAAAAA.AAA ... ZZZZZZZZ.ZZZ) before deleting it: the Entry of those names is the file that was wiped; its original name is in the earlier records of that EntryNumber"
    false_positives:
      - "Administrators using fsutil, bcdedit, vssadmin or wevtutil for maintenance; backup software calling vssadmin or wbadmin"
    severity: medium
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_delete/file_delete_win_sysinternals_sdelete_file_deletion.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_delete/file_delete_win_delete_prefetch.yml
      - https://github.com/MicrosoftDocs/win32/blob/docs/desktop-src/FileIO/creating-modifying-and-deleting-a-change-journal.md
    verified: false
    notes: "The .aaa/.zzz delete pattern is from the cited Sigma rule (read 2026-10-22); the Prefetch tool list and file-name format (EXE-HASH.pf) are the author's knowledge. Prefetch is removed when the files are deleted (FH-FS-007), so also look at event 2 for the same names. Prefetch absence on servers or SSDs where it is disabled proves nothing."

  - id: FH-FS-025
    title: Shell history, web server logs or backup files deleted
    tactic: filesystem
    attack: [T1070.003, T1070.004, T1490]
    channel: UsnJrnl
    event_ids: [2]
    prerequisites:
      - "$UsnJrnl:$J collected"
    logic:
      history_and_logs:
        EventID: 2
        FileName|re: '^(consolehost_history\.txt|u_ex\d+\.log)$'
      backups:
        EventID: 2
        FileName|re: '\.(bkf|wbcat|vhd|vhdx|bac)$'
      condition: history_and_logs or backups
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 2 --regex 'FileName=^(consolehost_history\.txt|u_ex\d+\.log)$' --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 2 --regex 'FileName=\.(bkf|wbcat|vhd|vhdx|bac)$' --format llm
    pivots:
      - "Account and session active at that minute (4624 / 4688); the PowerShell history file belongs to one user profile (Path), the IIS logs to the web server"
      - "Other cleanup in the same window: event logs, Prefetch (FH-FS-007), the tools (FH-FS-006)"
      - "Backup deletion followed by encryption activity (FH-FS-008, FH-FS-028)"
    false_positives:
      - "Log rotation of IIS logs by retention policies; users who clear PSReadLine history; backup software rotating its own files and Hyper-V / Windows Backup housekeeping"
    severity: medium
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_delete/file_delete_win_delete_powershell_command_history.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_delete/file_delete_win_delete_iis_access_logs.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_delete/file_delete_win_delete_backup_file.yml
    verified: false
    notes: "File names and locations follow the cited rules (read 2026-10-22). Those rules also look at the deleting process, which the journal does not record: judge by time and context. IIS logs are named u_exYYMMDD.log in the default format."

  - id: FH-FS-026
    title: Mark-of-the-Web removed (Zone.Identifier stream deleted or truncated)
    tactic: filesystem
    attack: [T1553.005, T1564.004]
    channel: UsnJrnl
    event_ids: [5, 4]
    prerequisites:
      - "$UsnJrnl:$J collected"
    logic:
      selection:
        Channel: UsnJrnl
        Reason|re: '(StreamChange|NamedDataTruncation)'
        FileName|re: '\.(exe|dll|ps1|bat|cmd|vbs|js|hta|scr|msi|iso|img|lnk|zip|7z|rar|docm|xlsm)$'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --regex 'Reason=(StreamChange|NamedDataTruncation)' --regex 'FileName=\.(exe|dll|ps1|bat|cmd|vbs|js|hta|scr|msi|iso|img|lnk|zip|7z|rar|docm|xlsm)$' --format llm
    pivots:
      - "MFT record of the same EntryNumber: ZoneIdContents empty and AdsNames without Zone.Identifier on a file created in a download folder means the mark is gone"
      - "Journal history of that EntryNumber: NamedDataExtend|StreamChange at creation (the browser writes the stream), later StreamChange|NamedDataTruncation (removal)"
      - "Execution of the file soon after (Prefetch, 4688 / Sysmon 1); PowerShell Unblock-File or cmd 'more < file > file' style commands in script block logs"
    false_positives:
      - "Users unblocking a file in Explorer properties; admins running Unblock-File on a deployment; archive tools and sync clients that rewrite streams"
    severity: low
    sources:
      - https://github.com/MicrosoftDocs/sdk-api/blob/docs/sdk-api-src/content/winioctl/ns-winioctl-usn_record_v2.md
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_delete/file_delete_win_zone_identifier_ads_uncommon.yml
    verified: false
    notes: "The Microsoft page (read 2026-10-22) defines StreamChange as a named stream added, removed or renamed and NamedDataTruncation as truncation of a named stream; the Sigma rule shows that the Zone.Identifier deletion is an event worth watching but is process-based. Both reasons also occur when the stream is first created, so a single record is not proof: read the sequence for the EntryNumber."

  - id: FH-FS-027
    title: Alternate data streams other than Zone.Identifier
    tactic: filesystem
    attack: [T1564.004]
    channel: MFT
    event_ids: [48]
    prerequisites:
      - "$MFT collected"
    logic:
      selection:
        EventID: 48
        AdsNames|re: '.'
      filter_zone:
        AdsNames: 'Zone.Identifier'
      condition: selection and not filter_zone
    forhunt:
      - forhunt search <paths> --channel MFT --event-id 48 --field AdsNames!=Zone.Identifier --regex AdsNames=. --format llm
    pivots:
      - "FileSize and name of the host file: a harmless-looking text file or directory carrying a large stream is the pattern; the stream data itself is only readable from the image"
      - "Process creation with a colon path (file.txt:payload.exe), wmic / rundll32 / powershell reading streams, in 4688 / Sysmon 1 and Sysmon 15 (file stream created)"
      - "Journal records of the host file with NamedDataExtend / StreamChange at the time of creation"
    false_positives:
      - "Legitimate streams: SmartScreen and download marks, thumbnails, OneDrive / Dropbox attributes, Office and Explorer property streams, backup software; most appear on many files with the same stream name, a rare name on one executable-looking file is the lead"
    severity: medium
    sources:
      - https://github.com/mitre/cti
      - https://github.com/MicrosoftDocs/win32/blob/docs/desktop-src/FileIO/file-streams.md
    verified: false
    notes: "ATT&CK T1564.004 text (read 2026-10-22 from mitre/cti) describes storing data in file attribute metadata such as ADS. If a file has Zone.Identifier plus another stream, the != filter still lists it, which is wanted. Use top_values of AdsNames in the summary line to see the stream names. EA (extended attribute) hiding is not visible in these fields."

  - id: FH-FS-028
    title: Documents renamed with an appended extension (ransomware rename pattern)
    tactic: filesystem
    attack: [T1486]
    channel: UsnJrnl
    event_ids: [3]
    prerequisites:
      - "$UsnJrnl:$J collected"
    logic:
      selection:
        EventID: 3
        Reason|contains: RenameNewName
        FileName|re: '\.(docx?|xlsx?|pdf|jpe?g|png|pst|rtf|pptx?)\.[a-z0-9_-]{3,}$'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 3 --field Reason~RenameNewName --regex 'FileName=\.(docx?|xlsx?|pdf|jpe?g|png|pst|rtf|pptx?)\.[a-z0-9_-]{3,}$' --limit 50 --format llm
    pivots:
      - "Read top_values of FileName in the summary line for one dominating appended extension; count hits per minute (see references/ntfs-hunting.md) to get the start and end of encryption"
      - "First rename minute: process creation just before, the logon that started it, shadow copy and backup deletion (FH-FS-024, FH-FS-025) and ransom notes (FH-FS-008)"
      - "Other hosts: the same extension on file servers reached over SMB shows the spread"
    false_positives:
      - "Backup and recovery tools adding .bak, .old, .orig, .tmp, .backup; Office autosave and conflict copies; sync clients adding conflict suffixes"
    severity: critical
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_rename/file_rename_win_ransomware.yml
    verified: false
    notes: "The idea (a known document extension followed by another extension after the rename) comes from the cited Sigma rule (read 2026-10-22), which excludes backup suffixes (.bak .old .orig .temp .tmp .backup); remove those by eye. Ransomware that replaces the extension or randomises the whole name is not matched: use FH-FS-008 and the rename counts."

  - id: FH-FS-029
    title: RDP client artefacts (bitmap cache, .rdp files) on a source host
    tactic: filesystem
    attack: [T1021.001]
    channel: UsnJrnl
    event_ids: [1]
    prerequisites:
      - "$UsnJrnl:$J and/or $MFT collected from the host the RDP session was started from"
    logic:
      bitmap_cache:
        Path|re: '\\terminal server client\\cache\\'
      rdp_files:
        EventID: 1
        FileName|re: '\.rdp$'
      condition: bitmap_cache or rdp_files
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'Path=\\terminal server client\\cache\\' --format llm
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'Path=\\terminal server client\\cache\\' --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'FileName=\.rdp$' --format llm
    pivots:
      - "Creation and last-write times of the cache files bracket the RDP client use per user profile; a bitmap cache on a server nobody should connect from onward means a pivot host"
      - "Target host: Microsoft-Windows-TerminalServices-RDPClient 1024/1102 and Security 4648 on the source; 4624 type 10 on the target"
      - "A .rdp file written by a browser or mail client points at a phishing RDP lure (the rule project flags that origin)"
    false_positives:
      - "Administrators and support staff using mstsc daily; saved connection files in Documents"
    severity: low
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_rdp_file_susp_creation.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_tsclient_filewrite_startup.yml
    verified: false
    notes: "The 'Terminal Server Client\\Cache' bitmap cache folder (AppData\\Local\\Microsoft under the user profile) is the author's knowledge and was not confirmed from a source read in this session. The cited rules (read 2026-10-22) cover .rdp files created by browsers and mail clients, and mstsc writing into Startup (drive redirection). This is evidence of the client side; target-side RDP is better shown in the event logs."

  - id: FH-FS-030
    title: Executables renamed in staging folders and lure-style file names
    tactic: filesystem
    attack: [T1036.005, T1036.007, T1036.002]
    channel: UsnJrnl
    event_ids: [3, 1]
    prerequisites:
      - "$UsnJrnl:$J collected"
    logic:
      renamed_exec:
        EventID: 3
        Reason|contains: RenameOldName
        FileName|re: '\.(exe|dll|ps1|bat|scr)$'
        Path|re: '^\.\\(users|programdata|windows\\temp|perflogs)\\'
      double_extension:
        EventID: [1, 3]
        FileName|re: '\.(pdf|docx?|xlsx?|pptx?|jpe?g|png|txt|rtf)\.(exe|scr|bat|cmd|js|vbs|com|pif)$'
      rtlo:
        FileName|re: '\x{202e}'
      condition: renamed_exec or double_extension or rtlo
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 3 --field Reason~RenameOldName --regex 'FileName=\.(exe|dll|ps1|bat|scr)$' --regex 'Path=^\.\\(users|programdata|windows\\temp|perflogs)\\' --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 1,3 --regex 'FileName=\.(pdf|docx?|xlsx?|pptx?|jpe?g|png|txt|rtf)\.(exe|scr|bat|cmd|js|vbs|com|pif)$' --format llm
      - forhunt search <paths> --channel UsnJrnl --regex 'FileName=\x{202e}' --format llm
    pivots:
      - "Same EntryNumber: the RenameNewName record gives the new name; a new name that imitates a Windows or update component (WinUpdate.exe, svchost.exe) in Temp or ProgramData is the masquerade"
      - "Process creation of the new name, hash of the file (same hash as the old name on other hosts)"
      - "Double extensions and right-to-left override characters are phishing lures: look for the email attachment or download (Zone.Identifier, FH-FS-004)"
    false_positives:
      - "Installers that rename their payloads in Temp; updaters swapping binaries (old name -> .old, new name -> final); files named report.pdf.exe in test data"
    severity: medium
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_susp_right_to_left_override_extension_spoofing.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_susp_lnk_double_extension.yml
      - https://github.com/MicrosoftDocs/sdk-api/blob/docs/sdk-api-src/content/winioctl/ns-winioctl-usn_record_v2.md
    verified: false
    notes: "A rename writes two records (RenameOldName and RenameNewName, per the Microsoft page read 2026-10-22), so match the old-name record in the staging folder and read the next one for the new name. The double-extension and RLO ideas come from the cited rules; the regex is the author's. Renames across volumes are copies and leave no rename record."

  - id: FH-FS-031
    title: USN journal reset or late start (journal deleted)
    tactic: filesystem
    attack: [T1070, T1070.004]
    channel: MFT
    event_ids: [16]
    prerequisites:
      - "$MFT and $UsnJrnl:$J from the same volume, collected together"
    logic:
      selection:
        EventID: 16
        Usn: 0
        Path|re: '^\.\\(users|windows\\temp|programdata)\\.*\.(exe|dll|ps1|bat|zip|7z|rar)$'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel MFT --event-id 16 --field Usn=0 --regex 'Path=^\.\\(users|windows\\temp|programdata)\\.*\.(exe|dll|ps1|bat|zip|7z|rar)$' --limit 50 --format llm
      - forhunt search <paths> --channel UsnJrnl --regex 'FileName=^fsutil\.exe-[0-9a-f]{8}\.pf$' --format llm
    pivots:
      - "forhunt stats on the $J: if its first record is days or weeks after the oldest activity visible in the $MFT (Created0x10 of recent files) or after the last logon in the event logs, the journal started late or was reset"
      - "Deleting the journal sets the USN of every file to zero before removing it (Microsoft docs), so recently created files with Usn 0 and a creation time older than the first journal record point to a reset; compare with files that do carry a Usn"
      - "fsutil.exe Prefetch/execution and the logon that ran it; the journal restarts at a small USN"
    false_positives:
      - "Files created before journalling was enabled; freshly formatted or restored volumes; journals that were trimmed to their size limit simply start later (compare size with the retention you would expect)"
    severity: high
    sources:
      - https://github.com/MicrosoftDocs/win32/blob/docs/desktop-src/FileIO/creating-modifying-and-deleting-a-change-journal.md
      - https://github.com/MicrosoftDocs/win32/blob/docs/desktop-src/FileIO/change-journals.md
    verified: false
    notes: "Behaviour of FSCTL_DELETE_USN_JOURNAL (all file USNs reset to zero, then the journal is deleted; trimming at checkpoints beyond MaximumSize plus AllocationDelta) is from the Microsoft pages read 2026-10-22 and is one publisher only. The inference 'recent files with Usn 0 => reset' is the author's and not source-confirmed; treat the first query as a lead and read the numbers (a normal volume has few recent files with Usn 0). The check needs the stats of the $J file, which no search can express."
