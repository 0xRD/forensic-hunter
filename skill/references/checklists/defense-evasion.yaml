  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/sysmon/Sysmon_255_Low_Error.yml
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/sysmon/Sysmon_4_Info_SvcStateChanged.yml
  - https://raw.githubusercontent.com/trustedsec/SysmonCommunityGuide/master/chapters/configuration.md
  - 'sample: EVTX-ATTACK-SAMPLES/Privilege Escalation/privesc_spoolsv_spl_file_write_sysmon11.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-ATTACK-SAMPLES/Credential Access/babyshark_mimikatz_powershell.evtx'
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/sysmon/sysmon_config_modification_status.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/4: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; MW-Sysmon/Operational/16: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; MW-Sysmon/Operational/255: Microsoft docs,
    rule project.  Open: field name confirmed by a single rule project only (not seen in a real log) (Description).
    ATT&CK: legacy id(s) T1562.001 were revoked in the current mitre/cti enterprise-attack data; the replacement
    id is listed first and the legacy id is kept after it. || Original notes: SigmaHQ and Hayabusa both
    use channel Microsoft-Windows-Sysmon/Operational and events 4 (State), 16 and 255 (Description); the
