name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Fixtures are reproducible
        shell: bash
        run: |
          cargo run --release --locked -p evtx-gen -- fixtures --out target/fixtures-check
          for f in $(cd fixtures/synthetic && find . -name '*.evtx'); do
            cmp "fixtures/synthetic/$f" "target/fixtures-check/$f"
          done
          cargo run --release --locked -p evtx-gen -- ntfs --out target/ntfs-check
          (cd fixtures/ntfs && find . -type f) | while IFS= read -r f; do
            cmp "fixtures/ntfs/$f" "target/ntfs-check/$f" || exit 1
          done
          cargo run --release --locked -p evtx-gen -- prefetch --out target/prefetch-check
          (cd fixtures/prefetch && find . -type f) | while IFS= read -r f; do
            cmp "fixtures/prefetch/$f" "target/prefetch-check/$f" || exit 1
          done
          cargo run --release --locked -p evtx-gen -- registry --out target/registry-check
          (cd fixtures/registry && find . -type f) | while IFS= read -r f; do
            cmp "fixtures/registry/$f" "target/registry-check/$f" || exit 1
          done
          cargo run --release --locked -p evtx-gen -- mail --out target/mail-check
          (cd fixtures/mail && find . -type f) | while IFS= read -r f; do
            cmp "fixtures/mail/$f" "target/mail-check/$f" || exit 1
          done
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run --locked

  checklists:
    name: skill checklists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - name: Schema valid and INDEX.md up to date
        run: python3 scripts/gen-checklist-index.py --check
      - name: Install scripts parse
        run: bash -n skill/scripts/install.sh && bash -n skill/scripts/fetch-samples.sh

  installer:
    name: skill installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install an older release, update it, check (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/fh"
          i() { bash skill/scripts/install.sh --prefix "$p" "$@"; }
          if i --check; then echo "check passed on an empty prefix"; exit 1; fi
          i --forhunt-version v0.5.1 --no-hayabusa
          if i --check; then echo "check passed on a too old forhunt"; exit 1; fi
          mkdir "$p/hayabusa-0.0.1"
          i
          [ ! -e "$p/hayabusa-0.0.1" ]
          # Captured, not piped into `grep -q`: that closes the pipe early.
          again="$(i)"; grep -q "already installed" <<< "$again"
          state="$(i --check)"; grep -qx ready <<< "$state"
          (cd / && "$p/bin/hayabusa" help >/dev/null)
          [ -z "$(find "$p" -maxdepth 1 -name '.staging*')" ]
      - name: Install an older release, update it, check (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Join-Path $env:RUNNER_TEMP 'fh'
          function I { powershell -NoProfile -ExecutionPolicy Bypass -File skill\scripts\install.ps1 -Prefix $p @args }
          I -Check; if ($LASTEXITCODE -eq 0) { throw 'check passed on an empty prefix' }
          I -ForhuntVersion v0.5.1 -NoHayabusa; if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          I -Check; if ($LASTEXITCODE -eq 0) { throw 'check passed on a too old forhunt' }
          New-Item -ItemType Directory (Join-Path $p 'hayabusa-0.0.1') | Out-Null
          I; if ($LASTEXITCODE -ne 0) { throw 'update failed' }
          if (Test-Path (Join-Path $p 'hayabusa-0.0.1')) { throw 'old Hayabusa folder kept' }
          $again = I | Out-String; if ($again -notmatch 'already installed') { throw "not idempotent: $again" }
          $out = I -Check | Out-String; if ($LASTEXITCODE -ne 0 -or $out -notmatch 'ready') { throw "not ready: $out" }
          & (Join-Path $p 'bin\forhunt.exe') --version; if ($LASTEXITCODE -ne 0) { throw 'forhunt does not run' }
          # Whole output taken: cutting the pipe short would set the exit code.
          $help = & (Join-Path $p 'bin\hayabusa.cmd') help | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'Hayabusa') { throw "hayabusa wrapper failed ($LASTEXITCODE)" }
          exit 0

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  perf:
    name: performance regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Compare instruction counts with the base revision
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          scripts/bench-gate.sh "$base"
