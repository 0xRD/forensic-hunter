tactic: defense-evasion
title: Defense Evasion and Log Tampering
description: 'Defense evasion on Windows is visible mainly as (a) log destruction (Security 1102, System
  104, wevtutil/Clear-EventLog command lines, a stopped Event Log service, record-id gaps), (b) audit
  and policy weakening (4719, 4907, 4616), (c) security-tool tampering (Defender 5001/5007/5010/5012/5013,
  service stops 7036/7040, Sysmon 4/16/255, fltMC unload, firewall MPSSVC changes), (d) anti-forensics
  (Sysmon 2 timestomp, 26 file delete, 25 process tampering) and (e) execution masquerading and evasion
  in script engines (svchost impersonation, bare rundll32, AMSI/ETW bypass). The most reliable signals
  are the log-cleared events, which are written even when audit policy is off. Several techniques are
  intentionally silent in logs, so telemetry gaps are findings in their own right. Note: current MITRE
  ATT&CK data splits the old Defense Evasion tactic into Stealth and Defense Impairment; attack ids list
  both the new and legacy ids.'
checks:
- id: FH-DEF-001
  title: Security log cleared (1102)
  tactic: defense-evasion
  attack:
  - T1685.005
  - T1070.001
  channel: Security
  provider: Microsoft-Windows-Eventlog
  event_ids:
  - 1102
  prerequisites:
  - 'None: 1102 is always written to the Security log when it is cleared, regardless of audit policy'
  logic:
    selection:
      EventID: 1102
      Channel: Security
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Security --event-id 1102 --format llm
  - forhunt stats <paths> --format llm
  pivots:
  - SubjectUserName / SubjectLogonId (UserData) -> the 4624 for that session, then 4688 / Sysmon 1 for
    wevtutil.exe, powershell Clear-EventLog, or a custom tool
  - System 104 for the same time (other logs cleared in the same sweep) and the first Security record
    id after the clear
  - 'If 1102 is the first event in the file, everything before it is gone: use forwarded copies (WEF/SIEM),
    Sysmon, PowerShell and RDP logs, and the $LogFile/USN journal'
  false_positives:
  - Authorised maintenance, image preparation, decommissioning, lab resets; verify with change records
  severity: critical
  sources:
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/Security/Default/Sec_1102_High_SecLogCleared.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_audit_log_cleared.yml
  - https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-ATTACK-SAMPLES/Defense Evasion/DE_1102_security_log_cleared.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_audit_log_cleared.yml
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/1102: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log. ATT&CK: legacy id(s) T1070.001 were revoked
    in the current mitre/cti enterprise-attack data; the replacement id is listed first and the legacy
    id is kept after it. || Original notes: Hayabusa and SigmaHQ both use 1102 in the Security channel;
    SigmaHQ names the provider Microsoft-Windows-Eventlog (and the legacy id 517 on pre-Vista logs). The
    actor fields live in UserData (LogFileCleared). Check provider spelling in your EVTX; it varies by
    rendering. ATT&CK ids: current data (v20) moved the old Defense Evasion tactic into Stealth and Defense
    Impairment and renumbered several techniques; both the new and the legacy id are listed in attack.'
- id: FH-DEF-002
  title: Any event log cleared (System 104)
  tactic: defense-evasion
  attack:
  - T1685.005
  - T1070.001
  channel: System
  provider: Microsoft-Windows-Eventlog
  event_ids:
  - 104
  prerequisites:
  - 'None: 104 is logged to the System log when any other log (Application, Sysmon, PowerShell, Defender,
    etc.) is cleared'
  logic:
    selection:
      EventID: 104
      Provider: Microsoft-Windows-Eventlog
    selection_important:
      Channel:
      - Application
      - Security
      - System
      - Microsoft-Windows-Sysmon/Operational
      - Microsoft-Windows-PowerShell/Operational
      - Windows PowerShell
      - Microsoft-Windows-Windows Defender/Operational
      - Microsoft-Windows-TaskScheduler/Operational
    condition: selection
  forhunt:
  - forhunt search <paths> --channel System --event-id 104 --format llm
  - forhunt search <paths> --channel System --event-id 104 --field Provider=Microsoft-Windows-Eventlog
    --format llm
  pivots:
  - Which log was cleared (the UserData channel name; rendering of this field is tool-dependent) and by
    which SubjectUserName
  - 'Cleared log itself: first records after the clear; compare with SIEM copies'
  - 4688 / Sysmon 1 wevtutil / Clear-EventLog around the same timestamp
  false_positives:
  - Scheduled log-maintenance scripts; lab or kiosk systems that reset logs on reboot
  severity: high
  sources:
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/System/Sys_104_High_ImportantLogCleared.yml
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/System/Sys_104_Med_LogCleared.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/system/microsoft_windows_eventlog/win_system_eventlog_cleared.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/system/microsoft_windows_eventlog/win_system_susp_eventlog_cleared.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0005-Defense Evasion/T1070.001-Clear Windows event logs/ID104-1102-Event
    log cleared.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/microsoft_windows_eventlog/win_system_susp_eventlog_cleared.yml
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: System/104: MITRE CTI data-component log source,
    rule project, real sample log.  Note: corrections: logic field Provider_Name -> Provider (System field
    name used by forhunt/EVTX); forhunt: --field Provider_Name= returned no rows; use --field Provider=.
    ATT&CK: legacy id(s) T1070.001 were revoked in the current mitre/cti enterprise-attack data; the replacement
    id is listed first and the legacy id is kept after it. || Original notes: Hayabusa and SigmaHQ agree
    on System 104 / provider Microsoft-Windows-Eventlog and both distinguish "important" logs from others.
    The name of the cleared channel is in UserData: Hayabusa maps it to LogFileClearedChannel, SigmaHQ
    calls it Channel, which collides with the System Channel; in raw EVTX it is the Channel element inside
    UserData/LogFileCleared. Confirm in a sample before scripting. ATT&CK ids: current data (v20) moved
    the old Defense Evasion tactic into Stealth and Defense Impairment and renumbered several techniques;
    both the new and the legacy id are listed in attack.'
- id: FH-DEF-003
  title: Log clearing / configuration tampering command lines (wevtutil cl, Clear-EventLog, WMI)
  tactic: defense-evasion
  attack:
  - T1685.005
  - T1070.001
  - T1685.001
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4688
  - 1
  - 4104
  prerequisites:
  - Audit Process Creation (Success) plus GPO "Include command line in process creation events" (4688
    CommandLine) or Sysmon installed with a config that logs event 1 (process creation)
  - '4104 branch: PowerShell Script Block Logging'
  logic:
    selection_wevtutil_img:
      NewProcessName|endswith: \wevtutil.exe
    selection_wevtutil_cmd:
      CommandLine|contains:
      - 'clear-log '
      - ' cl '
      - 'set-log '
      - ' sl '
      - 'lfn:'
    selection_ps:
      CommandLine|contains:
      - 'Clear-EventLog '
      - 'Remove-EventLog '
      - 'Limit-EventLog '
      - 'Clear-WinEvent '
      - ClearEventLog
    selection_ps_dotnet:
      CommandLine|contains|all:
      - Eventing.Reader.EventLogSession
      - ClearLog
    selection_4104:
      EventID: 4104
      ScriptBlockText|contains:
      - Clear-EventLog
      - Clear-WinEvent
      - ClearLog
      - wevtutil cl
    filter_msiexec:
      ParentProcessName|endswith: \msiexec.exe
      CommandLine|contains: ' sl '
    condition: ((selection_wevtutil_img and selection_wevtutil_cmd) or selection_ps or selection_ps_dotnet
      or selection_4104) and not filter_msiexec
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4688 --field 'NewProcessName~\wevtutil.exe' --format
    llm
  - forhunt search <paths> --channel Security --event-id 4688 --field CommandLine~Clear-EventLog --format
    llm
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~Clear-EventLog --format llm
  pivots:
  - Same-time 1102 / System 104 confirming the clear succeeded; a command line with no 1102 may mean the
    target log was not Security
  - Parent process and user -> how the attacker got there
  - wevtutil sl (set-log) shrinking a log or changing its file name is quieter than clearing
  false_positives:
  - Office updates calling wevtutil sl (SigmaHQ filters msiexec parents)
  - Admin scripts that rotate logs
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_susp_eventlog_clear.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/wmi/win_wmi_activity_nteventlogfile_cleareventlog.yml
  - https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-to-MITRE-Attack/TA0005-Defense Evasion/T1027-Obfuscated Files or Information/ID4688-Obfuscated
    payload transfer via service name - Tchopper.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - 'sample: EVTX-ATTACK-SAMPLES/AutomatedTestingTools/PanacheSysmon_vs_AtomicRedTeam01.evtx'
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_eventlog_clear.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/4688: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; MW-Sysmon/Operational/1: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; Security/4104: MITRE CTI data-component
    log source.  Open: event id / channel pair has fewer than two independent confirmations (Security/4104(cti)).
    JPCERT sheets mentioning the same event ids/tools: wevtutil (informational). ATT&CK: legacy id(s)
    T1070.001 were revoked in the current mitre/cti enterprise-attack data; the replacement id is listed
    first and the legacy id is kept after it. || Original notes: Command-line patterns are from SigmaHQ
    (single source). The 4104 branch is analyst knowledge. SigmaHQ also tracks failed WMI clear attempts
    in Microsoft-Windows-WMI-Activity/Operational event 5858 (Win32_NTEventlogFile ClearEventLog). ATT&CK
    ids: current data (v20) moved the old Defense Evasion tactic into Stealth and Defense Impairment and
    renumbered several techniques; both the new and the legacy id are listed in attack.'
- id: FH-DEF-004
  title: EventLog service stopped or disabled (6006 / 7040 / 1100)
  tactic: defense-evasion
  attack:
  - T1685.001
  - T1562.002
  channel: System
  provider: Service Control Manager
  event_ids:
  - 6006
  - 7040
  - 7036
  - 1100
  prerequisites:
  - System log (default); 1100 is written to the Security log by the Eventlog provider as the service
    shuts down
  logic:
    selection_startup_disabled:
      EventID: 7040
      param1: Windows Event Log
      param3: disabled
    selection_stopped:
      EventID: 6006
    selection_scm_stopped:
      EventID: 7036
      param1: Windows Event Log
      param2: stopped
    selection_security_1100:
      Channel: Security
      EventID: 1100
    condition: selection_startup_disabled or ((selection_stopped or selection_scm_stopped or selection_security_1100)
      and no matching shutdown / reboot sequence)
  forhunt:
  - forhunt search <paths> --channel System --event-id 7040 --field param4=EventLog --format llm
  - forhunt search <paths> --channel System --event-id 6005,6006,6008 --format llm
  - forhunt search <paths> --channel Security --event-id 1100 --format llm
  pivots:
  - 'Pair 6006 (service stopped) with 6005 (started) and 6009 / 12 / 13 (boot / shutdown): a stop without
    a reboot is suspicious'
  - Gap in EventRecordID or timestamps for the interval (see the event-log-gap check)
  - Who changed startup (7040 shows old/new start type; correlate 4688 sc.exe config eventlog start= disabled)
  false_positives:
  - Normal shutdowns and reboots (6006 occurs on every clean shutdown)
  - Planned patching
  severity: high
  sources:
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/System/Sys_7040_Med_EventLogServiceStartupDisabled.yml
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/System/Sys_6006_Info_EventLogSvcStopped.yml
  - https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-to-MITRE-Attack/TA0006-Credential Access/T1649- Steal or Forge Authentication Certificates/ID
    39 KDC - ADCS ESC 1 auth request.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-ATTACK-SAMPLES/Defense Evasion/DE_WinEventLogSvc_Crash_System_7036.evtx'
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/service_control_manager/win_system_defender_disabled.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: System/6006: rule project; System/7040:
    MITRE CTI data-component log source, rule project, real sample log; System/7036: MITRE CTI data-component
    log source, rule project, real sample log; System/1100: no source.  Open: event id / channel pair
    has fewer than two independent confirmations (System/6006(rule),System/1100()). ATT&CK: legacy id(s)
    T1562.002 were revoked in the current mitre/cti enterprise-attack data; the replacement id is listed
    first and the legacy id is kept after it. || Original notes: Hayabusa only for 7040 (param1 / param3)
    and 6006; param1/param2/param3 are the positional EventData names of SCM events. 1100 (event log service
    shutdown, Security) and 7036 for the Event Log service were not confirmed by a read source for this
    purpose; SigmaHQ shows the 7036 param1/param2 pattern only for Defender. The Event Log service normally
    cannot be stopped manually while running, so a 7040 disable followed by reboot is the usual method.
    ATT&CK ids: current data (v20) moved the old Defense Evasion tactic into Stealth and Defense Impairment
    and renumbered several techniques; both the new and the legacy id are listed in attack.'
- id: FH-DEF-005
  title: Audit policy disabled or changed (4719) and object SACL changed (4907)
  tactic: defense-evasion
  attack:
  - T1685.001
  - T1562.002
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4719
  - 4907
  prerequisites:
  - Audit Audit Policy Change (Success) for 4719
  - Audit Policy Change / Audit Authorization Policy Change as applicable; 4907 requires Audit Audit Policy
    Change and a SACL to be altered
  logic:
    selection_removed:
      EventID: 4719
      AuditPolicyChanges|contains:
      - '%%8448'
      - '%%8450'
    selection_key_subcategories:
      SubcategoryGuid:
      - '{0CCE9210-69AE-11D9-BED3-505054503030}'
      - '{0CCE922B-69AE-11D9-BED3-505054503030}'
      - '{0CCE9215-69AE-11D9-BED3-505054503030}'
      - '{0CCE922F-69AE-11D9-BED3-505054503030}'
      - '{0CCE9237-69AE-11D9-BED3-505054503030}'
      - '{0CCE9240-69AE-11D9-BED3-505054503030}'
    selection_sacl:
      EventID: 4907
    condition: (selection_removed) or selection_sacl
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4719 --format llm
  - forhunt search <paths> --channel Security --event-id 4719 --field AuditPolicyChanges~%%8448 --format
    llm
  - forhunt search <paths> --channel Security --event-id 4907 --format llm
  pivots:
  - SubcategoryGuid -> which category lost auditing (Process Creation, Logon, Security Group Management
    are the high-value ones)
  - Events missing after the 4719 timestamp for that category (e.g. no 4688 afterwards) confirm the effect
  - SubjectUserName / SubjectLogonId -> 4624 and 4688 for auditpol.exe /set or GPO refresh; 4907 ObjectName
    shows which file/key lost auditing (often LSASS, SAM or an evtx file)
  false_positives:
  - GPO refresh and security-baseline application
  - Some software and imaging tasks reset audit policy; 4907 occurs on legitimate ACL management
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_disable_event_auditing.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_disable_event_auditing_critical.yml
  - https://raw.githubusercontent.com/Yamato-Security/EnableWindowsLogSettings/main/README.md
  - 'sample: EVTX-to-MITRE-Attack/TA0005-Defense Evasion/T1562.002-Disable Windows Event Logging/ID4719-Audit
    policy deactivation.evtx'
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_disable_event_auditing.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/4719: Microsoft docs, rule project,
    real sample log; Security/4907: Microsoft docs.  Open: event id / channel pair has fewer than two
    independent confirmations (Security/4907(ms)). ATT&CK: legacy id(s) T1562.002 were revoked in the
    current mitre/cti enterprise-attack data; the replacement id is listed first and the legacy id is
    kept after it. || Original notes: SigmaHQ (two rules, one repo) confirms 4719 with AuditPolicyChanges
    %%8448 (Success removed) and %%8450 (Failure removed) and the subcategory GUIDs. 4907 has no read
    source; its semantics are analyst knowledge. The Yamato guide was read for logging-setup context only.
    Microsoft Learn was unreachable from the research sandbox, so field semantics were not checked against
    the vendor page.'
- id: FH-DEF-006
  title: System time changed (4616)
  tactic: defense-evasion
  attack:
  - T1070.006
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4616
  prerequisites:
  - Audit Security State Change (Success) - Security System > Audit Security State Change
  logic:
    selection:
      EventID: 4616
    filter_svchost:
      ProcessName: C:\Windows\System32\svchost.exe
      SubjectUserSid: S-1-5-19
    filter_vm_tools:
      ProcessName:
      - C:\Program Files\VMware\VMware Tools\vmtoolsd.exe
      - C:\Windows\System32\VBoxService.exe
    condition: selection and not 1 of filter_*
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4616 --format llm
  pivots:
  - 'PreviousTime vs NewTime magnitude: large jumps backwards can invalidate timeline ordering and Kerberos'
  - ProcessName -> 4688 / Sysmon 1 (w32tm, powershell Set-Date, cmd date/time)
  - Compare EventRecordID order with TimeCreated for out-of-order timestamps after the change
  false_positives:
  - W32Time/NTP corrections (svchost under NT AUTHORITY\LOCAL SERVICE), hypervisor guest tools, DST handling
  severity: medium
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_susp_time_modification.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0005-Defense Evasion/T1070.006-Timestomp/ID4616-system time changed.evtx'
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_time_modification.yml
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/4616: Microsoft docs, rule project,
    real sample log.  Note: flipped to true: logic equals the Sigma time-change rule (4616 minus svchost/VMware/VirtualBox
    time sync); real 4616 events in the mdecrevoisier sample carry ProcessName and SubjectUserSid. ||
    Original notes: Single source (SigmaHQ), which states the audit-subcategory requirement. Timeline
    analysis note: if 4616 shows time changes, normalise timestamps before building a timeline. Microsoft
    Learn was unreachable from the research sandbox, so field semantics were not checked against the vendor
    page. ATT&CK ids: current data (v20) moved the old Defense Evasion tactic into Stealth and Defense
    Impairment and renumbered several techniques; both the new and the legacy id are listed in attack.'
- id: FH-DEF-007
  title: Defender real-time or scanning protection disabled (5001 / 5010 / 5012)
  tactic: defense-evasion
  attack:
  - T1685
  - T1562.001
  channel: Microsoft-Windows-Windows Defender/Operational
  provider: Microsoft-Windows-Windows Defender
  event_ids:
  - 5001
  - 5010
  - 5012
  prerequisites:
  - Microsoft Defender Antivirus operational log (on by default)
  logic:
    selection:
      EventID:
      - 5001
      - 5010
      - 5012
    condition: selection
  forhunt:
  - forhunt search <paths> --channel "Microsoft-Windows-Windows Defender/Operational" --event-id 5001,5010,5012
    --format llm
  pivots:
  - 5007 config change events just before to see which registry value changed (DisableRealtimeMonitoring,
    DisableAntiSpyware)
  - 4688 / Sysmon 1 for Set-MpPreference -DisableRealtimeMonitoring, sc stop WinDefend, or registry edits
    (Sysmon 13)
  - Credential-tool or malware execution shortly after the disable (Sysmon 1 / 10)
  false_positives:
  - Installation of third-party AV (Defender moves to passive mode)
  - Deliberate disable during software installs or troubleshooting
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/windefend/win_defender_real_time_protection_disabled.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/windefend/win_defender_virus_scan_disabled.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/windefend/win_defender_malware_and_pua_scan_disabled.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/windefend/win_defender_real_time_protection_disabled.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Windows Defender/Operational/5001: rule
    project; MW-Windows Defender/Operational/5010: rule project; MW-Windows Defender/Operational/5012:
    rule project.  Open: event id / channel pair has fewer than two independent confirmations (ndows Defender/5001(rule),ndows
    Defender/5010(rule),ndows Defender/5012(rule)). ATT&CK: legacy id(s) T1562.001 were revoked in the
    current mitre/cti enterprise-attack data; the replacement id is listed first and the legacy id is
    kept after it. || Original notes: Single repo (SigmaHQ): 5001 real-time protection disabled, 5010
    malware/PUA scanning disabled, 5012 virus scanning disabled. The events do not name the actor; correlate.
    Tamper Protection blocks many of these changes (see next check). Microsoft Learn was unreachable from
    the research sandbox, so field semantics were not checked against the vendor page.'
- id: FH-DEF-008
  title: 'Defender configuration change: exclusions added, protection values altered, tamper protection
    blocks (5007 / 5013)'
  tactic: defense-evasion
  attack:
  - T1685
  - T1562.001
  channel: Microsoft-Windows-Windows Defender/Operational
  provider: Microsoft-Windows-Windows Defender
  event_ids:
  - 5007
  - 5013
  prerequisites:
  - Microsoft Defender Antivirus operational log
  - 5013 requires Tamper Protection enabled
  logic:
    selection_exclusions:
      EventID: 5007
      NewValue|contains: \Microsoft\Windows Defender\Exclusions
    selection_features:
      EventID: 5007
      NewValue|contains:
      - '\Windows Defender\DisableAntiSpyware '
      - '\Windows Defender\Scan\DisableRemovableDriveScanning '
      - '\Windows Defender\SpyNet\DisableBlockAtFirstSeen '
      - '\Real-Time Protection\SpyNetReporting '
    selection_tamper_blocked:
      EventID: 5013
      Value|endswith:
      - \Real-Time Protection\DisableRealtimeMonitoring
      - \Real-Time Protection\DisableBehaviorMonitoring
      - \Windows Defender\DisableAntiSpyware
      - \Real-Time Protection\DisableIOAVProtection
      - \Real-Time Protection\DisableScriptScanning
