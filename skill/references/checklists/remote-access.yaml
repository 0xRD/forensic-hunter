- id: FH-RMT-017
  title: One source touching shares or admin shares on many hosts (5140/5145 fan-out)
  tactic: remote-access
  attack:
  - T1021.002
  - T1135
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 5140
  - 5145
  prerequisites:
  - Audit File Share and/or Detailed File Share (Success) on many hosts, with logs collected from all
    of them
  logic:
    selection:
      EventID:
      - 5140
      - 5145
    filter_machine:
      SubjectUserName|endswith: $
    condition: count(distinct Computer) by IpAddress, SubjectUserName > 10 within 10m, excluding filter_machine
  forhunt:
  - forhunt stats <paths> --format llm
  - forhunt search <paths> --channel Security --event-id 5140 --format csv
  pivots:
  - Group results by IpAddress then check which hosts later show 7045/4698/WmiPrvSE activity (success
    of the spread)
  - ShareName values IPC$, ADMIN$, C$ across hosts are typical of worm-like spreading or ransomware deployment
  false_positives:
