- id: FH-PER-016
  title: Permanent WMI event subscription registered - WMI-Activity/Operational 5861 (and 5859/5860)
  tactic: persistence
  attack:
  - T1546.003
  channel: Microsoft-Windows-WMI-Activity/Operational
  event_ids:
  - 5861
  - 5859
  - 5860
  prerequisites:
  - Microsoft-Windows-WMI-Activity/Operational log (default on in Windows 10 / Server 2012 R2 and later
    per Hayabusa/Sigma notes; 5859 and 5861 detection needs those versions)
  logic:
    selection_binding:
      EventID: 5861
      PossibleCause|contains:
      - CommandLineEventConsumer
      - ActiveScriptEventConsumer
      - CommandLineTemplate
    selection_filter:
      EventID: 5859
    filter_scm:
      PossibleCause: Permanent
      Query: select * from MSFT_SCMEventLogEvent
    condition: (selection_binding or selection_filter) and not filter_scm
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-WMI-Activity/Operational --event-id 5861 --format
    llm
  - forhunt search <paths> --channel Microsoft-Windows-WMI-Activity/Operational --event-id 5859,5860,5861
    --format llm --limit 200
  pivots:
  - 'Consumer script/command line inside the event: ActiveScriptEventConsumer (script text) or CommandLineEventConsumer
    (command)'
  - Sysmon 19/20/21 (FH-PER-017) for the same registration with names
  - 'Sysmon 1: process started by WmiPrvSE.exe or scrcons.exe afterwards'
  - 5857 (provider loaded) shows WMI provider DLLs loaded in wmiprvse - a malicious provider DLL path
    is an anomaly
  false_positives:
  - Legitimate vendor subscriptions (e.g. HP/Dell health and BIOS tools; SCM Event Provider default subscription)
  severity: high
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/wmi/win_wmi_persistence.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/WMI-Activity_Op/WMI_5861_Info_PermEventConsumerRegistered.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/WMI-Activity_Op/WMI_5860_Info_TempEventConsumerRegistered.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/WMI-Activity_Op/WMI_5857_Info_ProviderStarted.yml
  - https://github.com/mitre-attack/attack-stix-data/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-WMI-Activity/Operational/5861: MITRE
    CTI data-component log source, rule project; MW-WMI-Activity/Operational/5859: rule project; MW-WMI-Activity/Operational/5860:
    MITRE CTI data-component log source, rule project.  Open: event id / channel pair has fewer than two
    independent confirmations (s-WMI-Activity/5859(rule)) | field name confirmed by a single rule project
    only (not seen in a real log) (PossibleCause,Query). || Original notes: Event ids and channel confirmed
    by Sigma and Hayabusa. 5861 = permanent consumer binding, 5860 = temporary consumer (Hayabusa), 5859
    = filter registration (Sigma). UserData field names differ by tool (Sigma: PossibleCause/Query/User/Provider;
