- id: FH-PER-004
  title: Scheduled task created - Security 4698
  tactic: persistence
  attack:
  - T1053.005
  channel: Security
  event_ids:
  - 4698
  prerequisites:
  - Audit Other Object Access Events (Success) enabled (Advanced Audit Policy > Object Access)
  logic:
    selection_eid:
      EventID: 4698
    selection_content:
      TaskContent|contains:
      - \AppData\
      - \Users\Public\
      - \Temp\
      - \ProgramData\
      - \Downloads\
      - powershell
      - rundll32
      - regsvr32
      - mshta
      - cmd.exe /c
      - http://
      - https://
    condition: selection_eid and selection_content
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4698 --format llm --limit 200
  - forhunt search <paths> --channel Security --event-id 4698 --field TaskContent~powershell --format
    llm
  pivots:
  - TaskName and the Command/Arguments inside TaskContent (XML); trigger type (logon, boot, one-time)
    and RunLevel/UserId (SYSTEM)
  - SubjectUserName/SubjectLogonId -> 4624 for the creator; type 3 logon implies remote creation (atsvc/schtasks
    /s)
  - TaskScheduler/Operational 106 and later 200/201 for the actual runs
  - 4699 delete shortly after = 'run once and clean up' pattern
  false_positives:
  - Software updaters (Google, Adobe, Microsoft Office) register tasks routinely
  - Admin deployment tools
  severity: medium
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_scheduled_task_creation.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/Security/ObjectAccess/OtherObjectAccessEvents/Sec_4698_Info_TaskCreated.yml
  - 'sample: EVTX-ATTACK-SAMPLES/Execution/temp_scheduled_task_4698_4699.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/4698: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log. || Original notes: Event 4698 with TaskName
    and TaskContent fields: Sigma rule plus Hayabusa sample message. Microsoft Learn page not reachable.
    Only 4698 content is parsed; 4699/4700/4701/4702 are covered in FH-PER-005.'
- id: FH-PER-005
  title: Scheduled task deleted, enabled, disabled or modified - Security 4699/4700/4701/4702
  tactic: persistence
  attack:
  - T1053.005
  - T1070
  channel: Security
  event_ids:
  - 4699
  - 4700
  - 4701
  - 4702
  prerequisites:
  - Audit Other Object Access Events (Success) enabled
  logic:
    selection_modify:
      EventID: 4702
      TaskContentNew|contains:
      - \AppData\
      - \Temp\
      - \Users\Public\
      - powershell
      - rundll32
      - regsvr32
    selection_other:
      EventID:
      - 4699
      - 4700
      - 4701
    condition: selection_modify or selection_other
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4702 --format llm
  - forhunt search <paths> --channel Security --event-id 4699,4700,4701 --format llm --limit 200
  pivots:
  - Pair 4698 and 4699 for the same TaskName within minutes (ephemeral task)
  - '4702: compare TaskContentNew with the original 4698 TaskContent (action swap = hijack of an existing
    task)'
  - 4701 disabled security/update tasks (Defender, WindowsUpdate) is defense evasion
  false_positives:
  - Routine software maintenance
  severity: medium
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_scheduled_task_update.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/Security/ObjectAccess/OtherObjectAccessEvents/Sec_4699_Info_TaskDeleted.yml
  - 'sample: EVTX-ATTACK-SAMPLES/Execution/temp_scheduled_task_4698_4699.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - 'sample: EVTX-ATTACK-SAMPLES/Credential Access/ACL_ForcePwd_SPNAdd_User_Computer_Accounts.evtx'
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/4699: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; Security/4700: Microsoft docs; Security/4701:
    Microsoft docs, rule project; Security/4702: MITRE CTI data-component log source, Microsoft docs,
    rule project, real sample log.  Open: event id / channel pair has fewer than two independent confirmations
    (Security/4700(ms)). || Original notes: 4702 field TaskContentNew and 4699 existence are confirmed
    (Sigma, Hayabusa). The meanings of 4700 (enabled) and 4701 (disabled) are from the standard event-id
    catalogue and were not re-read in a source I opened; unverified.'
- id: FH-PER-006
  title: Scheduled task registered - TaskScheduler/Operational 106
  tactic: persistence
  attack:
  - T1053.005
  channel: Microsoft-Windows-TaskScheduler/Operational
  event_ids:
  - 106
  prerequisites:
  - Channel Microsoft-Windows-TaskScheduler/Operational is disabled by default and must be enabled (wevtutil
    sl or GPO) before the event exists
  logic:
    selection:
      EventID: 106
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-TaskScheduler/Operational --event-id 106 --format
    llm --limit 200
  pivots:
  - TaskName -> 200/201 (action started/completed) and 129 (process created) to see execution
  - Security 4698 (full XML) for the same name
  - 'UserContext: SYSTEM vs a user account'
  false_positives:
  - Third-party updaters and Windows itself register tasks
  severity: medium
  sources:
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/TaskScheduler_Op/TaskSch_106_Info_TaskCreated.yml
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/persistence/T1053.005 - Scheduled
    Task was Created.yml
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: MW-TaskScheduler/Operational/106: MITRE CTI
    data-component log source, rule project.  Note: corrections: removed pseudo key ''note'' from logic
    (not an event field); text moved to notes. || Original notes: Hayabusa and Chainsaw both key on 106
    in this channel with TaskName and UserContext. Task Scheduler Operational is disabled by default per
    Sigma/Hayabusa log-source notes (Microsoft doc not read). Triage hint (moved out of logic): Review
    TaskName and UserContext for tasks that are not part of a known baseline; tasks outside \Microsoft\Windows\
    are the usual interest'
- id: FH-PER-007
  title: Scheduled task updated or deleted - TaskScheduler/Operational 140/141
  tactic: persistence
  attack:
  - T1053.005
  - T1070
  channel: Microsoft-Windows-TaskScheduler/Operational
  event_ids:
  - 140
  - 141
  prerequisites:
  - Task Scheduler Operational log enabled
  logic:
    selection:
      EventID:
      - 140
      - 141
    selection_protected:
      TaskName|contains:
      - \Microsoft\Windows\Windows Defender\
      - \Microsoft\Windows\WindowsUpdate\
      - \Microsoft\Windows\BitLocker
      - \Microsoft\Windows\SystemRestore\SR
    condition: selection and selection_protected
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-TaskScheduler/Operational --event-id 140,141 --format
    llm --limit 200
  pivots:
  - 'UserName in the event: who changed/removed it'
  - Security 4699/4702 for the same task
  false_positives:
