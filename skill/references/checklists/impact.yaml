    stop" --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field CommandLine~taskkill
    --format llm
  pivots:
  - Count of distinct stop commands by the same ParentProcessGuid (batch file hallmark)
  - Correlate with System 7036 stopped bursts (IMP-010)
