tactic: credential-access
title: Credential Access
description: Credential access in Windows event logs shows up as (a) processes opening LSASS with dump-capable
  rights (Sysmon 10, or Security 4656/4663 when a SACL exists), (b) dumping tooling in process creation
  (procdump, comsvcs MiniDump, reg save of SAM/SECURITY/SYSTEM, ntdsutil/esentutl for NTDS.dit), (c) Kerberos
  abuse visible on domain controllers (Kerberoasting 4769 RC4, AS-REP roasting 4768 PreAuthType 0, 4611
  logon-process registration), (d) brute-force and spraying patterns in 4625/4771/4776 keyed by SubStatus,
  (e) DPAPI and Credential Manager activity (4692, 5379), and (f) Defender detections of known credential
  tools (1116/1117). LSASS and registry-handle events require SACLs that are rarely configured, so absence
  of 4656/4663 is not exculpatory.
checks:
- id: FH-CRED-001
  title: LSASS memory access with dump-capable access mask and debug-library call trace (Sysmon 10)
  tactic: credential-access
  attack:
  - T1003.001
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 10
  prerequisites:
  - Sysmon installed with a config that logs event 10 (ProcessAccess) with TargetImage lsass.exe included
    (event 10 is not logged by default)
  logic:
    selection:
      EventID: 10
      TargetImage|endswith: \lsass.exe
      GrantedAccess|contains:
      - '0x1038'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
      - '0x1f1fff'
      - '0x1f3fff'
      CallTrace|contains:
      - dbgcore.dll
      - dbghelp.dll
      - kernel32.dll
      - kernelbase.dll
      - ntdll.dll
    filter_system_user:
      SourceUser|contains:
      - AUTHORI
      - AUTORI
    filter_security_tools:
      SourceImage|endswith:
      - :\Windows\Sysmon64.exe
      - :\Windows\Sysmon.exe
      - \MsMpEng.exe
    condition: selection and not 1 of filter_*
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 10 --field 'TargetImage~\lsass.exe'
    --format llm --limit 300
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 10 --field 'TargetImage~\lsass.exe'
    --field GrantedAccess=0x1fffff --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 10 --field 'TargetImage~\lsass.exe'
    --field CallTrace~dbgcore --format llm
  pivots:
  - SourceImage / SourceProcessGUID -> Sysmon 1 for the launching command line and parent
  - Sysmon 11 for a new .dmp / odd-extension file written by the same process shortly after
  - Sysmon 3 network connection or 11 staging by the same process (exfil of the dump)
  - 'SourceUser: a non-SYSTEM user opening LSASS needs SeDebugPrivilege (4672 for that logon)'
  false_positives:
  - 'EDR/AV agents, Sysmon itself, Task Manager (user-initiated dump), WerFault/crash tooling, backup
    and monitoring agents: build an allow-list by SourceImage path and signer'
  - 0x1fffff and 0x1f1fff are PROCESS_ALL_ACCESS and legitimately requested by some management tools
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_access/proc_access_win_lsass_memdump.yml
  - https://raw.githubusercontent.com/trustedsec/SysmonCommunityGuide/master/chapters/process-access.md
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/sysmon/Sysmon_10_High_ProcessAccess_RuleAlert.yml
  - https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
  verified: true
  notes: Sysmon compares GrantedAccess as a literal string, not a bitmask, so match the exact logged value
    (TrustedSec guide). SigmaHQ deliberately omits 0x1010/0x1400/0x1410/0x40 here because of false positives;
    see the next check. The CallTrace list includes generic modules (ntdll, kernelbase) so the access
    mask does the narrowing.
- id: FH-CRED-002
  title: LSASS read-access masks 0x1010 / 0x1410 / 0x1400 from non-system, non-security processes (Sysmon
    10)
  tactic: credential-access
  attack:
  - T1003.001
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 10
  prerequisites:
  - Sysmon installed with a config that logs event 10 (ProcessAccess) with TargetImage lsass.exe included
    (event 10 is not logged by default)
  logic:
    selection:
      EventID: 10
      TargetImage|endswith: \lsass.exe
      GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1400'
      - '0x1418'
      - '0x40'
    filter_system:
      SourceUser|contains:
      - AUTHORI
      - AUTORI
    filter_trusted_paths:
      SourceImage|startswith:
      - C:\Windows\System32\
      - C:\Program Files\
      - C:\Program Files (x86)\
      - C:\ProgramData\Microsoft\Windows Defender\
    condition: selection and not 1 of filter_*
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 10 --field 'TargetImage~\lsass.exe'
    --field GrantedAccess=0x1010 --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 10 --field 'TargetImage~\lsass.exe'
    --field GrantedAccess=0x1410 --format llm
  pivots:
  - SourceImage located in user-writable paths (Temp, Downloads, ProgramData, Public) -> Sysmon 1 / 11
    for how it arrived
  - Mimikatz sekurlsa typically requests PROCESS_VM_READ|QUERY_INFORMATION (0x1010)
  false_positives:
  - 'Very noisy: security products, monitoring agents, WMI provider host and others; SigmaHQ states 0x1010/0x1410
    produce too many false positives in its generic rule'
  - Only use after a baseline of SourceImage values has been built
  severity: medium
  sources:
  - https://raw.githubusercontent.com/trustedsec/SysmonCommunityGuide/master/chapters/process-access.md
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_access/proc_access_win_lsass_memdump.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_susp_lsass_dump_generic.yml
  verified: true
  notes: The TrustedSec guide names 0x1010 as the mask commonly used by Mimikatz sekurlsa and 0x1F1FFF/0x1FFFFF
    as PROCESS_ALL_ACCESS used by ProcDump-style tools; SigmaHQ lists 0x1010/0x1410/0x1400/0x1418/0x40
    in the Security 4656/4663 variant while commenting them out of the Sysmon rule because of volume.
- id: FH-CRED-003
  title: comsvcs.dll MiniDump via rundll32 against LSASS (Sysmon 10 call trace)
  tactic: credential-access
  attack:
  - T1003.001
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 10
  prerequisites:
  - Sysmon installed with a config that logs event 10 (ProcessAccess) with TargetImage lsass.exe included
    (event 10 is not logged by default)
  logic:
    selection:
      EventID: 10
      TargetImage|endswith: \lsass.exe
      SourceImage|endswith: \rundll32.exe
      CallTrace|contains: comsvcs.dll
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 10 --field 'TargetImage~\lsass.exe'
    --field 'SourceImage~\rundll32.exe' --field CallTrace~comsvcs.dll --format llm
  pivots:
  - 'Sysmon 1 / 4688 for the rundll32 command line (typically comsvcs.dll, MiniDump or the ordinal #24,
    a PID and an output path, then the word full)'
  - Sysmon 11 for the dump file just written (extension is arbitrary)
  - Parent of rundll32.exe
  false_positives:
  - Essentially none in normal operations; comsvcs.dll MiniDump is a documented living-off-the-land dumping
    technique
  severity: critical
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_access/proc_access_win_lsass_dump_comsvcs_dll.yml
  - https://raw.githubusercontent.com/trustedsec/SysmonCommunityGuide/master/chapters/process-access.md
  verified: true
  notes: SigmaHQ supplies the CallTrace pattern; the Sysmon guide confirms the CallTrace/SourceImage/TargetImage
    fields. Command-line variants are covered in the process-creation check below.
- id: FH-CRED-004
  title: 'LSASS dumping tool command lines: procdump, comsvcs MiniDump, rundll32 (4688 / Sysmon 1)'
  tactic: credential-access
  attack:
  - T1003.001
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4688
  - 1
  prerequisites:
  - Audit Process Creation (Success) plus GPO "Include command line in process creation events" (4688
    CommandLine)
  - or Sysmon installed with a config that logs event 1 (process creation)
  logic:
    selection_procdump_flags:
      CommandLine|contains:
      - ' -ma '
      - ' -mm '
      - ' -mp '
      - ' /ma '
      - ' /mm '
      - ' /mp '
    selection_procdump_target:
      CommandLine|contains:
      - ' ls'
      - ' lsass'
      - ' keyiso'
      - ' samss'
    selection_comsvcs:
      CommandLine|contains|all:
      - comsvcs
      - MiniDump
    selection_comsvcs_ordinal:
      CommandLine|contains|all:
      - comsvcs
      - '#24'
    condition: (selection_procdump_flags and selection_procdump_target) or selection_comsvcs or selection_comsvcs_ordinal
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4688 --field CommandLine~lsass --format llm
  - forhunt search <paths> --channel Security --event-id 4688 --field CommandLine~comsvcs --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field CommandLine~MiniDump
    --format llm
  pivots:
  - Sysmon 10 on lsass.exe from the same ProcessGuid
  - Sysmon 11 dump file; follow with 3 / 5145 / 5156 for exfiltration
  - 'Renamed procdump binaries: match Sysmon 1 OriginalFileName=procdump.exe or Description "Sysinternals
    process dump utility"'
  false_positives:
  - Authorised use of procdump by support staff for non-LSASS processes (flags without the lsass target)
  - Crash-dump collection scripts
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_sysinternals_procdump_lsass.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_hktl_mimikatz_command_line.yml
  - https://raw.githubusercontent.com/trustedsec/SysmonCommunityGuide/master/chapters/process-creation.md
  verified: false
  notes: 'ProcDump flags and the ls/keyiso/samss targets are from SigmaHQ (single source). The comsvcs
    MiniDump / #24 command-line forms come from analyst knowledge and were not confirmed by a read source,
    though the call-trace form (previous check) was. Obfuscated forms (caret/quote insertion, env-var
    slicing) defeat plain substring matching.'
- id: FH-CRED-005
  title: Handle request to lsass.exe with suspicious access mask (Security 4656 / 4663)
  tactic: credential-access
  attack:
  - T1003.001
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4656
  - 4663
  prerequisites:
  - Audit Handle Manipulation and Audit Kernel Object (Success) enabled
  - A SACL on the lsass.exe process object (or equivalent); without it 4656/4663 are not generated for
    LSASS - this is often not configured
  logic:
    selection_4656:
      EventID: 4656
      ObjectType: Process
      ObjectName|endswith: \lsass.exe
      AccessMask|contains:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1418'
      - '0x1f0fff'
      - '0x1f1fff'
      - '0x1f2fff'
      - '0x1f3fff'
      - '0x40'
    selection_4663:
      EventID: 4663
      ObjectName|endswith: \lsass.exe
      AccessList|contains:
      - '4484'
      - '4416'
    filter_machine_accounts:
      SubjectUserName|endswith: $
    filter_known_processes:
      ProcessName|endswith:
      - \csrss.exe
      - \wininit.exe
      - \MsMpEng.exe
      - \svchost.exe
      - \taskmgr.exe
      - \wmiprvse.exe
    condition: (selection_4656 or selection_4663) and not 1 of filter_*
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4656,4663 --field 'ObjectName~\lsass.exe' --format
    llm --limit 300
  - forhunt search <paths> --channel Security --event-id 4656 --field 'ObjectName~\lsass.exe' --field
    AccessMask=0x1410 --format llm
  pivots:
  - ProcessName / ProcessId + SubjectLogonId -> 4688 / Sysmon 1
  - Compare with Sysmon 10 for the same time window to confirm
  - 4673 SeDebugPrivilege use by the same process
  false_positives:
  - AV/EDR and monitoring agents (the SigmaHQ rules filter many by name and by Program Files path)
  - Task Manager and Process Explorer used by admins
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_susp_lsass_dump_generic.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_lsass_access_non_system_account.yml
  verified: false
  notes: 'Two SigmaHQ rules (same repository, so not independent). The AccessList values 4484 / 4416 are
    the message-resource ids as written by SigmaHQ for 4663 (rendered %%4484 / %%4416 in EventData). Prerequisite
    SACL is the common reason this event is absent: absence is not evidence of no access. Microsoft Learn
    was unreachable from the research sandbox, so field semantics were not checked against the vendor
    page.'
- id: FH-CRED-006
  title: Defender ASR blocked credential stealing from LSASS (1121)
  tactic: credential-access
  attack:
  - T1003.001
  channel: Microsoft-Windows-Windows Defender/Operational
  provider: Microsoft-Windows-Windows Defender
  event_ids:
  - 1121
  prerequisites:
  - Defender ASR rule "Block credential stealing from the Windows local security authority subsystem"
    enabled in block (or audit = 1122) mode
  logic:
    selection:
      EventID: 1121
      Path|endswith: \lsass.exe
    filter_known_processes:
      ProcessName:
      - C:\Windows\System32\svchost.exe
      - C:\Windows\System32\Taskmgr.exe
      - C:\Windows\System32\msiexec.exe
      - C:\Windows\System32\wbem\WmiPrvSE.exe
    filter_program_files:
      ProcessName|startswith:
      - C:\Program Files\
      - C:\Program Files (x86)\
    condition: selection and not 1 of filter_*
  forhunt:
  - forhunt search <paths> --channel "Microsoft-Windows-Windows Defender/Operational" --event-id 1121
    --format llm
  pivots:
  - ProcessName -> Sysmon 1 / 4688 for launching context
  - A 1121 followed by 5001/5007 (Defender tampering) or no further blocks suggests the attacker switched
    method
  false_positives:
  - Task Manager creating a dump when an admin requests it; some installers and monitoring agents
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/windefend/win_defender_asr_lsass_access.yml
  verified: false
  notes: Single source (SigmaHQ), which specifies event 1121 and the Path / ProcessName fields. 1122 is
    the audit-mode equivalent (inferred from ASR documentation knowledge, not confirmed by a read source).
    Microsoft Learn was unreachable from the research sandbox, so field semantics were not checked against
    the vendor page.
- id: FH-CRED-007
  title: 'Registry hive dumping: reg save/export of SAM, SECURITY, SYSTEM (4688 / Sysmon 1)'
  tactic: credential-access
  attack:
  - T1003.002
  - T1003.004
  - T1003.005
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4688
  - 1
  prerequisites:
  - Audit Process Creation (Success) plus GPO "Include command line in process creation events" (4688
    CommandLine)
  - or Sysmon installed with a config that logs event 1 (process creation)
  logic:
    selection_img:
      NewProcessName|endswith: \reg.exe
    selection_flag:
      CommandLine|contains:
      - ' save '
      - ' export '
    selection_hive_root:
      CommandLine|contains:
      - hklm
      - hkey_local_machine
    selection_hive:
      CommandLine|contains:
      - \system
      - \sam
      - \security
    condition: all of selection_*
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4688 --field 'NewProcessName~\reg.exe' --field
    CommandLine~save --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field 'Image~\reg.exe'
    --field 'CommandLine~hklm\sam' --format llm
  pivots:
  - Output path in the command line -> Sysmon 11 / file staging, then copy or exfil
  - 4656 / 4663 ObjectName ...\SAM (needs registry SACL) from the same ProcessId
  - 'Same host: ntdsutil/vssadmin activity, Impacket secretsdump over remote registry (4624 type 3 + 5145
    winreg pipe)'
  false_positives:
  - Backup scripts exporting HKLM\SYSTEM subsets; legitimate SAM/SECURITY saves are rare
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_reg_dumping_sensitive_hives.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_sam_registry_hive_handle_request.yml
  - https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
  verified: false
  notes: SigmaHQ only. In 4688 the image is NewProcessName (the rule uses Image / OriginalFileName for
    Sysmon / generic process-creation). A renamed reg.exe is caught by Sysmon OriginalFileName only. SigmaHQ
    also covers handles to the SAM key via 4656 ObjectType=Key, ObjectName ending \SAM, which needs a
    registry SACL.
- id: FH-CRED-008
  title: 'NTDS.dit extraction: ntdsutil snapshot/ifm, ESENT events, esentutl copy (4688 / Sysmon 1 / Application)'
  tactic: credential-access
  attack:
  - T1003.003
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4688
  - 1
  - 216
  - 325
  - 326
  - 327
  prerequisites:
  - Audit Process Creation (Success) plus GPO "Include command line in process creation events" (4688
    CommandLine) or Sysmon installed with a config that logs event 1 (process creation)
  - 'For the ESENT branch: Application log events from provider ESENT on the domain controller (logged
    by default)'
  logic:
    selection_ntdsutil_img:
      NewProcessName|endswith: \ntdsutil.exe
    selection_ntdsutil_snapshot:
      CommandLine|contains|all:
      - snapshot
      - 'mount '
    selection_ntdsutil_ifm:
      CommandLine|contains:
      - ifm
      - activate instance ntds
    selection_esentutl:
      CommandLine|contains|all:
      - esentutl
      - ' /p'
    selection_copy_tool:
      NewProcessName|endswith:
      - \vssadmin.exe
      - \xcopy.exe
      - \copy.exe
      - \robocopy.exe
      - \cmd.exe
    selection_ntds_path:
      CommandLine|contains:
      - ntds.dit
      - \NTDS\
    selection_esent_app:
      Channel: Application
      Provider_Name: ESENT
      EventID:
      - 216
      - 325
      - 326
      - 327
      Data|contains: ntds.dit
    condition: (selection_ntdsutil_img and (selection_ntdsutil_snapshot or selection_ntdsutil_ifm)) or
      selection_esentutl or selection_esent_app or (selection_copy_tool and selection_ntds_path)
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4688 --field 'NewProcessName~\ntdsutil.exe' --format
    llm
  - forhunt search <paths> --channel Application --event-id 216,325,326,327 --field Provider_Name=ESENT
    --format llm
  - forhunt search <paths> --channel Security --event-id 4688 --field CommandLine~ntds.dit --format llm
  pivots:
  - Application ESENT 325/327 (database copied/created) and 216 (database location changed) mention ntds.dit
    and the snapshot / IFM path on a DC
  - vssadmin create shadow / Win32_ShadowCopy creation (4688) and the shadow-copy path in a copy command
  - Output folder (e.g. Active Directory + registry subfolders for IFM) -> Sysmon 11, 5145 or remote copy;
    also SYSTEM hive save
  false_positives:
  - Planned AD backups and IFM media creation for new domain controllers (ntdsutil ifm)
  - Backup software performing VSS-based DC backups (ESENT events on schedule)
  severity: critical
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_ntdsutil_susp_usage.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/application/esent/win_esent_ntdsutil_abuse.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_esentutl_params.yml
  verified: false
  notes: ntdsutil snapshot-mount and ESENT 216/325/326/327 are from SigmaHQ (single repo). The ifm / vssadmin
    / ntds.dit copy forms are from analyst knowledge; the vssadmin rule path could not be fetched. DCSync
    (4662 with replication GUIDs) is a separate technique (T1003.006) not covered here. Microsoft Learn
    was unreachable from the research sandbox, so field semantics were not checked against the vendor
    page.
- id: FH-CRED-009
  title: DPAPI domain backup key retrieval (4662 BCKUPKEY) and master key backup (4692)
  tactic: credential-access
  attack:
  - T1555
  - T1003.004
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4662
  - 4692
  - 4693
  - 4695
  prerequisites:
  - '4662: Audit Directory Service Access (Success) on domain controllers with a SACL on the LSA secret
    object'
  - '4692/4693/4695: Audit DPAPI Activity (Success and Failure) - not enabled by default'
  logic:
    selection_backupkey:
      EventID: 4662
      ObjectType: SecretObject
      AccessMask: '0x2'
      ObjectName|contains: BCKUPKEY
    selection_masterkey_backup:
      EventID: 4692
    condition: selection_backupkey or selection_masterkey_backup
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4662 --field ObjectName~BCKUPKEY --format llm
  - forhunt search <paths> --channel Security --event-id 4692,4693,4695 --format llm
  pivots:
  - SubjectUserName / SubjectLogonId -> 4624 source (DC access by non-DC host)
  - 4692 is logged on the source host, not the DC; 4693 is recovery of a master key, 4695 unprotect of
    auditable data
  - 'Same time: LSARPC / MS-BKRP traffic (5145 on \pipe\protected_storage or lsarpc)'
  false_positives:
  - 4692 occurs during normal master key backups and some profile operations; baseline per host
  - 4693 appears when roaming/restored profiles recover keys
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_dpapi_domain_backupkey_extraction.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_dpapi_domain_masterkey_backup_attempt.yml
  verified: false
  notes: SigmaHQ covers 4662 and 4692 only. 4693 and 4695 semantics are from analyst knowledge and need
    confirmation. Microsoft Learn was unreachable from the research sandbox, so field semantics were not
    checked against the vendor page.
- id: FH-CRED-010
  title: Credential Manager reads (5379) and vault enumeration (5381 / 5382)
  tactic: credential-access
  attack:
  - T1555.004
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 5379
  - 5381
  - 5382
  prerequisites:
  - Audit User Account Management (Success) - 5379/5381/5382 are generated by this subcategory
  logic:
    selection:
      EventID: 5379
      ReadOperation: '%%8099'
    filter_empty:
      CountOfCredentialsReturned: 0
    filter_service:
      SubjectUserName: LOCAL SERVICE
    filter_machine:
      SubjectUserName|endswith: $
    selection_vault:
      EventID:
      - 5381
      - 5382
    condition: (selection and not 1 of filter_*) or selection_vault
  forhunt:
  - forhunt search <paths> --channel Security --event-id 5379 --format llm --limit 300
  - forhunt search <paths> --channel Security --event-id 5381,5382 --format llm
  pivots:
  - ProcessCreationTime / ClientProcessId -> Sysmon 1 / 4688 of the reader
  - Tool use (vaultcmd, cmdkey /list, Mimikatz vault::cred, Seatbelt) in 4688 / 4104
  - SubjectLogonId -> 4624
  false_positives:
  - 'Very noisy: browsers, Outlook, Teams, OneDrive and Windows itself read credentials continuously'
  - 5381/5382 appear when vault passwords are read by legitimate apps
  severity: low
  sources:
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/Security/Default/Sec_5397_Low_CredentialManagerAccessed.yml
  verified: false
  notes: Only Hayabusa (5379 with ReadOperation %%8099, rated low because of false positives). 5381/5382
    are included from analyst knowledge (vault credentials read / vault enumerated) and are not confirmed
    by a read source. Use as context around a suspected tool run, not as a standalone alert. Microsoft
    Learn was unreachable from the research sandbox, so field semantics were not checked against the vendor
    page.
- id: FH-CRED-011
  title: 'Password guessing against one account: repeated 4625 with SubStatus 0xC000006A'
  tactic: credential-access
  attack:
  - T1110.001
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4625
  prerequisites:
  - Audit Logon (Failure) on workstations, member servers and DCs
  logic:
    selection:
      EventID: 4625
      SubStatus: '0xC000006A'
    filter_no_source:
      IpAddress: '-'
    filter_machine:
      TargetUserName|endswith: $
    condition: selection and not 1 of filter_* | count() by TargetUserName, IpAddress > 10 within 10m
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4625 --field SubStatus=0xC000006A --format llm
    --limit 500
  - forhunt search <paths> --channel Security --event-id 4625 --field SubStatus=0xC000006A --field LogonType=3
    --format llm
  pivots:
  - A following 4624 for the same TargetUserName and IpAddress = successful guess
  - LogonType 3 + NTLM (AuthenticationPackageName / LogonProcessName NtLmSsp) vs 10 (RDP) identifies the
    protocol attacked
  - 4740 lockouts on the DC; IpAddress/WorkstationName -> source host investigation
  - 4776 on the DC for the same time window
  false_positives:
  - Users with a stale saved password, mapped drives and mobile mail clients retry in loops
  - Service accounts after a password change
  severity: medium
  sources:
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/Security/LogonLogoff/Logon/Sec_4625_Med_LogonFail_WrongPW_PW-Guessing_Correlation.yml
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/Security/LogonLogoff/Logon/Sec_4625_Low_LogonFail_WrongPW.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_susp_failed_logon_reasons.yml
  verified: true
  notes: Hayabusa and SigmaHQ both treat Status / SubStatus on 4625 as the failure reason; Hayabusa names
    0xC000006A "wrong password". The threshold (10 within 10 minutes) is an analyst starting point, not
    from a source. Status holds the generic code (often 0xC000006D) while SubStatus holds the specific
    reason, so filter on SubStatus.
- id: FH-CRED-012
  title: 'Password spraying / user enumeration: many accounts failing from one source (4625 0xC000006A
    / 0xC0000064)'
  tactic: credential-access
  attack:
  - T1110.003
  - T1110.004
  - T1087
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4625
  prerequisites:
  - Audit Logon (Failure); on DCs also Audit Kerberos Authentication Service and Credential Validation
    to see 4771 / 4776 variants
  logic:
    selection_wrong_password:
      EventID: 4625
      SubStatus: '0xC000006A'
    selection_unknown_user:
      EventID: 4625
      SubStatus: '0xC0000064'
    filter_no_source:
      IpAddress: '-'
    condition: (selection_wrong_password or selection_unknown_user) and not filter_no_source | count(distinct
      TargetUserName) by IpAddress > 10 within 30m
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4625 --field SubStatus=0xC0000064 --format llm
    --limit 500
  - forhunt search <paths> --channel Security --event-id 4625 --field SubStatus=0xC000006A --format llm
    --limit 500
  - forhunt search <paths> --channel Security --event-id 4776 --format llm --limit 500
  pivots:
  - Distinct TargetUserName per IpAddress / WorkstationName; low attempts per account (1-3) across many
    accounts is the spray signature
  - 0xC0000064 (user does not exist) mixed with 0xC000006A suggests a harvested or guessed user list
  - Any 4624 success from the same IpAddress afterwards
  - On DCs, same pattern in 4771 (Kerberos pre-auth failed) and 4776 (NTLM validation)
  false_positives:
  - NAT gateways and VPN concentrators aggregate many users behind one address
  - Misconfigured service or scanner jobs
  severity: medium
  sources:
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/Security/LogonLogoff/Logon/Sec_4625_Med_LogonFail_UserGuessing_Correlation.yml
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/Security/LogonLogoff/Logon/Sec_4625_Low_LogonFail_NonExistantUser.yml
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/Security/LogonLogoff/Logon/Sec_4648_Med_ExplicitLogon_PW-Spray_Correlation.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/account_management/win_security_susp_failed_logon_source.yml
  verified: true
  notes: Hayabusa confirms SubStatus 0xC0000064 (user does not exist) and 0xC000006A (wrong password)
    on 4625 and uses 4648 volume as a spray indicator; SigmaHQ confirms 4625 IpAddress as the source field.
    The count thresholds are analyst starting points.
- id: FH-CRED-013
  title: Account lockout and disabled-account logon failures (4625 0xC0000234 and related)
  tactic: credential-access
  attack:
  - T1110
  - T1078
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4625
  - 4740
  prerequisites:
  - Audit Logon (Failure); Audit User Account Management (Success) on DCs for 4740
  logic:
    selection_locked:
      EventID: 4625
      SubStatus: '0xC0000234'
    selection_restricted:
      EventID:
      - 4625
      - 4776
      SubStatus|re: ^0x(C0000072|C000006F|C0000070|C0000413|C000018C|C000015B)$
    selection_lockout:
      EventID: 4740
    condition: 1 of selection_*
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4625 --field SubStatus=0xC0000234 --format llm
  - forhunt search <paths> --channel Security --event-id 4740 --format llm
  pivots:
  - 4740 CallerComputerName names the source host of the lockout on the DC
  - Disabled-account (0xC0000072), outside-hours (0xC000006F), wrong-workstation (0xC0000070) failures
    indicate an attacker holding valid but restricted credentials
  false_positives:
  - Users locked out by forgotten passwords; stale credentials on phones and scheduled tasks
  severity: low
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_susp_failed_logon_reasons.yml
  verified: false
  notes: SigmaHQ lists the restricted-account failure codes (0xC0000072, 0xC000006F, 0xC0000070, 0xC0000413,
    0xC000018C, 0xC000015B). 0xC0000234 (account locked out) and event 4740 are standard Windows semantics
    but were not confirmed by a read source. Microsoft Learn was unreachable from the research sandbox,
    so field semantics were not checked against the vendor page.
- id: FH-CRED-014
  title: Kerberos pre-authentication failures (4771) and NTLM credential validation failures (4776) on
    DCs
  tactic: credential-access
  attack:
  - T1110.001
  - T1110.003
  - T1558
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4771
  - 4776
  prerequisites:
  - Audit Kerberos Authentication Service (Failure) and Audit Credential Validation (Success and Failure)
    on domain controllers
  logic:
    selection_kerberos:
      EventID: 4771
      Status: '0x18'
    selection_ntlm:
      EventID: 4776
      Status:
      - '0xC000006A'
      - '0xC0000064'
    filter_machine:
      TargetUserName|endswith: $
    condition: (selection_kerberos or selection_ntlm) and not filter_machine | count(distinct TargetUserName)
      by IpAddress > 10 within 30m
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4771 --field Status=0x18 --format llm --limit
    500
  - forhunt search <paths> --channel Security --event-id 4776 --field Status=0xC000006A --format llm --limit
    500
  pivots:
  - IpAddress (4771) / Workstation (4776) -> 4625 on the target hosts
  - 'Spray signature: many TargetUserName from one source with few attempts each'
  - Subsequent 4768 success from the same IpAddress
  false_positives:
  - Clock skew, stale cached credentials, services with old passwords
  severity: low
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_susp_kerberos_manipulation.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_susp_failed_logon_reasons.yml
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/Security/AccountLogon/CredentialValidation/Sec_4776_Info_NTLM-Auth.yml
  verified: false
  notes: Only the existence of 4771/4776 with a Status field is supported by read rules. The value 0x18
    (KDC_ERR_PREAUTH_FAILED, wrong password) and its use for spraying is standard Kerberos knowledge not
    confirmed here; SigmaHQ lists other Kerberos failure codes as "manipulation" and does not include
    0x18. Microsoft Learn was unreachable from the research sandbox, so field semantics were not checked
    against the vendor page.
- id: FH-CRED-015
  title: 'Kerberoasting: RC4 service ticket requests (4769, TicketEncryptionType 0x17)'
  tactic: credential-access
  attack:
  - T1558.003
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4769
  prerequisites:
  - Audit Kerberos Service Ticket Operations (Success) on domain controllers
  logic:
    selection:
      EventID: 4769
      Status: '0x0'
      TicketEncryptionType: '0x17'
    filter_krbtgt_and_machine_services:
      ServiceName|endswith:
      - krbtgt
      - $
    filter_machine_requesters:
      TargetUserName|contains: $@
    condition: selection and not 1 of filter_* | count(distinct ServiceName) by IpAddress, TargetUserName
      > 5 within 5m
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4769 --field TicketEncryptionType=0x17 --format
    llm --limit 500
  - forhunt search <paths> --channel Security --event-id 4769 --field TicketEncryptionType=0x17 --field
    Status=0x0 --format llm --limit 500
  pivots:
  - Requesting account (TargetUserName) -> 4624 logons from IpAddress
  - 'Group by IpAddress: one requester asking for many distinct ServiceName values within seconds is the
    roasting signature'
  - 'Targeted accounts (ServiceName) with SPNs and weak passwords: later 4624 logons or password resets
    for those accounts'
  false_positives:
  - Legacy applications, older OS/service accounts and accounts without AES keys still negotiate RC4
  - Domain functional level / msDS-SupportedEncryptionTypes settings forcing RC4
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_kerberoasting_activity.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_susp_rc4_kerberos.yml
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/Security/AccountLogon/KerberosAuthenticationService/Sec_4769_Med_KerberosTGT-Request_PossibleKerberoasting.yml
  - https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
  verified: true
  notes: SigmaHQ and Hayabusa independently use 4769 TicketEncryptionType 0x17; SigmaHQ adds Status 0x0,
    excludes krbtgt and $ service names, and suggests counting requests per source. SigmaHQ also has a
    variant with TicketOptions 0x40810000. Where AES is enforced, an RC4 request is more anomalous; where
    RC4 is still widely used the signal is weak and the count-per-requester pivot matters more. Check
    whether newer Windows Server updates change default ticket encryption (open question).
- id: FH-CRED-016
  title: 'AS-REP roasting: TGT request without pre-authentication (4768 PreAuthType 0)'
  tactic: credential-access
  attack:
  - T1558.004
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4768
  prerequisites:
  - Audit Kerberos Authentication Service (Success) on domain controllers
  logic:
    selection:
      EventID: 4768
      PreAuthType: 0
      ServiceName: krbtgt
      TicketEncryptionType: '0x17'
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4768 --field PreAuthType=0 --format llm --limit
    300
  - forhunt search <paths> --channel Security --event-id 4768 --field PreAuthType=0 --field TicketEncryptionType=0x17
    --format llm
  pivots:
  - TargetUserName -> the account has "Do not require Kerberos preauthentication" set (check 4738 changes
    to UserAccountControl)
  - IpAddress -> other accounts requested from the same source
  - Account misconfiguration change just before (4738)
  false_positives:
  - Accounts legitimately configured without pre-authentication (legacy/UNIX integration)
  - Some non-Windows Kerberos clients
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_kerberos_asrep_roasting.yml
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/Security/AccountLogon/KerberosAuthenticationService/Sec_4768_Med_KrbTGT-Req_PossibleAS-REP-Roasting.yml
  - https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
  verified: true
  notes: SigmaHQ and Hayabusa both match 4768 with PreAuthType 0 and TicketEncryptionType 0x17. The attack
    also works with AES; requiring 0x17 misses AES AS-REP roasting, so consider PreAuthType 0 alone with
    an allow-list.
- id: FH-CRED-017
  title: Rubeus-style logon process registration (4611 User32LogonProcesss)
  tactic: credential-access
  attack:
  - T1558
  - T1550.003
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4611
  prerequisites:
  - Audit Security System Extension (Success)
  logic:
    selection:
      EventID: 4611
      LogonProcessName: User32LogonProcesss
    selection_generic:
      EventID: 4611
    filter_system:
      SubjectUserSid: S-1-5-18
    filter_machine:
      SubjectUserName|endswith: $
    condition: selection or (selection_generic and not 1 of filter_*)
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4611 --field LogonProcessName~User32LogonProcesss
    --format llm
  - forhunt search <paths> --channel Security --event-id 4611 --format llm
  pivots:
  - SubjectUserName / SubjectLogonId -> 4688 / Sysmon 1 for the tool (Rubeus-like)
  - Following 4624 type 9 or 4648, and 4768 / 4769 ticket requests from the same host
  - 'Process requires SeTcbPrivilege or equivalent to register: check 4672 / 4673'
  false_positives:
  - The misspelled name "User32LogonProcesss" (three s) is distinctive; the generic form fires for legitimate
    logon processes registered by non-SYSTEM accounts and needs an allow-list
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_register_new_logon_process_by_rubeus.yml
  - https://raw.githubusercontent.com/Yamato-Security/hayabusa-rules/main/hayabusa/builtin/Security/System/SecuritySystemExtension/Sec_4611_High_AbnormalLogonProcessRegisteredWithLSA.yml
  verified: true
  notes: SigmaHQ supplies the Rubeus-specific LogonProcessName; Hayabusa independently flags any 4611
    from an account other than SYSTEM / machine accounts. Rebuilt or forked tooling can change the process
    name.
- id: FH-CRED-018
  title: 'Mimikatz execution traces: command-line modules and credential-dumper services'
  tactic: credential-access
  attack:
  - T1003.001
  - T1003.002
  - T1003.004
  - T1558
  - T1555
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4688
  - 1
  - 7045
  - 4104
  prerequisites:
  - Audit Process Creation (Success) plus GPO "Include command line in process creation events" (4688
    CommandLine) or Sysmon installed with a config that logs event 1 (process creation)
  - '4104 branch: PowerShell Script Block Logging'
  - '7045 branch: System log (default)'
  logic:
    selection_name:
      CommandLine|contains:
      - mimikatz
      - DumpCreds
    selection_modules:
      CommandLine|contains:
      - 'sekurlsa::'
      - 'lsadump::'
      - 'kerberos::'
      - 'dpapi::'
      - 'vault::'
      - 'crypto::'
      - 'token::'
      - privilege::debug
    selection_misc:
      CommandLine|contains:
      - ::memssp
      - ::skeleton
      - ::aadcookie
    selection_4104:
      EventID: 4104
      ScriptBlockText|contains:
      - Invoke-Mimikatz
      - 'sekurlsa::'
      - DumpCreds
    selection_service:
      EventID: 7045
      ImagePath|contains:
      - mimidrv
      - cachedump
      - pwdump
      - gsecdump
      - servpw
      - fgexec
      - dumpsvc
    condition: 1 of selection_*
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4688 --field CommandLine~sekurlsa --format llm
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~Invoke-Mimikatz --format llm
  - forhunt search <paths> --channel System --event-id 7045 --field ImagePath~mimidrv --format llm
  pivots:
  - Sysmon 10 on lsass.exe and Sysmon 6 (driver load of mimidrv.sys) around the same time
  - 'Process tree and parent: invoked from a memory-resident PowerShell loader leaves no file but 4104
    has the text'
  - Defender 1116/1117 detection names (HackTool:Win32/Mimikatz) for the same file or time window
  false_positives:
  - Red-team and purple-team exercises; security training hosts
  - Rule strings in documentation or case notes appearing in command lines
  severity: critical
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_hktl_mimikatz_command_line.yml
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/system/service_control_manager/win_system_mal_creddumper.yml
  - https://raw.githubusercontent.com/trustedsec/SysmonCommunityGuide/master/chapters/process-creation.md
  verified: false
  notes: 'Command-line module names and credential-dumper service names are from SigmaHQ (single source).
    The 4104 branch (Invoke-Mimikatz / sekurlsa:: text) is analyst knowledge: no 4104 Mimikatz rule could
    be fetched. Renamed or reflectively loaded builds drop the literal name but module::command syntax
    usually remains in the script block.'
- id: FH-CRED-019
  title: WDigest cleartext credential caching enabled (Sysmon 13 UseLogonCredential = 1)
  tactic: credential-access
  attack:
  - T1003.001
  - T1112
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 13
  prerequisites:
  - Sysmon installed with a config that logs event 13 for HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest
  logic:
    selection:
      EventID: 13
      TargetObject|endswith: WDigest\UseLogonCredential
      Details: DWORD (0x00000001)
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 13 --field 'TargetObject~WDigest\UseLogonCredential'
    --format llm
  pivots:
  - Image that wrote the value -> Sysmon 1 / 11
  - After the change, look for the next interactive logons (4624 type 2/10) and subsequent LSASS access
    (Sysmon 10)
  - 'Related LSA settings changed by the same process: RunAsPPL, DisableRestrictedAdmin (Sigma also tracks
    DisableRestrictedAdmin)'
  false_positives:
  - Some legacy hardening or compatibility scripts set UseLogonCredential for old applications
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/registry/registry_set/registry_set_wdigest_enable_uselogoncredential.yml
  - https://raw.githubusercontent.com/trustedsec/SysmonCommunityGuide/master/chapters/registry-actions.md
  verified: true
  notes: SigmaHQ supplies the key and value; the Sysmon guide confirms TargetObject / Details semantics
    for event 13. Windows 8.1 and later default to 0 so a write of 1 is meaningful.
- id: FH-CRED-020
  title: 'Browser credential store theft: access to Login Data / logins.json / key4.db by non-browser
    process (Sysmon 11 / 10)'
  tactic: credential-access
  attack:
  - T1555.003
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 11
  - 10
  prerequisites:
  - Sysmon installed with a config that logs event 11 (FileCreate) for copies of browser profile files;
    event 10 only helps for browser process access
  - File read access itself is not logged by Sysmon; Security 4663 on those files needs a SACL
  logic:
    selection_copy:
      EventID: 11
      TargetFilename|endswith:
      - \Login Data
      - \Cookies
      - \Web Data
      - \logins.json
      - \key4.db
      - \key3.db
      - \Local State
    filter_browsers:
      Image|endswith:
      - \chrome.exe
      - \msedge.exe
      - \firefox.exe
      - \brave.exe
      - \opera.exe
    condition: selection_copy and not filter_browsers
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 11 --field 'TargetFilename~\Login
    Data' --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 11 --field TargetFilename~logins.json
    --format llm
  - forhunt search <paths> --channel Security --event-id 4663 --field 'ObjectName~\Login Data' --format
    llm
  pivots:
  - Image that created the copy (not a browser, in a user-writable path) -> Sysmon 1
  - 'DPAPI activity on the same host: 4692/4693 or Sysmon 10 to a browser process, plus Local State (holds
    the encrypted key)'
  - Staging archive and exfiltration (Sysmon 11 zip, 3 outbound)
  false_positives:
  - Browser sync/backup tools and profile migration utilities
  - Forensic or EDR collection copying browser data
  severity: medium
  sources:
  - https://raw.githubusercontent.com/trustedsec/SysmonCommunityGuide/master/chapters/file-create.md
  - https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
  verified: false
  notes: No rule for browser credential theft could be fetched, so file names and the logic are analyst
    knowledge; the Sysmon guide was read only for event 11 semantics. Direct in-place reads of the SQLite
    file produce no Sysmon event; absence is not evidence of no theft.
- id: FH-CRED-021
  title: Defender detection of credential-theft tooling (1116 / 1117)
  tactic: credential-access
  attack:
  - T1003
  - T1003.001
  - T1555
  channel: Microsoft-Windows-Windows Defender/Operational
  provider: Microsoft-Windows-Windows Defender
  event_ids:
  - 1116
  - 1117
  - 1015
  prerequisites:
  - Microsoft Defender Antivirus enabled and operational log not cleared
  logic:
    selection:
      EventID:
      - 1116
      - 1117
      - 1015
      Threat Name|contains:
      - Mimikatz
      - HackTool
      - PWDump
      - CredentialAccess
      - LsassDump
      - Rubeus
      - Kerberoast
      - SAMDump
      - Dumpert
      - SecretsDump
      - Behavior:Win32/DumpLsass
    condition: selection
  forhunt:
  - forhunt search <paths> --channel "Microsoft-Windows-Windows Defender/Operational" --event-id 1116,1117
