  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-TaskScheduler/Operational/140: rule
    project; MW-TaskScheduler/Operational/141: rule project.  Open: event id / channel pair has fewer
    than two independent confirmations (-TaskScheduler/140(rule),-TaskScheduler/141(rule)) | field name
