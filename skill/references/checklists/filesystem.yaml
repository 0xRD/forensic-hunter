tactic: filesystem
title: File System (NTFS $MFT and $UsnJrnl)
description: >
  What the NTFS metadata shows when event logs are missing, cleared or not
  detailed enough: files created, renamed and deleted ($UsnJrnl:$J), and the
  timestamps, names, sizes, alternate data streams and deleted-but-not-reused
  records of the master file table ($MFT). forhunt exposes $MFT records as
  channel MFT (event id 16 = $STANDARD_INFORMATION timestamps, 48 =
  $FILE_NAME timestamps, MACB tells which timestamps share the event time)
  and journal entries as channel UsnJrnl (1 created, 2 deleted, 3 renamed,
  4 data changed, 5 metadata changed, 6 closed). Paths start with `.\` (the
  volume root; the drive letter is not recorded). Neither source records the
  host name: scope by evidence folder, not --computer.
checks:
  - id: FH-FS-001
    title: Timestomping - $STANDARD_INFORMATION created before $FILE_NAME created
    tactic: filesystem
    attack: [T1070.006]
    channel: MFT
    event_ids: [16]
    prerequisites:
      - "$MFT collected from the volume (raw copy: KAPE, Velociraptor, FTK Imager)"
    logic:
      selection:
        EventID: 16
        SiLtFn: 'true'
      executable:
        Path|re: '\.(exe|dll|sys|ps1|bat|cmd|vbs|js|hta|scr)$'
      condition: selection and executable
    forhunt:
      - forhunt search <paths> --channel MFT --event-id 16 --field SiLtFn=true --regex 'Path=\.(exe|dll|sys|ps1|bat|cmd|vbs|js|hta|scr)$' --format llm
    pivots:
      - "Compare the $FN times (Created0x30) with event logs: process creation, service install (7045), logons in the same minutes"
      - "UsnJrnl FileCreate/BasicInfoChange for the same EntryNumber: the real creation time and the moment the timestamps were changed"
      - "Other files with the same $FN creation minute: the rest of the toolkit"
    false_positives:
      - "Files copied or extracted with their original times kept (installers, archives, robocopy /COPY:T)"
      - "Windows system files laid down from installation media show $SI older than $FN on every file of the install date"
    severity: high
    sources:
      - https://attack.mitre.org/techniques/T1070/006/
      - https://github.com/mitre/cti
      - https://github.com/EricZimmerman/MFTECmd/blob/master/MFTECmd/Program.cs
      - https://learn.microsoft.com/en-us/windows/win32/fileio/master-file-table
    verified: false
    notes: "Read 2026-10-22 via GitHub: ATT&CK T1070.006 text in mitre/cti (the $SI times are user-level settable, $FN is kernel-managed; 'double timestomping' sets both and defeats this check) and the MFTECmd source, which defines the indicator as $SI created < $FN created. Not marked verified: the channel and event ids are forhunt-specific and the two sources are not independent of the check's author. Exercised by the fixture scenario (PSEXESVC.exe). See references/ntfs-hunting.md."

  - id: FH-FS-002
    title: Timestamps with zero sub-seconds on executables
    tactic: filesystem
    attack: [T1070.006]
    channel: MFT
    event_ids: [16]
    prerequisites:
      - "$MFT collected from the volume"
    logic:
      selection:
        EventID: 16
        uSecZeros: 'true'
        Path|re: '\.(exe|dll|sys|ps1|bat)$'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel MFT --event-id 16 --field uSecZeros=true --regex 'Path=\.(exe|dll|sys|ps1|bat)$' --format llm
    pivots:
      - "Combine with FH-FS-001: zero sub-seconds plus $SI earlier than $FN is a strong timestomp signal"
    false_positives:
      - "Files extracted from ZIP/CAB archives (DOS timestamps have 2-second resolution)"
      - "Files whose times were set by legitimate deployment tools"
    severity: medium
    sources:
      - https://attack.mitre.org/techniques/T1070/006/
    verified: false
    notes: "The reference implementation (MFTECmd source, read 2026-10-22) sets the flag when the millisecond part of the $SI created or modified time is 0, so forhunt's exact definition may differ slightly. Some tools write whole-second times, so one hit is weak: use it with FH-FS-001 or FH-FS-012."

  - id: FH-FS-003
    title: Executables or scripts created in user-writable staging folders
    tactic: filesystem
    attack: [T1105, T1036.005]
    channel: UsnJrnl
    event_ids: [1]
    prerequisites:
      - "$UsnJrnl:$J collected (retention is limited: days to weeks on a busy volume)"
      - "$MFT next to the journal for full paths (otherwise match on FileName)"
    logic:
      selection:
        Channel: UsnJrnl
        EventID: 1
        Path|re: '\\(users\\public|programdata|windows\\temp|perflogs|appdata\\local\\temp)\\[^\\]+\.(exe|dll|ps1|bat|cmd|vbs|js|hta|scr)$'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'Path=\\(users\\public|programdata|windows\\temp|perflogs|appdata\\local\\temp)\\[^\\]+\.(exe|dll|ps1|bat|cmd|vbs|js|hta|scr)$' --format llm
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'Path=\\(users\\public|programdata|windows\\temp|perflogs)\\[^\\]+\.(exe|dll|ps1|bat|cmd|vbs|js|hta|scr)$' --format llm
    pivots:
      - "Process creation (4688 / Sysmon 1) of the same path, and its parent"
      - "Zone.Identifier of the file (FH-FS-004): where it was downloaded from"
      - "Network logons or RDP sessions just before the creation time"
    false_positives:
      - "Installers and updaters that unpack to Temp; software deployment agents writing to ProgramData"
    severity: medium
    sources:
      - https://attack.mitre.org/techniques/T1105/
      - https://learn.microsoft.com/en-us/windows/win32/api/winioctl/ns-winioctl-usn_record_v2
    verified: false
    notes: "Expect noise in Temp folders; sort by time and look for clusters next to suspicious logons. Sources cited, not re-read in this session (B-001)."

  - id: FH-FS-004
    title: Files downloaded from the internet (Zone.Identifier with a URL)
    tactic: filesystem
    attack: [T1105, T1204.002]
    channel: MFT
    event_ids: [16, 48]
    prerequisites:
      - "$MFT collected; the Zone.Identifier stream is read only when resident (small, the usual case)"
    logic:
      selection:
        ZoneIdContents|contains: 'HostUrl='
      condition: selection
    forhunt:
      - forhunt search <paths> --channel MFT --event-id 48 --field ZoneIdContents~HostUrl --format llm
    pivots:
      - "HostUrl / ReferrerUrl domains and IPs: proxy, DNS (Sysmon 22) and firewall logs"
      - "Execution of the downloaded file (4688 / Sysmon 1 / Prefetch) after its creation time"
    false_positives:
      - "Normal browser and mail attachment downloads: judge by URL, file type and timing"
    severity: low
    sources:
      - https://attack.mitre.org/techniques/T1105/
      - https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-fscc/6e3f7352-d11c-4d76-8c39-2516a9df36e8
    verified: false
    notes: "Files fetched by PowerShell/certutil/curl usually have no Zone.Identifier: absence proves nothing. Sources cited, not re-read in this session (B-001)."

  - id: FH-FS-005
    title: Memory dump files (credential dumping output)
    tactic: filesystem
    attack: [T1003.001]
    channel: UsnJrnl
    event_ids: [1, 2]
    prerequisites:
      - "$UsnJrnl:$J and/or $MFT collected"
    logic:
      selection:
        FileName|re: '\.(dmp|mdmp)$'
      filter_wer:
        Path|contains: '\ProgramData\Microsoft\Windows\WER\'
      condition: selection and not filter_wer
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --regex 'FileName=\.(dmp|mdmp)$' --format llm
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'Path=\.(dmp|mdmp)$' --format llm
    pivots:
      - "Process access to lsass (Sysmon 10) or rundll32 comsvcs.dll MiniDump command lines at the same time"
      - "Deletion of the dump (UsnJrnl event 2) and archive creation or outbound transfer after it"
    false_positives:
      - "Windows Error Reporting and application crash dumps (WER, CrashDumps folders); administrators debugging"
    severity: high
    sources:
      - https://attack.mitre.org/techniques/T1003/001/
    verified: false
    notes: "A file named lsass*.dmp outside WER is almost always malicious. Sources cited, not re-read in this session (B-001)."

  - id: FH-FS-006
    title: Executables, scripts or archives deleted (cleanup)
    tactic: filesystem
    attack: [T1070.004]
    channel: UsnJrnl
    event_ids: [2]
    prerequisites:
      - "$UsnJrnl:$J collected"
    logic:
      selection:
        Channel: UsnJrnl
        EventID: 2
        FileName|re: '\.(exe|dll|ps1|bat|cmd|vbs|zip|7z|rar|dmp)$'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 2 --regex 'FileName=\.(exe|dll|ps1|bat|cmd|vbs|zip|7z|rar|dmp)$' --format llm
    pivots:
      - "The same EntryNumber in $MFT: a deleted record still holds name, size and timestamps until reused"
      - "Creation of the same name (UsnJrnl event 1): how long the file lived"
    false_positives:
      - "Installers, updaters and browsers deleting their temporary executables"
    severity: medium
    sources:
      - https://attack.mitre.org/techniques/T1070/004/
    verified: false
    notes: "Short-lived executables in staging folders right after a suspicious logon are the interesting ones. Sources cited, not re-read in this session (B-001)."

  - id: FH-FS-007
    title: Event log files or Prefetch files deleted
    tactic: filesystem
    attack: [T1685.005, T1070.001, T1070.004]
    channel: UsnJrnl
    event_ids: [2]
    prerequisites:
      - "$UsnJrnl:$J collected"
    logic:
      selection:
        Channel: UsnJrnl
        EventID: 2
        FileName|re: '\.(evtx|pf)$'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 2 --regex 'FileName=\.(evtx|pf)$' --format llm
    pivots:
      - "Security 1102 / System 104 log clearing at the same time"
      - "The account logged on at that time (4624) and the process (4688) that deleted them"
    false_positives:
      - "Prefetch housekeeping keeps a fixed number of .pf files and deletes old ones one at a time; mass deletion is the signal"
    severity: high
    sources:
      - https://attack.mitre.org/techniques/T1070/001/
      - https://attack.mitre.org/techniques/T1070/004/
    verified: false
    notes: "Sources cited, not re-read in this session (B-001)."

  - id: FH-FS-008
    title: Mass renames to one new extension or ransom notes (ransomware)
    tactic: filesystem
    attack: [T1486]
    channel: UsnJrnl
    event_ids: [3, 1]
    prerequisites:
      - "$UsnJrnl:$J collected"
    logic:
      renames:
        Channel: UsnJrnl
        EventID: 3
        Reason|contains: RenameNewName
      notes:
        EventID: 1
        FileName|re: '(readme|decrypt|restore|recover|how_to).*\.(txt|html|hta)$'
      condition: count(renames) by extension of FileName > 500 within 10m or notes
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 3 --field Reason~RenameNewName --limit 50 --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'FileName=(readme|decrypt|restore|recover|how_to).*\.(txt|html|hta)$' --format llm
    pivots:
      - "First renamed file and the process creation just before it; shadow copy deletion (vssadmin, wmic) in event logs"
    false_positives:
      - "Bulk renames by backup, sync or photo software (no single foreign extension, no notes)"
    severity: critical
    sources:
      - https://attack.mitre.org/techniques/T1486/
    verified: false
    notes: "The summary line's top_values on FileName help spot one dominating extension. Sources cited, not re-read in this session (B-001)."

  - id: FH-FS-009
    title: Windows process names outside their system folders (masquerading)
    tactic: filesystem
    attack: [T1036.005]
    channel: MFT
    event_ids: [48]
    prerequisites:
      - "$MFT collected"
    logic:
      selection:
        EventID: 48
        FileName|re: '^(svchost|lsass|csrss|services|smss|winlogon|wininit|explorer|rundll32|taskhostw|conhost|spoolsv)\.exe$'
      filter_system:
        Path|re: '\\windows\\(system32|syswow64|winsxs|servicing)\\'
      condition: selection and not filter_system
    forhunt:
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'FileName=^(svchost|lsass|csrss|services|smss|winlogon|wininit|explorer|rundll32|taskhostw|conhost|spoolsv)\.exe$' --limit 0 --format llm
    pivots:
      - "Drop rows under \\Windows\\System32, SysWOW64, WinSxS and servicing (and \\Windows\\explorer.exe); what is left is suspicious"
      - "Process creation and services pointing at the remaining paths"
    false_positives:
      - "\\Windows\\explorer.exe is legitimate; backup copies made by administrators"
    severity: high
    sources:
      - https://attack.mitre.org/techniques/T1036/005/
    verified: false
    notes: "Regex has no negation: filter the system folders by reading the output. Sources cited, not re-read in this session (B-001)."

  - id: FH-FS-010
    title: Remote execution service binaries dropped in the Windows folder
    tactic: filesystem
    attack: [T1569.002, T1021.002]
    channel: MFT
    event_ids: [48]
    prerequisites:
      - "$MFT collected"
    logic:
      selection:
        EventID: 48
        FileName|re: '^(psexesvc|paexec|remcomsvc|csexecsvc).*\.exe$'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'FileName=^(psexesvc|paexec|remcomsvc|csexecsvc).*\.exe$' --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'Path=^\.\\windows\\[^\\]+\.exe$' --format llm
    pivots:
      - "System 7045 / Security 4697 service install with the same image path"
      - "Network logon (4624 type 3) and ADMIN$ access (5145) just before"
    false_positives:
      - "Administrators using PsExec"
    severity: high
    sources:
      - https://attack.mitre.org/techniques/T1569/002/
    verified: false
    notes: "The second query lists any executable created directly in \\Windows, where service binaries copied over ADMIN$ land. Sources cited, not re-read in this session (B-001)."

  - id: FH-FS-011
    title: Timestamp or attribute change on an executable (journal BasicInfoChange)
    tactic: filesystem
    attack: [T1070.006]
    channel: UsnJrnl
    event_ids: [5, 4, 1]
    prerequisites:
      - "$UsnJrnl:$J collected (retention is limited)"
    logic:
      selection:
        Channel: UsnJrnl
        Reason|contains: BasicInfoChange
        FileName|re: '\.(exe|dll|sys|ps1|bat|cmd|vbs|js|hta|scr)$'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --field Reason~BasicInfoChange --regex 'FileName=\.(exe|dll|sys|ps1|bat|cmd|vbs|js|hta|scr)$' --format llm
    pivots:
      - "Same EntryNumber: the FileCreate record gives the real creation time; a BasicInfoChange minutes after it (and no later content change) is the typical timestomp sequence"
      - "MFT records of that EntryNumber: compare Created0x10 with Created0x30 (FH-FS-001) and check uSecZeros (FH-FS-002)"
      - "Process creation (4688 / Sysmon 1 and Sysmon 2 'file creation time changed') around the journal time"
    false_positives:
      - "Any attribute change (read-only, hidden, archive) also sets BasicInfoChange; installers, archive extractors and sync clients set times on files they write"
      - "A BasicInfoChange merged into the creation record (FileCreate|BasicInfoChange|Close) is normal for extractors that restore original times"
    severity: medium
    sources:
      - https://github.com/MicrosoftDocs/sdk-api/blob/docs/sdk-api-src/content/winioctl/ns-winioctl-usn_record_v2.md
      - https://github.com/MicrosoftDocs/win32/blob/docs/desktop-src/FileIO/change-journal-records.md
      - https://github.com/mitre/cti
    verified: false
    notes: "Both Microsoft pages (read 2026-10-22 from their GitHub source) say the reason flag marks a change of attributes or time stamps and that setting a time stamp writes DATA_OVERWRITE|BASIC_INFO_CHANGE; they come from one publisher, so not marked verified. The reason is a lead, not proof: it does not say which time was set."

  - id: FH-FS-012
    title: Both timestomp indicators on the same file (any extension)
    tactic: filesystem
    attack: [T1070.006]
    channel: MFT
    event_ids: [16]
    prerequisites:
      - "$MFT collected from the volume"
    logic:
      selection:
        EventID: 16
        SiLtFn: 'true'
        uSecZeros: 'true'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel MFT --event-id 16 --field SiLtFn=true --field uSecZeros=true --format llm
    pivots:
      - "Files sharing the same $FN creation minute (Created0x30): the dropped toolkit; sort by Created0x30, not by Created0x10"
      - "Journal records for the EntryNumber (FileCreate time, BasicInfoChange) and the logons or processes in that minute"
    false_positives:
      - "Archives and installers that restore old whole-second times on extraction (cab, zip, msi payloads)"
      - "OS or application files copied from media with original times: many hits on the install date or one deployment minute"
    severity: high
    sources:
      - https://github.com/EricZimmerman/MFTECmd/blob/master/MFTECmd/Program.cs
      - https://github.com/mitre/cti
    verified: false
    notes: "FH-FS-001 limited to executable extensions; this one drops the extension filter (data files, .tmp, .dat, renamed payloads) and requires both indicators, so it is quiet. Group by date before judging: a single day with hundreds of hits is a deployment, not an intrusion. Double timestomping (both $SI and $FN set) evades both flags."

  - id: FH-FS-013
    title: Offensive and credential-theft tool names or output files
    tactic: filesystem
    attack: [T1588.002, T1003.001, T1087.002, T1069.002]
    channel: MFT
    event_ids: [48, 1]
    prerequisites:
      - "$MFT and/or $UsnJrnl:$J collected"
    logic:
      tool_names:
        FileName|re: '^(mimikatz|mimilib|mimidrv|rubeus|sharphound|sharpdpapi|sharpwmi|safetykatz|lazagne|pypykatz|nanodump|dumpert|pwdump|fgdump|gsecdump|cachedump|kekeo|certify|seatbelt|inveigh|crackmapexec|netexec|procdump|wceaux).*\.(exe|dll|ps1|zip)$'
      artefacts:
        FileName|re: '(\.kirbi$|^mimilsa\.log$|^(sam|system|security|ntds)\.out$|bloodhound\.zip$|_(computers|users|groups|gpos|ous|containers)\.json$)'
      condition: tool_names or artefacts
    forhunt:
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'FileName=^(mimikatz|mimilib|mimidrv|rubeus|sharphound|sharpdpapi|sharpwmi|safetykatz|lazagne|pypykatz|nanodump|dumpert|pwdump|fgdump|gsecdump|cachedump|kekeo|certify|seatbelt|inveigh|crackmapexec|netexec|procdump|wceaux).*\.(exe|dll|ps1|zip)$' --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'FileName=^(mimikatz|mimilib|mimidrv|rubeus|sharphound|sharpdpapi|sharpwmi|safetykatz|lazagne|pypykatz|nanodump|dumpert|pwdump|fgdump|gsecdump|cachedump|kekeo|certify|seatbelt|inveigh|crackmapexec|netexec|procdump|wceaux).*\.(exe|dll|ps1|zip)$' --format llm
      - forhunt search <paths> --channel UsnJrnl --regex 'FileName=(\.kirbi$|^mimilsa\.log$|^(sam|system|security|ntds)\.out$|bloodhound\.zip$|_(computers|users|groups|gpos|ous|containers)\.json$)' --format llm
    pivots:
      - "Process creation of the same path (4688 / Sysmon 1), the parent, and the account; Sysmon 10 on lsass at the same time"
      - "Deletion of the file (UsnJrnl event 2) and archive creation afterwards (FH-FS-015)"
      - "Zone.Identifier (FH-FS-004) to find where the tool came from"
    false_positives:
      - "Authorised red team or pentest tooling; security products and sandboxes that carry sample names"
      - "ProcDump is a legitimate Sysinternals tool used by developers and support; judge by path and target process"
    severity: high
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_cred_dump_tools_dropped_files.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_hktl_mimikatz_files.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_bloodhound_collection.yml
    verified: false
    notes: "Names are default or well-known ones; attackers rename tools, so a miss proves nothing. The name list is the analyst's own, drawn from the cited rule projects (read 2026-10-22, only the file names they flag were used) and tool knowledge. SharpHound output is a timestamped zip ending in BloodHound.zip plus per-object json files (the domains json is left out because browsers create similarly named files). Sorting hits by time shows the order of use."

  - id: FH-FS-014
    title: Remote access, tunnelling and file-transfer tool binaries
    tactic: filesystem
    attack: [T1219, T1572, T1105]
    channel: MFT
    event_ids: [48, 1]
    prerequisites:
      - "$MFT and/or $UsnJrnl:$J collected"
    logic:
      selection:
        FileName|re: '^(anydesk|teamviewer|screenconnect|connectwise|atera|splashtop|rustdesk|meshagent|ltsvc|dwagent|supremo|ngrok|chisel|frpc|plink|cloudflared|winscp|pscp|psftp).*\.(exe|msi)$'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'FileName=^(anydesk|teamviewer|screenconnect|connectwise|atera|splashtop|rustdesk|meshagent|ltsvc|dwagent|supremo|ngrok|chisel|frpc|plink|cloudflared|winscp|pscp|psftp).*\.(exe|msi)$' --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'FileName=^(anydesk|teamviewer|screenconnect|connectwise|atera|splashtop|rustdesk|meshagent|ltsvc|dwagent|supremo|ngrok|chisel|frpc|plink|cloudflared|winscp|pscp|psftp).*\.(exe|msi)$' --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'Path=\\appdata\\roaming\\anydesk\\(user|system)\.conf$' --format llm
    pivots:
      - "Install or service creation (7045 / 4697), the first execution (Prefetch, 4688 / Sysmon 1) and the account that did it"
      - "Whether the product is on the organisation's approved list; outbound connections to the vendor relay in firewall / DNS logs"
      - "Config files written next to the binary (user.conf, system.conf): who and when"
    false_positives:
      - "Approved remote support software: compare with the software inventory; admins using WinSCP / PuTTY tools"
    severity: medium
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_anydesk_artefact.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_remote_access_tools_screenconnect_artefact.yml
    verified: false
    notes: "Product names are an analyst list; installers are often named with a version or random suffix (hence the .* before the extension) and portable builds run from Downloads or Temp. The AnyDesk config path comes from the cited rule (read 2026-10-22). Other products' artefact paths were not checked."

  - id: FH-FS-015
    title: Archives in staging folders and rclone traces (collection, exfiltration)
    tactic: filesystem
    attack: [T1560.001, T1074.001, T1567.002]
    channel: UsnJrnl
    event_ids: [1]
    prerequisites:
      - "$UsnJrnl:$J and/or $MFT collected"
    logic:
      archives:
        EventID: 1
        FileName|re: '\.(7z|rar|zip|tar|gz|tgz|cab)$'
        Path|re: '^\.\\(users\\public|programdata|windows\\temp|perflogs|temp|inetpub)\\'
      rclone:
        Path|re: '(\\\.config\\rclone\\|\\rclone(\.exe|\.conf)$)'
      condition: archives or rclone
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'FileName=\.(7z|rar|zip|tar|gz|tgz|cab)$' --regex 'Path=^\.\\(users\\public|programdata|windows\\temp|perflogs|temp|inetpub)\\' --format llm
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'FileName=\.(7z|rar|zip|tar|gz|tgz|cab)$' --regex 'Path=^\.\\(users\\public|programdata|windows\\temp|perflogs|temp|inetpub)\\' --format llm
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'Path=(\\\.config\\rclone\\|\\rclone(\.exe|\.conf)$)' --format llm
    pivots:
      - "FileSize of the archive in the MFT record (-F jsonl); archive size close to the size of the source folder hints at a full copy"
      - "Source files: FileCreate/DataExtend bursts or many Access times (LastAccess0x10) on a share or user folder just before the archive"
      - "Deletion of the archive (event 2) after the transfer window; outbound traffic volume in firewall / proxy logs"
      - "Rclone: config path names the remote; check the user profile that owns it"
    false_positives:
      - "Installers and updaters unpacking cabs or zips to Temp and ProgramData; backup software writing archives"
      - "Administrators using rclone for approved backups"
    severity: medium
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_rclone_config_files.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_perflogs_susp_files.yml
    verified: false
    notes: "Archives under user profile folders (Desktop, Documents, Downloads) are left out on purpose: too many are normal. Re-run with 'Path=^\\.\\\\users\\\\[^\\\\]+\\\\(desktop|documents)' once a staging user is known. The rclone config location (.config\\rclone under a user profile) was read in the cited Sigma rule on 2026-10-22; password-protected or split archives (.001, .part1.rar) are not matched."

  - id: FH-FS-016
    title: Remote-execution tool output files and random-named service binaries in \Windows
    tactic: filesystem
    attack: [T1021.002, T1569.002, T1047]
    channel: UsnJrnl
    event_ids: [1]
    prerequisites:
      - "$UsnJrnl:$J collected (and an $MFT beside it for paths)"
    logic:
      wmiexec_output:
        Path|re: '^\.\\(windows\\)?__1\d{9}\.\d{1,7}$'
      impacket_resume:
        FileName|re: '^sessionresume_[a-z]{8}$'
      random_service_binary:
        EventID: 1
        Path|re: '^\.\\windows\\[a-z]{8}\.exe$'
      condition: wmiexec_output or impacket_resume or random_service_binary
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --regex 'Path=^\.\\(windows\\)?__1\d{9}\.\d{1,7}$' --format llm
      - forhunt search <paths> --channel UsnJrnl --regex 'FileName=^sessionresume_[a-z]{8}$' --format llm
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'Path=^\.\\windows\\[a-z]{8}\.exe$' --format llm
    pivots:
      - "Network logon (4624 type 3) from the same minute, ADMIN$ / C$ access (5145), and 7045 / 4697 for the random-named service"
      - "Source IP and account of that logon; the same names on other hosts show the movement path"
      - "Creation followed by deletion within seconds is the normal life of these files"
    false_positives:
      - "Few legitimate 8-letter executables are created in \\Windows (system updates can recreate explorer.exe or splwow64.exe); PSEXESVC.exe also has eight letters, so it appears here as well as in FH-FS-010"
    severity: high
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_wmiexec_default_filename.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_impacket_file_indicators.yml
    verified: false
    notes: "The wmiexec output name (__ plus epoch seconds, written under ADMIN$ or the drive root) and the 8-letter sessionresume file (secretsdump) come from the cited Sigma rules, read 2026-10-22. That Impacket psexec/smbexec copy a random 8-letter exe to ADMIN$ is the author's tool knowledge, not confirmed from a source read in this session, and tools can use other lengths. Complements FH-FS-010 (named service binaries)."

  - id: FH-FS-017
    title: Script or page files written to web roots (webshells)
    tactic: filesystem
    attack: [T1505.003]
    channel: UsnJrnl
    event_ids: [1]
    prerequisites:
      - "$UsnJrnl:$J and/or $MFT collected from the web server"
    logic:
      selection:
        EventID: 1
        Path|re: '\\(inetpub\\wwwroot|frontend\\httpproxy|xampp\\htdocs|webapps\\root|wwwroot)\\.*\.(aspx?|ashx|asmx|ascx|cer|asa|php\d?|phtml|jspx?|cfm)$'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'Path=\\(inetpub\\wwwroot|frontend\\httpproxy|xampp\\htdocs|webapps\\root|wwwroot)\\.*\.(aspx?|ashx|asmx|ascx|cer|asa|php\d?|phtml|jspx?|cfm)$' --format llm
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'Path=\\(inetpub\\wwwroot|frontend\\httpproxy|xampp\\htdocs|webapps\\root|wwwroot)\\.*\.(aspx?|ashx|asmx|ascx|cer|asa|php\d?|phtml|jspx?|cfm)$' --format llm
    pivots:
      - "IIS logs for requests to that file name right after creation (POST with odd user agents); w3wp.exe children in 4688 / Sysmon 1"
      - "Same minute: other files on the volume created by the same process or account (the exploit chain); Exchange aspnet_client and FrontEnd\\HttpProxy\\owa\\auth folders are classic drop places"
      - "Small FileSize with an old-looking name (timestomped to match its neighbours): FH-FS-001/012"
    false_positives:
      - "Normal web deployments, CMS plugin installs and ASP.NET compile output (check who deployed and when)"
    severity: high
    sources:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_webshell_creation_detect.yml
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_exchange_webshell_drop.yml
    verified: false
    notes: "Paths and extensions follow the two cited rules (read 2026-10-22), widened to Tomcat/XAMPP names. Custom web roots (D:\\sites) are matched only if they contain one of these folder names: add the real root. A dropped file that was later deleted is still visible as an event 2 in the journal or a Deleted record in the $MFT."

  - id: FH-FS-018
    title: Scripts, binaries or shortcuts written to Startup folders
    tactic: filesystem
    attack: [T1547.001]
    channel: UsnJrnl
    event_ids: [1]
    prerequisites:
      - "$UsnJrnl:$J and/or $MFT collected"
    logic:
      selection:
        EventID: 1
        Path|re: '\\start menu\\programs\\startup\\[^\\]+\.(bat|cmd|vbs|vbe|js|jse|ps1|hta|exe|dll|scr|url|wsf|lnk|jar|msi)$'
      condition: selection
    forhunt:
      - forhunt search <paths> --channel UsnJrnl --event-id 1 --regex 'Path=\\start menu\\programs\\startup\\[^\\]+\.(bat|cmd|vbs|vbe|js|jse|ps1|hta|exe|dll|scr|url|wsf|lnk|jar|msi)$' --format llm
      - forhunt search <paths> --channel MFT --event-id 48 --regex 'Path=\\start menu\\programs\\startup\\[^\\]+\.(bat|cmd|vbs|vbe|js|jse|ps1|hta|exe|dll|scr|url|wsf|lnk|jar|msi)$' --format llm
    pivots:
      - "The user profile (or ProgramData for all users) tells who is affected; the next logon of that user is the first execution"
      - "A .lnk or .url target points to the payload: read it from the live image; the payload path is the real IOC"
      - "Writes from mstsc.exe into Startup mean RDP drive redirection (tsclient) was used to plant files"
    false_positives:
      - "Application shortcuts (.lnk) created by installers, e.g. Send to OneNote; Windows feature updates staging under $WINDOWS.~BT"
