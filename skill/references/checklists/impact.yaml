- id: FH-IMP-016
  title: Mass password changes or resets (4723 / 4724 burst) and many account lockouts (4740)
  tactic: impact
  attack:
  - T1531
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4723
  - 4724
  - 4740
  prerequisites:
  - Audit User Account Management (Success) for 4723/4724; Audit Account Lockout / User Account Management
    for 4740 (logged on the DC and on the machine that locked a local account)
  logic:
    selection_pw:
      EventID:
      - 4723
      - 4724
    selection_lock:
      EventID: 4740
    condition: count(distinct TargetUserName) by SubjectUserName > 15 within 10m for selection_pw, or
      count(distinct TargetUserName) > 20 within 10m for selection_lock
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4723,4724 --format llm
  - forhunt search <paths> --channel Security --event-id 4740 --format llm
  pivots:
  - SubjectUserName / SubjectLogonId -> 4624 to see where the resetting admin session came from
  - 4740 CallerComputerName shows the source of bad passwords (spray vs. service with a stale password)
  - Also check 4725 (disable) and 4726 (delete) bursts and 4738
  false_positives:
  - Helpdesk bulk resets, forced rotations, password-policy rollouts, service accounts with stale credentials
  severity: medium
  sources:
  - https://raw.githubusercontent.com/mdecrevoisier/EVTX-to-MITRE-Attack/master/README.md
  - 'sample: EVTX-to-MITRE-Attack/TA0003-Persistence/T1098.xxx-Account manipulation/ID4723-5145-password
    reset with changeNTLM (Mimikatz).evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - 'sample: EVTX-ATTACK-SAMPLES/Privilege Escalation/samaccount_spoofing_CVE-2021-42287_CVE-2021-42278_DC_securitylogs.evtx'
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/Security/AccountManagement/UserAccountManagement/Sec_4724_Med_AcctPassword_OtherChanged.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/4723: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; Security/4724: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; Security/4740: MITRE CTI data-component
    log source, Microsoft docs.  Open: event ids, channel and fields are confirmed (see above) but the
    detection logic goes beyond what any opened rule/source states: The burst thresholds are heuristics.
    JPCERT sheets mentioning the same event ids/tools: net-user (informational). || Original notes: Event
