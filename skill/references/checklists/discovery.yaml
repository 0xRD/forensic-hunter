- id: FH-DISC-015
  title: Security software discovery (WMI SecurityCenter2, Get-MpComputerStatus, product queries)
  tactic: discovery
  attack:
  - T1518.001
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 1
  prerequisites:
  - Sysmon installed with a config that logs event 1; or Security 4688 with command line auditing. For
    PowerShell variants also 4104 (Script Block Logging)
  logic:
    selection_wmic:
      Image|endswith: \wmic.exe
      CommandLine|contains:
      - SecurityCenter2
      - AntiVirusProduct
    selection_ps:
      CommandLine|contains:
      - SecurityCenter2
      - Get-MpComputerStatus
      - AntiVirusProduct
    condition: selection_wmic or selection_ps
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field CommandLine~SecurityCenter2
    --format llm
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~SecurityCenter2 --format llm
  pivots:
  - Typically precedes Defender tampering (IMP-006/007) or tool selection by the actor
  false_positives:
  - Inventory/EDR/health-check agents, helpdesk scripts
  severity: low
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_wmic_recon_product.yml
  - 'sample: EVTX-ATTACK-SAMPLES/AutomatedTestingTools/PanacheSysmon_vs_AtomicRedTeam01.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_wmic_recon_product_class.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/1: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: literal value not found in any opened
    source (Get-MpComputerStatus). JPCERT sheets mentioning the same event ids/tools: wmic (informational).
    || Original notes: Only the existence of a related Sigma rule (wmic product recon) was confirmed by
    fetch; its body was not read. The SecurityCenter2 namespace is from the task brief and analyst knowledge.'
- id: FH-DISC-016
