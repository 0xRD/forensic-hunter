- id: FH-DEF-020
  title: 'ETW tampering: .NET ETW disabled via registry or environment variable (4657 / Sysmon 13) and
    script text'
  tactic: defense-evasion
  attack:
  - T1685
  - T1562.006
  - T1685.001
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4657
  - 13
  - 4104
  prerequisites:
  - '4657: Audit Registry (Success) with SACL on HKLM\SOFTWARE\Microsoft\.NETFramework and user Environment
    keys'
  - or Sysmon event 13 for the same keys
  - 4104 for script-based patching (EtwEventWrite)
  logic:
    selection_4657_global:
      EventID: 4657
      ObjectName|endswith: \SOFTWARE\Microsoft\.NETFramework
      ObjectValueName: ETWEnabled
      NewValue: 0
    selection_4657_env:
      EventID: 4657
      ObjectName|contains: \Environment
      ObjectValueName:
      - COMPlus_ETWEnabled
      - COMPlus_ETWFlags
      NewValue: 0
    selection_sysmon13:
      EventID: 13
      TargetObject|contains:
      - \.NETFramework\ETWEnabled
      - \Environment\COMPlus_ETWEnabled
      Details: DWORD (0x00000000)
    selection_4104:
      EventID: 4104
      ScriptBlockText|contains:
      - EtwEventWrite
      - PSEtwLogProvider
      - etwProvider
    condition: 1 of selection_*
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4657 --field ObjectValueName=ETWEnabled --format
    llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 13 --field TargetObject~ETWEnabled
    --format llm
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~EtwEventWrite --format llm
  pivots:
  - Process that wrote the value (ProcessName / Image) and what ran in .NET afterwards (execute-assembly,
    Seatbelt-like loaders)
  - Sysmon image-load (event 7) of clr.dll/clrjit.dll in unexpected processes
  - A drop in ETW-based telemetry (e.g. Defender for Endpoint, PowerShell 4104 for that process) after
    the change
  false_positives:
  - Very rare in normal operations
  severity: high
  sources:
  - https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/builtin/security/win_security_dot_net_etw_tamper.yml
  - https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
