- id: FH-REG-016
  title: 'ShimCache: program in a staging folder'
  tactic: registry
  attack:
  - T1204.002
  - T1074.001
  channel: Registry
  event_ids:
  - 20
  prerequisites:
  - SYSTEM hive of the current control set, Windows 10 or 11 format
  logic:
    selection:
      EventID: 20
      ExePath|re: \\(users\\public|windows\\temp|perflogs|\$recycle\.bin)\\
    condition: selection
  forhunt:
  - forhunt search <paths> -c Registry -e 20 --regex 'ExePath=\\(users\\public|windows\\temp|perflogs|\$recycle\.bin)\\' --format llm
  pivots:
  - Position gives the order of appearance; the date is the file's own modification time
  - 'Confirm execution elsewhere: ShimCache alone only proves the file was seen'
