- id: FH-PER-008
  title: Scheduled task running a program from a user-writable path - TaskScheduler/Operational 129/200
  tactic: persistence
  attack:
  - T1053.005
  channel: Microsoft-Windows-TaskScheduler/Operational
  event_ids:
  - 129
  - 200
  prerequisites:
  - Task Scheduler Operational log enabled
  logic:
    selection:
      EventID: 129
      Path|contains:
      - \AppData\Local\Temp\
      - \Users\Public\
      - \Downloads\
      - \Desktop\
      - C:\Windows\Temp\
      - C:\Temp\
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-TaskScheduler/Operational --event-id 129 --field
    Path~Temp --format llm
  - forhunt search <paths> --channel Microsoft-Windows-TaskScheduler/Operational --event-id 200 --format
    llm --limit 200
  pivots:
  - TaskName -> creation event (106 / 4698)
  - 200 carries ActionName (the executable that ran)
  - 'Binary at Path: Sysmon 11 creation time, hash'
  false_positives:
  - Installers launching a first-run task from Temp
  severity: medium
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/taskscheduler/win_taskscheduler_execution_from_susp_locations.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/TaskScheduler_Op/TaskSch_200_Info_TaskExecuted.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-TaskScheduler/Operational/129: rule
    project; MW-TaskScheduler/Operational/200: rule project.  Open: event id / channel pair has fewer
    than two independent confirmations (-TaskScheduler/129(rule),-TaskScheduler/200(rule)) | field name
    confirmed by a single rule project only (not seen in a real log) (Path). || Original notes: Sigma
    uses 129 with field Path; Hayabusa uses 200 with ActionName. Field layouts differ between the two,
    so I could not confirm that both event ids carry the same path field - verify on a sample EVTX.'
- id: FH-PER-009
  title: Run / RunOnce autorun value written (Sysmon 12/13)
  tactic: persistence
  attack:
  - T1547.001
  channel: Microsoft-Windows-Sysmon/Operational
  event_ids:
  - 12
  - 13
  prerequisites:
  - Sysmon installed with a config that logs event 12/13 (RegistryEvent) with rules covering the Run keys;
    Sysmon documents these events as useful for autostart monitoring
  logic:
    selection:
      EventID:
      - 12
      - 13
      TargetObject|contains:
      - \CurrentVersion\Run\
      - \CurrentVersion\RunOnce\
      - \CurrentVersion\Policies\Explorer\Run\
      - \CurrentVersion\RunServices\
    selection_susp:
      Details|contains:
      - \AppData\
      - \ProgramData\
      - \Users\Public\
      - \Temp\
      - \Perflogs\
      - '%temp%'
      - '%appdata%'
    condition: selection and selection_susp
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 12,13 --field TargetObject~CurrentVersion\Run
    --format llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 13 --field TargetObject~CurrentVersion\Run
    --field Details~AppData --format llm
  pivots:
  - Image of the writer process (reg.exe, powershell, rundll32 are suspicious)
  - 'Details points to a binary/script: Sysmon 11 for its creation, hash and signature'
  - TargetObject under HKU\<SID> = per-user persistence; HKLM = needs admin; WOW6432Node variants for
    32-bit
  - Sysmon 1 for the process that did the write
  false_positives:
  - Installers and updaters (Teams, OneDrive, Chrome) write Run entries; baseline by Image
  severity: medium
  sources:
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_susp_run_key_img_folder.yml
  - https://github.com/mitre-attack/attack-stix-data/blob/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-ATTACK-SAMPLES/Lateral Movement/LM_sysmon_3_12_13_1_SharpRDP.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-to-MITRE-Attack/TA0004-Privilege Escalation/T1068-Exploitation for Privilege Escalation/ID12-13
    Mini_Plasma_PoC_AbortHydration_ArbitraryRegKey_EoP.evtx'
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/12: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log; MW-Sysmon/Operational/13: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log. JPCERT sheets mentioning the same event
    ids/tools: net-user (informational). || Original notes: Microsoft Sysmon page says events 12/13 are
    useful for monitoring autostart registry locations and documents the HKLM/HKU abbreviations; Sigma
    confirms TargetObject and Details field names. Sysmon''s registry-event Image field is the writing
    process.'
- id: FH-PER-010
  title: Executable or script dropped into a Startup folder (Sysmon 11)
  tactic: persistence
  attack:
  - T1547.001
  channel: Microsoft-Windows-Sysmon/Operational
  event_ids:
  - 11
  prerequisites:
  - Sysmon installed with a config that logs event 11 including a rule for ...\Start Menu\Programs\StartUp
  logic:
    selection:
      EventID: 11
      TargetFilename|contains: \Microsoft\Windows\Start Menu\Programs\StartUp
    filter_updates:
      Image:
      - C:\Windows\System32\wuauclt.exe
    condition: selection and not filter_updates
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 11 --field "TargetFilename~Start
    Menu\Programs\StartUp" --format llm
  pivots:
  - 'Image: which process wrote the file (browser/Office = delivery; cmd/powershell = scripted persistence)'
  - 'File type: .lnk pointing elsewhere, .bat/.vbs/.js, .exe'
  - 'Next logon of the user: Sysmon 1 with ParentImage explorer.exe starting the dropped file'
  false_positives:
  - Software installers creating shortcuts
  - Per-user vs 'All Users' (C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp) folders both
    match
  severity: medium
  sources:
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_startup_folder_file_write.yml
  - https://github.com/mitre-attack/attack-stix-data/blob/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-to-MITRE-Attack/TA0004-Privilege Escalation/T1068-Exploitation for Privilege Escalation/ID12-13
    Mini_Plasma_PoC_AbortHydration_ArbitraryRegKey_EoP.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_sysinternals_procexp_driver_susp_creation.yml
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/11: MITRE CTI data-component
