    real sample log.  Open: event ids, channel and fields are confirmed (see above) but the detection
    logic goes beyond what any opened rule/source states. || Original notes: Sigma only. Pass-the-ticket
    produces no unique native event; it is mostly inferred from Kerberos events that lack the expected
    preceding TGT (4768) or come from unexpected hosts. Forged-ticket artefacts belong to credential-access.yaml.'
- id: FH-LAT-017
  title: Administrative share access from remote hosts (5140 on ADMIN$, C$, IPC$)
  tactic: lateral-movement
  attack:
  - T1021.002
  - T1570
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 5140
  prerequisites:
  - Audit File Share (Success) on the target
  logic:
    selection:
      EventID: 5140
      ShareName:
      - \\*\ADMIN$
      - \\*\C$
    filter_machine:
      SubjectUserName|endswith: $
    condition: selection and not filter_machine
  forhunt:
  - forhunt search <paths> --channel Security --event-id 5140 --field 'ShareName~ADMIN$' --format llm
  - forhunt search <paths> --channel Security --event-id 5140 --field 'ShareName~C$' --format llm
  pivots:
  - 'IpAddress / IpPort: the source; correlate with 4624 type 3 sharing the SubjectLogonId'
  - 5145 on the same share for what was touched (FH-LAT-018)
  - One source touching ADMIN$ on many hosts in minutes (check across hosts with forhunt timeline) suggests
    automated spreading
  false_positives:
  - Backup, AV management, patching, SCCM and admin workstations
  severity: medium
  sources:
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/PsExec.htm
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/net-use.htm
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_admin_share_access.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/Security/ObjectAccess/FileShare/Sec_5140_Info_NetShareAccess.yml
  - 'sample: EVTX-to-MITRE-Attack/EVTX_full_APT_attack_steps/ID5145-4624-DonPAPI full extraction.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/5140: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log. JPCERT sheets mentioning the same event ids/tools:
    net-user (informational). || Original notes: ShareName is logged with a leading \\*\ (for example
    \\*\ADMIN$); Sigma matches on Admin$ case-insensitively. 5140 is logged once per session/logon-to-share,
    not per file.'
- id: FH-LAT-018
  title: File drops to admin shares (5145 write access to ADMIN$/C$ of executables and scripts)
  tactic: lateral-movement
  attack:
  - T1570
  - T1021.002
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 5145
  prerequisites:
  - Audit Detailed File Share (Success) on the target; this is high volume, scope it to servers and sensitive
    hosts
  logic:
    selection:
      EventID: 5145
      ShareName|endswith:
      - ADMIN$
      - C$
      AccessList|contains: '%%4417'
    selection_ext:
      RelativeTargetName|endswith:
      - .exe
      - .dll
      - .bat
      - .ps1
      - .vbs
      - .msi
    filter_machine:
      SubjectUserName|endswith: $
    condition: selection and selection_ext and not filter_machine
  forhunt:
  - forhunt search <paths> --channel Security --event-id 5145 --field 'ShareName~ADMIN$' --field AccessList~%%4417
    --format llm
  - forhunt search <paths> --channel Security --event-id 5145 --field 'ShareName~C$' --field RelativeTargetName~.exe
    --format llm
  pivots:
  - RelativeTargetName is the dropped file; hash it from the host (MFT, Sysmon 11) and see whether a service/task
    executes it within seconds
  - Followed by 7045 (service) or 4698 (task) pointing at the same file
  - IpAddress / SubjectUserName for the copying source
  false_positives:
  - Software deployment and patch tools writing to ADMIN$
  severity: high
  sources:
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/PsExec.htm
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_smb_file_creation_admin_shares.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/Security/ObjectAccess/DetailedFileShare/Sec_5145_Info_NetShareFileAccess.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0002-Execution/T1047-Windows Management Instrumentation/ID4688-5145-WMIexec
    execution via SMB.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: Security/5145: MITRE CTI data-component log
    source, Microsoft docs, rule project, real sample log.  Note: corrections: AccessList in 5145 holds
    message tokens (%%4417 = WriteData or AddFile), not the word WriteData; value fixed (sample: 60 events
    with %%4417, 0 with WriteData). JPCERT sheets mentioning the same event ids/tools: net-user (informational).
    || Original notes: JPCERT shows PsExec''s PSEXESVC.exe copy as 5145 on ADMIN$ with RelativeTargetName
    PSEXESVC.exe; Sigma uses AccessMask 0x2 (WriteData) on C$. Share and file names in 5145 are per-access,
    so expect many events per file copy.'
- id: FH-LAT-019
  title: RDP session hijacking with tscon.exe
  tactic: lateral-movement
  attack:
  - T1563.002
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4688
  prerequisites:
  - Process creation auditing with command line, or Sysmon event 1 (needed to see tscon run as SYSTEM)
  logic:
    selection:
      NewProcessName|endswith: \tscon.exe
    selection_system:
      SubjectUserSid: S-1-5-18
    condition: selection and selection_system
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4688 --field NewProcessName~tscon.exe --format
    llm
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 1 --field Image~tscon.exe
    --format llm
  pivots:
  - 'CommandLine <session id> /dest:<rdp-tcp#N>: which session was hijacked'
  - LocalSessionManager 25 (reconnect) and Security 4778 without a matching authentication (no 1149 /
    4624 type 10) in that window
  - Service creation (7045 / sc.exe) running cmd /k tscon ... as the way to get SYSTEM
  false_positives:
  - Administrators legitimately switching sessions on RDS hosts
  severity: high
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_tscon_rdp_session_hijacking.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_tscon_localsystem.yml
  - https://raw.githubusercontent.com/mitre/cti/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-to-MITRE-Attack/TA0005-Defense Evasion/T1027-Obfuscated Files or Information/ID4688-Obfuscated
    payload transfer via service name - Tchopper.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/Security/DetailedTracking/ProcessCreation/Sec_4688_Med_ProcExec_RDP-Hijacking.yml
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/4688: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states. JPCERT
    sheets mentioning the same event ids/tools: net-user (informational). || Original notes: Sigma-only
    logic; the SYSTEM-context requirement reflects the documented technique (no password needed when run
    as SYSTEM). Sysmon 1 gives User and IntegrityLevel; 4688 gives SubjectUserSid/TokenElevationType.'
- id: FH-LAT-020
  title: Impacket smbexec service pattern (BTOBTO / batch file with __output redirection)
  tactic: lateral-movement
  attack:
  - T1021.002
  - T1569.002
  channel: System
  provider: Service Control Manager
  event_ids:
  - 7045
  - 4697
  prerequisites:
  - System log (7045); Security System Extension auditing for 4697
  logic:
    selection:
      EventID: 7045
      Provider: Service Control Manager
    name:
      ServiceName|contains: BTOBTO
    image:
      ImagePath|contains:
      - '.bat & del '
      - __output 2^>^&1 >
    condition: selection and (name or image)
  forhunt:
  - forhunt search <paths> --channel System --event-id 7045 --field ImagePath~__output --format llm
  - forhunt search <paths> --channel System --event-id 7045 --field ServiceName~BTOBTO --format llm
  pivots:
  - Each executed command creates and deletes a service with an ImagePath that echoes the command into
    a .bat and runs it; expect many 7045 events in a row
  - Parent services.exe running cmd.exe /Q /c echo ... (FH-LAT-008)
  - 4624 type 3 and 5145 on C$ or ADMIN$ for the __output file
  false_positives:
  - Essentially none for the ImagePath pattern; the service name is attacker-configurable
  severity: high
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/service_control_manager/win_system_hack_smbexec.yml
  - https://github.com/WithSecureLabs/chainsaw/blob/master/rules/evtx/service_installation/smbexec.yml
  - 'sample: EVTX-to-MITRE-Attack/TA0002-Execution/T1569.002-Service execution/ID7000,7009,7045-Payload
    deployed via service - Tchopper.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - 'sample: EVTX-to-MITRE-Attack/TA0008-Lateral Movement/T1021.002-SMB Windows Admin Shares/ID4688,4697,5140-5145
    PSexec remote execution + admin share.evtx'
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  verified: true
  notes: 'VERIFIED 2026-10-21. Confirmations per event id: System/7045: MITRE CTI data-component log source,
    rule project, real sample log; Security/4697: MITRE CTI data-component log source, Microsoft docs,
    rule project, real sample log. || Original notes: Two separate rule sets (Sigma and Chainsaw) use
    the same ImagePath fragments, but both derive from the Impacket source, so independence is limited
    to the log-field semantics (EventID 7045, ServiceName, ImagePath), which JPCERT''s PsExec sheet also
    confirms for 7045. Newer Impacket lets the operator rename the service.'
- id: FH-LAT-021
  title: WMI-Activity provider activity on target (5857/5860/5861) alongside remote logon
  tactic: lateral-movement
  attack:
  - T1047
  channel: Microsoft-Windows-WMI-Activity/Operational
  provider: Microsoft-Windows-WMI-Activity
  event_ids:
  - 5857
  - 5860
  - 5861
  prerequisites:
  - Microsoft-Windows-WMI-Activity/Operational log present (enabled by default on modern Windows)
  logic:
    selection:
      EventID: 5857
      HostProcess: wmiprvse.exe
    condition: selection and ProviderName in (Win32_Process provider, CommandLineEventConsumer, ActiveScriptEventConsumer)
      within 60s after a 4624 LogonType 3
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-WMI-Activity/Operational --event-id 5857,5860,5861
    --format llm
  pivots:
  - ProviderName and ProviderPath in 5857 show which WMI provider DLL was loaded (for example cimwin32.dll
    for Win32_Process.Create, wbemcons.dll for event consumers)
  - 5860/5861 are temporary/permanent event consumer registrations - persistence rather than one-shot
    execution
  - WmiPrvSE children (FH-LAT-007)
  false_positives:
  - '5857 fires for any WMI provider load: management software and Windows itself cause constant noise'
  severity: low
  sources:
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/wmic.htm
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/wmiexec-vbs.htm
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/WMI-Activity_Op/WMI_5857_Info_ProviderStarted.yml
  - https://github.com/Yamato-Security/hayabusa-rules/blob/main/hayabusa/builtin/WMI-Activity_Op/WMI_5861_Med_FilterToConsumerBinding_CmdExec.yml
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-WMI-Activity/Operational/5857: MITRE
    CTI data-component log source, rule project; MW-WMI-Activity/Operational/5860: MITRE CTI data-component
    log source, rule project; MW-WMI-Activity/Operational/5861: MITRE CTI data-component log source, rule
    project.  Open: field name not found in any real log, Microsoft/Sysmon doc or rule (HostProcess).
    || Original notes: JPCERT lists WMI-Activity 5857 on the destination host for WMI-based tools and
    Hayabusa''s sample shows the ProviderName / HostProcess / ProviderPath UserData fields. Which provider
    maps to which technique (cimwin32.dll for Win32_Process) is common knowledge but not cited in the
