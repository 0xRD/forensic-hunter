- id: FH-LAT-012
  title: Pass-the-hash heuristic - NTLM network logon with null subject SID and KeyLength 0
  tactic: lateral-movement
  attack:
  - T1550.002
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4624
  prerequisites:
  - Audit Logon (Success)
  logic:
    selection:
      EventID: 4624
      LogonType: 3
      LogonProcessName: NtLmSsp
      AuthenticationPackageName: NTLM
      SubjectUserSid: S-1-0-0
      KeyLength: 0
    filter_anonymous:
      TargetUserName: ANONYMOUS LOGON
    condition: selection and not filter_anonymous
  forhunt:
  - forhunt search <paths> --channel Security --event-id 4624 --field LogonType=3 --field LogonProcessName=NtLmSsp
    --field KeyLength=0 --format llm
  pivots:
  - 'TargetUserName and IpAddress: is a local or domain admin authenticating from a workstation that never
    did before?'
  - 4672 (special privileges) with the same TargetLogonId on the target
  - 'Credential theft on the source: Sysmon 10 to lsass.exe, 4688 for mimikatz-like tools (see credential-access
    checklist)'
  - Compare with Kerberos logons for the same account/host pair; PtH forces NTLM where Kerberos would
    be normal
  false_positives:
  - Old clients and applications using NTLMv1 or no session security, file-share browsing by IP address
  - Many legitimate NTLM network logons also report KeyLength 0
  severity: low
  sources:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/account_management/win_security_pass_the_hash_2.yml
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/RemoteLogin-Mimikatz.htm
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/RemoteLogin-WCE.htm
  - https://github.com/JPCERTCC/ToolAnalysisResultSheet/blob/master/details/PsExec.htm
  - 'sample: EVTX-to-MITRE-Attack/TA0007-Discovery/T1069-Permission Groups Discovery/ID4799-4624-Local
    admin group enumerated by SharpHound.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/windowsserverdocs/blob/main/WindowsServerDocs/identity/ad-ds/plan/Appendix-L--Events-to-Monitor.md
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: Security/4624: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states: The
    KeyLength 0 heuristic (Sigma, citing Microsoft/NSA-era guidance I could not open) depends on NTLM
    version and client; use it only to rank NTLM logons, never as proof. JPCERT sheets mentioning the
    same event ids/tools: net-user (informational). || Original notes: CONTRADICTED IN PART: JPCERT lab
    runs of Mimikatz pass-the-hash and WCE remote login recorded 4624 type 3 NtLmSsp with KeyLength 128,
    not 0, and even plain PsExec with a password shows NTLM/128. The KeyLength 0 heuristic (Sigma, citing
    Microsoft/NSA-era guidance I could not open) depends on NTLM version and client; use it only to rank
    NTLM logons, never as proof. Better signal: NTLM used where Kerberos is expected plus the credential-theft
    evidence on the source.'
