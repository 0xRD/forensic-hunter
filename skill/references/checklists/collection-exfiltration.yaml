- id: FH-COLL-011
  title: Screen capture and input capture via PowerShell or tools
  tactic: collection-exfiltration
  attack:
  - T1113
  - T1056.001
  channel: Microsoft-Windows-PowerShell/Operational
  provider: Microsoft-Windows-PowerShell
  event_ids:
  - 4104
  prerequisites:
  - PowerShell Script Block Logging enabled
  logic:
    selection:
      EventID: 4104
      ScriptBlockText|contains:
      - CopyFromScreen
      - System.Drawing.Bitmap
      - GetAsyncKeyState
      - SetWindowsHookEx
      - Get-Screenshot
      - Get-Keystrokes
    condition: selection
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-PowerShell/Operational --event-id 4104 --field
    ScriptBlockText~CopyFromScreen --format llm
  pivots:
  - Sysmon 11 for image files (.png/.jpg/.bmp) created in temp/user-writable paths by powershell.exe
  false_positives:
  - Support and monitoring tools, UI automation, legitimate screen capture scripts
  severity: low
  sources:
  - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-to-MITRE-Attack/TA0007-Discovery/T1016-System Network Configuration Discovery/ID800-4103-4104-Firewall
    configuration enumerated (PowerShell).evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-PowerShell/Operational/4104: MITRE CTI
    data-component log source, rule project, real sample log.  Open: literal value not found in any opened
    source (System.Drawing.Bitmap; SetWindowsHookEx). || Original notes: Entirely analyst knowledge on
    API names; no opened source covers screen capture. Treat as exploratory.'
- id: FH-COLL-012
  title: Outlook mail store (PST/OST) created or copied (Sysmon 11)
  tactic: collection-exfiltration
  attack:
  - T1114.001
  - T1114.002
  channel: Microsoft-Windows-Sysmon/Operational
  provider: Microsoft-Windows-Sysmon
  event_ids:
  - 11
  prerequisites:
  - Sysmon with event 11 rules including .pst/.ost
  logic:
    selection:
      EventID: 11
      TargetFilename|endswith:
      - .pst
      - .ost
    filter_outlook:
      Image|endswith: \OUTLOOK.EXE
    condition: selection and not filter_outlook
  forhunt:
  - forhunt search <paths> --channel Microsoft-Windows-Sysmon/Operational --event-id 11 --field TargetFilename~.pst
    --format llm
  pivots:
  - Image creating the PST (powershell, cmd, unknown) and Sysmon 1 command line (New-MailboxExportRequest
    on Exchange servers is logged elsewhere)
  - PST in staging directory then archive/upload (COLL-003/001)
  false_positives:
  - Mail migration tools, backups, users exporting archives
  severity: medium
  sources:
  - https://raw.githubusercontent.com/MicrosoftDocs/sysinternals/main/sysinternals/downloads/sysmon.md
  - 'sample: EVTX-to-MITRE-Attack/TA0004-Privilege Escalation/T1068-Exploitation for Privilege Escalation/ID12-13
    Mini_Plasma_PoC_AbortHydration_ArbitraryRegKey_EoP.evtx'
  - https://github.com/mitre/cti/blob/master/enterprise-attack/enterprise-attack.json
  - https://github.com/MicrosoftDocs/sysinternals/blob/main/sysinternals/downloads/sysmon.md
  verified: false
  notes: 'NOT VERIFIED 2026-10-21. Confirmations per event id: MW-Sysmon/Operational/11: MITRE CTI data-component
    log source, Microsoft docs, rule project, real sample log.  Open: event ids, channel and fields are
    confirmed (see above) but the detection logic goes beyond what any opened rule/source states: A specific
    Sigma rule for PST creation was looked for but not found at the guessed path. || Original notes: A
    specific Sigma rule for PST creation was looked for but not found at the guessed path. Check is analyst
    design. On Exchange the mailbox export request appears in Exchange audit logs, not EVTX.'
- id: FH-COLL-013
  title: USB mass storage connected (Security 6416)
  tactic: collection-exfiltration
  attack:
  - T1052.001
  - T1091
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 6416
  prerequisites:
  - Audit PNP Activity (Success) in Detailed Tracking
  logic:
    selection:
      EventID: 6416
      ClassName: DiskDrive
    selection_desc:
      EventID: 6416
      DeviceDescription: USB Mass Storage Device
    condition: selection or selection_desc
  forhunt:
  - forhunt search <paths> --channel Security --event-id 6416 --format llm
  pivots:
  - DeviceId / HardwareIds for the device serial; SubjectUserName / SubjectLogonId -> 4624 for who was
    logged in
  - Then 4663 against removable drives if Removable Storage auditing is on (COLL-015)
  false_positives:
