- id: FH-DEF-015
  title: Firewall disabled or broadly opened via netsh
  tactic: defense-evasion
  attack:
  - T1686.003
  - T1562.004
  channel: Security
  provider: Microsoft-Windows-Security-Auditing
  event_ids:
  - 4688
  - 1
  prerequisites:
  - Audit Process Creation (Success) plus GPO "Include command line in process creation events" (4688
    CommandLine) or Sysmon installed with a config that logs event 1 (process creation)
  logic:
    selection_img:
      NewProcessName|endswith: \netsh.exe
    selection_off_advfirewall:
      CommandLine|contains|all:
      - advfirewall
      - set
      - state
      - 'off'
    selection_off_legacy:
      CommandLine|contains|all:
      - firewall
      - set
      - opmode
      - disable
    condition: selection_img and (selection_off_advfirewall or selection_off_legacy)
